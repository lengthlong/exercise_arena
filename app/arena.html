<title>Sophia's Exercise Arena</title>

<style>
/* Layout: an exercise book — ruled paper, a red margin line on each question, ticks and crosses in a marking-pen hand; Sophia writes in fountain-pen blue. */
:root {
  --paper: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --ink: #1b2231;
  --muted: #5a6376;
  --rule: #e1e6ef;
  --line: #c8d0de;
  --pen: #2547a8;
  --pen-ink: #ffffff;
  --pen-soft: #e3e9fb;
  --red: #c42f27;
  --red-soft: #fbe6e4;
  --green: #1f7a4a;
  --green-soft: #e0f2e8;
  --amber: #a8690f;
  --amber-soft: #fbefd9;
  --hl: #ffe57a;
  --hl-ink: #1b2231;
  --c-right: #1f7a4a;
  --c-partial: #d69e1a;
  --c-wrong: #b3261e;
  --font-body: "Lexend", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-hand: "Patrick Hand", "Lexend", "Noto Sans SC", cursive;
  --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Lexend", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141b; --surface: #191e28; --surface-2: #212734; --ink: #e5e9f1; --muted: #9ba4b6;
    --rule: #242b39; --line: #353e50; --pen: #8ea7ff; --pen-ink: #0e1220; --pen-soft: #232c4a;
    --red: #ff7b70; --red-soft: #3a1c1c; --green: #64d295; --green-soft: #15301f; --amber: #f0b862; --amber-soft: #36280f;
    --hl: #6b5a12; --hl-ink: #fff4c4; --c-right: #1f9a80; --c-partial: #bb891c; --c-wrong: #de4b74;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --surface: #191e28; --surface-2: #212734; --ink: #e5e9f1; --muted: #9ba4b6;
  --rule: #242b39; --line: #353e50; --pen: #8ea7ff; --pen-ink: #0e1220; --pen-soft: #232c4a;
  --red: #ff7b70; --red-soft: #3a1c1c; --green: #64d295; --green-soft: #15301f; --amber: #f0b862; --amber-soft: #36280f;
  --hl: #6b5a12; --hl-ink: #fff4c4; --c-right: #1f9a80; --c-partial: #bb891c; --c-wrong: #de4b74;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 15.5px/1.6 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
a { color: var(--pen); text-underline-offset: 2px; }
[lang="zh"], .zh { font-family: var(--font-zh); }
mark { background: var(--hl); color: var(--hl-ink); padding: 0 .15em; border-radius: 3px; }

.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 64px; display: grid; gap: 18px; }
@media (min-width: 720px) { .wrap { padding-inline: 28px; } }

/* tab bar: first line of the page, sticks to the top */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); background: var(--paper); margin-top: -18px; padding-top: 6px; }
.tabs button { border: 0; background: none; padding: 8px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font-zh); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--pen); font-weight: 500; }

/* generic */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.grow { flex: 1 1 auto; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.h2 { font: 600 17px/1.3 var(--font-body); margin: 0; text-wrap: balance; }
.h3 { font: 500 12px/1.4 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }

.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); font-weight: 500; }
.btn.danger { color: var(--red); border-color: var(--red); background: none; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; line-height: 1.3; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--rule); white-space: nowrap; }
.chip.s-english { color: var(--pen); }
.chip.s-math { color: var(--amber); }
.chip.s-science { color: var(--green); }
.chip.test { color: var(--red); border-color: var(--red); }
.note { font-size: 13.5px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.note.err { background: var(--red-soft); color: var(--red); }
.note.ok { background: var(--green-soft); color: var(--green); }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
label.f > span { font-family: var(--font-zh); }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 15px;
}
textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 12px; }
.num { font-variant-numeric: tabular-nums; }

/* home */
.hello { display: grid; gap: 6px; }
.hello .day { font: 400 13px var(--font-body); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.hello h1 { margin: 0; font: 600 clamp(24px, 4vw, 32px)/1.15 var(--font-body); letter-spacing: -.015em; text-wrap: balance; }
.today { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.today .big { font: 400 64px/1 var(--font-hand); color: var(--red); min-width: 1.4ch; text-align: center; }
.today .txt { display: grid; gap: 8px; min-width: 0; }
.today-papers { grid-column: 1 / -1; display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
.plan .sub, .review .sub { display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 12px; }
.days7 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.days7 li { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.days7 .d { font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: clip; white-space: nowrap; }
@media (max-width: 480px) { .days7 { gap: 4px; } .days7 .d { font-size: 11px; letter-spacing: -.02em; } }
.days7 .n { font: 400 24px/1 var(--font-hand); color: var(--pen); }
.days7 li.zero .n { color: var(--muted); }
.days7 li.is-today { border-color: var(--pen); background: var(--pen-soft); }
.days7 li.is-today .d { color: var(--pen); font-weight: 600; }
.plan-line { margin: 0; font-size: 14.5px; }
.checklist, .tips, .mastered { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14.5px; }
.checklist li, .mastered li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tick { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); color: var(--muted); font-size: 12px; flex: none; }
.tick.ok { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 700; }
.tips li { position: relative; padding-left: 18px; }
.tips li::before { content: "→"; position: absolute; left: 0; color: var(--pen); }
.rv-head { display: flex; align-items: baseline; gap: 10px; }
.rv-n { font: 400 48px/1 var(--font-hand); color: var(--red); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; }

/* question sheet */
.sheet { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 18px 30px; display: grid; gap: 12px; min-width: 0;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); background-position: 0 14px; }
.sheet::before { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 1.5px; background: var(--red); opacity: .55; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qno { font: 400 22px/1 var(--font-hand); color: var(--red); margin-right: 4px; }
.stem { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.65; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.imgs img { max-width: 100%; max-height: 420px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.imgs.thumbs img { max-height: 96px; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.opt .l { font: 600 14px/1.6 var(--font-body); color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt[aria-pressed="true"] .l { color: var(--pen); }
.opt.is-right { border-color: var(--green); background: var(--green-soft); }
.opt.is-wrong { border-color: var(--red); background: var(--red-soft); }
.answer-in { font-family: var(--font-hand); font-size: 20px; color: var(--pen); }
.mark { display: inline-flex; align-items: center; gap: 8px; font: 400 26px/1 var(--font-hand); }
.mark.right { color: var(--green); }
.mark.partial { color: var(--amber); }
.mark.wrong { color: var(--red); }
.solution { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.solution .ans { font-weight: 500; }
.solution .exp { white-space: pre-wrap; overflow-wrap: anywhere; }
.selfmark { display: flex; flex-wrap: wrap; gap: 8px; }
.selfmark button { font: 400 19px/1 var(--font-hand); padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.selfmark button[data-r="right"] { color: var(--green); border-color: var(--green); }
.selfmark button[data-r="partial"] { color: var(--amber); border-color: var(--amber); }
.selfmark button[data-r="wrong"] { color: var(--red); border-color: var(--red); }
.selfmark button[aria-pressed="true"][data-r="right"] { background: var(--green-soft); }
.selfmark button[aria-pressed="true"][data-r="partial"] { background: var(--amber-soft); }
.selfmark button[aria-pressed="true"][data-r="wrong"] { background: var(--red-soft); }
.progress { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pen); }
.score { font: 400 48px/1 var(--font-hand); color: var(--red); }

/* ladder dots */
.ladder { font-family: var(--font-body); letter-spacing: 1px; color: var(--pen); font-size: 12px; white-space: nowrap; }
.ladder.m { color: var(--green); letter-spacing: 0; }

/* parent lists */
.list { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 14px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.item .side { display: grid; justify-items: end; gap: 2px; font-size: 12.5px; color: var(--muted); }
.empty { padding: 22px 16px; text-align: left; color: var(--muted); display: grid; gap: 6px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl th { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.tbl select { padding: 4px 6px; font-size: 13px; width: auto; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); }
.checks input { margin: 0; }
.draft { border-left: 3px solid var(--pen); }
.bank { display: flex; flex-wrap: wrap; gap: 6px; }
details.photos > summary { cursor: pointer; font-size: 13px; color: var(--pen); width: fit-content; }
details.photos[open] > summary { margin-bottom: 6px; }
.why { display: grid; gap: 8px; }
.why-sec { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.why-sec.watch { border-left-color: var(--amber); }
.why-h { font: 600 12px/1.4 var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.why p, .exp p { margin: 2px 0; }
.why ol, .why ul { margin: 2px 0; padding-left: 20px; }
.pager { justify-content: center; }
.cheer { display: grid; gap: 8px; }
.cheer-msg { margin: 0; font: 400 24px/1.25 var(--font-hand); color: var(--pen); text-wrap: balance; }
.cheer-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.streak { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.streak-n { font: 400 24px/1 var(--font-hand); color: var(--red); }
.streak-l { font-size: 13px; color: var(--muted); }
.badge { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.badge.earned { background: var(--amber-soft); border-color: var(--amber); color: var(--ink); }
.badge.next { color: var(--muted); border-style: dashed; }
.dash { gap: 18px; }
.dash-block { display: grid; gap: 6px; min-width: 0; }
.meter { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; max-width: 440px; height: auto; display: block; }
.chart .ch-val { font: 500 11px var(--font-body); fill: var(--muted); }
.chart .ch-x { font: 400 11px var(--font-body); fill: var(--muted); }
.chart .ch-hit:hover { fill: var(--surface-2); fill-opacity: .5; }
.ladder-bars { display: grid; gap: 6px; }
.lb-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 32px; gap: 8px; align-items: center; font-size: 13px; }
.lb-k { color: var(--muted); }
.lb-bar { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.lb-bar i { display: block; height: 100%; background: var(--pen); border-radius: 3px; }
.lb-bar i.m { background: var(--green); }
.lb-v { text-align: right; }
.pager button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs button:disabled { opacity: .4; cursor: not-allowed; }
.opt.word { grid-template-columns: auto; padding: 6px 12px; }
.stem u { text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.setcard { border-left: 3px solid var(--amber); }
.material { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 10px 14px; display: grid; gap: 8px; min-width: 0; }
.material > summary { cursor: pointer; font-weight: 500; }
.material .stem { font-size: 15.5px; }
.member { margin-left: 14px; }
/* 录入：照片大按钮、缩略图、科目与 AI识别 一行 */
.pick { position: relative; display: grid; justify-items: center; gap: 2px; padding: 22px 16px; border: 2px dashed var(--pen); border-radius: var(--r); background: var(--pen-soft); color: var(--pen); cursor: pointer; text-align: center; }
.pick:hover { border-style: solid; }
.pick:focus-within { outline: 2px solid var(--pen); outline-offset: 2px; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.pick-main { font: 600 19px/1.3 var(--font-zh); }
.pick-sub { font-size: 13px; color: var(--muted); }
.pick.off { border-color: var(--line); background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.tray { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tray-item { position: relative; }
.tray-item img { display: block; height: 84px; max-width: 140px; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.tray-x { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1; cursor: pointer; }

.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); }
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

const GAPS = [0, 1, 2, 4, 7];
function pad2(n) { return String(n).padStart(2, '0'); }
function localToday(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(iso, n) {
  const p = String(iso).split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}
function deriveState(createdAt, attempts) {
  let step = 1, due = addDays(createdAt, 1), mastered = false, wrongCount = 1, lastAttemptAt = null;
  for (const a of attempts || []) {
    lastAttemptAt = a.date;
    if (mastered) {
      if (a.result === 'wrong') { mastered = false; step = 1; due = addDays(a.date, 1); wrongCount++; }
      continue;
    }
    if (a.result === 'right') {
      if (step === 4) { mastered = true; due = null; }
      else { step++; due = addDays(a.date, GAPS[step]); }
    } else if (a.result === 'partial') {
      due = addDays(a.date, GAPS[step]);
    } else {
      step = 1; due = addDays(a.date, 1); wrongCount++;
    }
  }
  return { step, due, mastered, wrongCount, lastAttemptAt };
}
function normAnswer(s) {
  return String(s == null ? '' : s).toLowerCase().trim().replace(/\s+/g, ' ').replace(/\.$/, '').trim();
}
function asNumber(t) {
  const u = t.replace(/(\d),(?=\d{3}(\D|$))/g, '$1').replace(/\s/g, '');

}

const CAUSES = [['concept', '概念没懂', "Didn't get the idea"], ['misread', '审题错', 'Misread the question'], ['careless', '粗心', 'Careless slip'], ['incomplete', '答法不完整', 'Incomplete answer']];
const CAUSE = Object.fromEntries(CAUSES.map(c => [c[0], { zh: c[1], en: c[2] }]));
const FORMATS = [['mcq', '选择'], ['pick', '选词'], ['short', '短答'], ['open', '主观']];
const RESULT = { right: { en: 'Right', zh: '对', sym: '✓' }, partial: { en: 'Partly', zh: '部分对', sym: '½' }, wrong: { en: 'Wrong', zh: '错', sym: '✗' } };
const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

const IDX = {};
for (const s of Object.keys(TAX)) {
  const t = TAX[s];
  IDX[s] = {
    layer: Object.fromEntries(t.layers.map(l => [l[0], { zh: l[1], en: l[2] }])),
    topic: Object.fromEntries(t.topics.map(x => [x[0], { layer: x[1], zh: x[2], en: x[3] }])),
    concept: Object.fromEntries(t.concepts.map(x => [x[0], { topic: x[1], zh: x[2], en: x[3] }])),
    qtype: Object.fromEntries(t.qtypes.map(x => [x[0], { zh: x[1], en: x[2] }]))
  };
}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hl = s => esc(s).replace(/\[\[(.+?)\]\]/g, '<mark>$1</mark>');
// 题组材料与题目文字里 [[ ]] 显示为下划线（改错的划线词）；讲解与标准答法里用 hl 高亮
const ul = s => esc(s).replace(/\[\[(.+?)\]\]/g, '<u>$1</u>');
const plain = s => String(s || '').replace(/\[\[(.+?)\]\]/g, '$1');
const nameOf = (s, kind, id) => (IDX[s] && IDX[s][kind][id]) || null;
const topicLabel = (s, id, lang) => { const t = nameOf(s, 'topic', id); return t ? (lang === 'zh' ? t.zh : t.en) : (id || '—'); };
const blobUrl = id => '/_blob/' + id;
const fmtDate = iso => { if (!iso) return '—'; const p = iso.split('-'); return Number(p[2]) + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(p[1]) - 1]; };
const ladderHtml = e => e.mastered ? '<span class="ladder m" title="已掌握">★ mastered</span>' : `<span class="ladder" title="复习阶梯第 ${e.step} 级">${'●'.repeat(e.step)}${'○'.repeat(4 - e.step)}</span>`;
const subjChip = s => `<span class="chip s-${esc(s)}">${esc(SUBJ[s] ? SUBJ[s].en : s)}</span>`;
function mapLink(subject, id, label) {
  if (!id || !MAPS[subject]) return esc(label);
  return `<a href="${MAPS[subject]}#${encodeURIComponent(id)}" target="_blank" rel="noopener">${esc(label)}</a>`;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 无本地存储时忽略 */ } }
};

/* ---------- 状态 ---------- */
const S = {
  status: 'loading',            // loading | ready | nodb
  tab: store.get('arena.tab') || 'today',   // today | record | exercises | papers | settings
  db: null, assets: null, sample: null, downloads: null, imgLimits: null,
  exercises: [], papers: [], settings: readSettings(null),
  run: null,                    // 练习侧正在做的每日重做或检验卷
  sets: [], setDrafts: [], setEdit: null,
  drafts: [], recSubject: '', recText: '', recPhotos: [], recBusy: false, recMsg: null, saveMsg: null,   // recPhotos: {file, url, assetId}；recMsg 只放 AI 识别的状态
  filters: { subject: '', topic: '', cause: '', state: '' },
  detailId: null, confirmDel: null,
  paperForm: { subject: 'science', topics: [], count: 10 }, paperPreview: null, paperMsg: null, paperView: null, listSort: { key: 'recorded', dir: 'desc' }, listPage: 1, exportMsg: null,
  settingsMsg: null, errMsg: null   // errMsg：写数据出错，显示在当前标签页最上方
};
let draftSeq = 1, setSeq = 1;
const pendingPos = {};

/* ---------- 题组 ---------- */
function setById(id) { return S.sets.find(x => x.id === id); }
function liveSets(subject) { return S.sets.filter(x => x.subject === subject && S.exercises.some(e => e.setId === x.id)); }
function nextPos(setId) {
  let m = pendingPos[setId] || 0;
  for (const e of S.exercises) if (e.setId === setId && (e.setPos || 0) > m) m = e.setPos || 0;
  pendingPos[setId] = m + 1;
  return m + 1;
}
async function cleanupSet(setId, goneId) {
  if (!setId) return;
  if (!S.exercises.some(e => e.setId === setId && e.id !== goneId)) await S.db.doc('sets/' + setId).delete();
}
function photosBlock(ids, alt) {
  // 照片默认收起：「Show photo (n)」，点开才显示
  if (!ids || !ids.length) return '';
  return `<details class="photos"><summary>Show photo (${ids.length})</summary><div class="imgs">${ids.map(id => `<img src="${blobUrl(id)}" alt="${alt}" loading="lazy">`).join('')}</div></details>`;

function materialBlock(set, open) {

}
const setChip = e => { const x = e.setId && setById(e.setId); return x ? `<span class="chip">题组 · ${esc(x.title || '未命名')}</span>` : ''; };
function newSetDraft(x) {
  x = x || {};
  return { key: setSeq++, subject: SUBJ[x.subject] ? x.subject : '', title: String(x.title || ''), text: String(x.text || ''), source: String(x.source || ''), images: Array.isArray(x.images) ? x.images.slice() : [], wordBank: parseList(x.wordBank).join('; '), savedId: null, error: '' };
}
function setDraftByKey(k) { return k === 'edit' ? S.setEdit : S.setDrafts.find(x => x.key === Number(k)); }
function setOfDraft(d) {
  if (!d.setRef) return null;
  if (String(d.setRef).startsWith('new:')) return setDraftByKey(String(d.setRef).slice(4)) || null;
  return setById(d.setRef) || null;
}
function draftsInOrder() {
  const fresh = S.drafts.filter(d => !d.editId);
  const out = [];
  for (const sd of S.setDrafts) out.push(...fresh.filter(d => d.setRef === 'new:' + sd.key));
  return out.concat(fresh.filter(d => !out.includes(d)));
}

/* ---------- 渲染 ---------- */
function locked() {
  if (S.run) return true;
  if (S.tab === 'record' && (S.drafts.length || S.setDrafts.length)) return true;
  if (S.tab === 'exercises' && (S.drafts.some(d => d.editId) || S.setEdit)) return true;
  return false;
}
function softRender() { if (!locked()) render(); }

const TABS = [['today', 'Today'], ['record', '录入'], ['exercises', '错题'], ['papers', '检验卷'], ['settings', '设置']];
function render() {
  const app = $('#app');
  let h = `<nav class="tabs" aria-label="Tabs">${TABS.map(t => `<button type="button" data-act="tab" data-v="${t[0]}" aria-pressed="${S.tab === t[0]}" ${S.run ? 'disabled' : ''}>${t[1]}</button>`).join('')}</nav>`;
  if (S.status === 'loading') h += `<div class="panel"><p class="muted">Opening the exercise book…</p></div>`;
  else if (S.status === 'nodb') h += `<div class="panel"><p class="h2 zh">数据不可用</p><p class="zh muted">请用家长的 claude.ai 账号打开本页。练习场的错题和作答都存在页面的数据库里，只有登录后才能读写。</p></div>`;
  else if (S.errMsg && !S.run) h += `<p class="note err zh">${esc(S.errMsg)}</p>`;

/* ---------- Today ---------- */
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const wd = iso => { const p = iso.split('-').map(Number); return WD[new Date(p[0], p[1] - 1, p[2]).getDay()]; };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const tick = ok => ok ? '<span class="tick ok" aria-label="done">✓</span>' : '<span class="tick" aria-label="not yet">○</span>';
function renderPractice() {
  if (S.run) return S.run.kind === 'daily' ? renderDaily() : renderPaperRun();
  const today = localToday();
  const dateLine = new Date().toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'long' });
  if (!S.exercises.length) {
    return `<section class="hello"><span class="day">${dateLine}</span><h1>Hi Sophia</h1></section>
      <div class="panel"><p class="h2">Your exercise book is empty</p><p class="muted">When a wrong answer gets recorded, it shows up here the next day for a redo. Add the questions from the last worksheet or test in 录入.</p></div>`;
  }
  const due = dailyList(S.exercises, today, S.settings.dailyLimit);
  const open = S.papers.filter(p => p.status === 'open').sort((a, b) => String(b.createdAt).localeCompare(a.createdAt));
  const db = dashboardData(S.exercises, today);

      <span class="streak"><span class="streak-n num">${db.streak}</span><span class="streak-l">day${db.streak === 1 ? '' : 's'} in a row${db.doneToday || !db.streak ? '' : ' · do today to keep it'}</span></span>
      ${badges}${nextB}

}

/* 今天：每日重做与未做的检验卷 */
function todayBlock(today, due, open) {
  const allDue = S.exercises.filter(e => !e.mastered && e.due && e.due <= today).length;
  const next = S.exercises.filter(e => !e.mastered && e.due && e.due > today).map(e => e.due).sort()[0];
  let h = `<section class="today" aria-label="Today">
    <div class="big num" aria-hidden="true">${due.length}</div>
    <div class="txt">
      <p class="h2">${due.length ? `${plural(due.length, 'question')} to redo today` : 'Nothing due today'}</p>
      <p class="muted small">${due.length ? (allDue > due.length ? `${allDue} are due; today's set is capped at ${S.settings.dailyLimit}.` : 'Each one you get right moves up the ladder and comes back less often.') : (next ? `Next redo comes up on ${fmtDate(next)}.` : 'Everything here is mastered.')}</p>
      ${due.length ? `<div><button type="button" class="btn primary" data-act="start-daily">Start today's redo</button></div>` : ''}

    h += `<div class="today-papers"><p class="h3">Check papers to do</p><div class="list">${open.map(p => `

        <span class="side"><span>${p.exerciseIds.length} questions</span></span>

  return h + `</section>`;
}

/* 计划：未来 7 天的预计题数与本周目标 */
function planBlock(plan, today) {
  const st = S.settings, ws = weekStart(today);

    <p class="plan-line">${esc(planLine(plan, st.dailyLimit, fmtDate))}</p>
    <div class="sub"><p class="h3">This week</p><ul class="checklist">${goals.join('')}</ul></div>

/* 回顾：最近 7 天 */
function reviewBlock(plan, week) {
  const st = S.settings;
  const checks = goalChecks(week, st);
  const tips = weekTips(plan, week, checks, st, t => topicLabel(t.subject, t.topic, 'en'));
  const label = g => {
    if (g.kind === 'concept') { const c = nameOf(g.subject, 'concept', g.id); return mapLink(g.subject, g.id, c ? c.en : g.id); }
    return esc(topicLabel(g.subject, g.id, 'en'));
  };
  const row = c => c.key === 'days' ? `Practised on ${c.value} of 7 days · goal ${c.goal}`
    : c.key === 'papers' ? `Check papers: ${c.value} · goal ${c.goal}`
    : c.ok ? 'Caught up' : `${c.value} question${c.value === 1 ? ' is' : 's are'} overdue`;
  let mastered = '';
  if (week.newlyMastered.length) mastered = `<ul class="mastered">${week.newlyMastered.map(g => `<li>${subjChip(g.subject)}<span>${label(g)}</span>${g.n > 1 ? `<span class="muted num">×${g.n}</span>` : ''}</li>`).join('')}</ul>`;
  else if (week.fallback) mastered = `<p class="small">${esc(week.fallback)}</p>`;
  return `<section class="panel review" aria-label="Last 7 days">
    <p class="h3">Last 7 days</p>
    <div class="rv-head"><span class="rv-n num">${week.questions}</span><span class="h2">question${week.questions === 1 ? '' : 's'} reviewed</span></div>
    <p class="small muted">${plural(week.answers, 'answer')}: ${week.right} right · ${week.partial} partly · ${week.wrong} wrong · practised on ${week.practised} of 7 days</p>
    <div class="legend small"><span><i style="background:var(--c-right)"></i>Right</span><span><i style="background:var(--c-partial)"></i>Partly</span><span><i style="background:var(--c-wrong)"></i>Wrong</span></div>
    ${activityChart(week.days)}
    ${mastered ? `<div class="sub"><p class="h3">Newly mastered</p>${mastered}</div>` : ''}
    <div class="sub"><p class="h3">Compared with your goals</p><ul class="checklist">${checks.map(c => `<li>${tick(c.ok)}<span>${row(c)}</span></li>`).join('')}</ul></div>
    <div class="sub"><p class="h3">Tips</p><ul class="tips">${tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
  </section>`;
}

function activityChart(days) {
  // 每天一根按对、部分对、错叠起来的柱子（最后一天是今天）；每天一个提示
  const n = days.length, slot = 40, bw = 24, W = n * slot, H = 120, top = 16, base = H - 20;
  const max = Math.max(1, ...days.map(d => d.right + d.partial + d.wrong));
  const sc = v => v / max * (base - top);
  const order = [['right', 'var(--c-right)'], ['partial', 'var(--c-partial)'], ['wrong', 'var(--c-wrong)']];
  let bars = '', labels = '';
  days.forEach((d, i) => {
    const x = i * slot + (slot - bw) / 2, tot = d.right + d.partial + d.wrong;
    let y = base;
    const segs = order.filter(([k]) => d[k] > 0);
    segs.forEach(([k, c], si) => {
      // 自下而上叠；除最上一段外，每段顶部留 2px 底色间隔
      const full = sc(d[k]), isTop = si === segs.length - 1;
      y -= full;
      const gap = isTop ? 0 : Math.min(2, full / 2);
      bars += `<rect x="${x}" y="${(y + gap).toFixed(1)}" width="${bw}" height="${Math.max(1, full - gap).toFixed(1)}" rx="${isTop ? 3 : 0}" fill="${c}"></rect>`;
    });
    if (!tot) bars += `<rect x="${x}" y="${base - 2}" width="${bw}" height="2" rx="1" fill="var(--line)"></rect>`;
    else labels += `<text x="${x + bw / 2}" y="${(base - sc(tot) - 4).toFixed(1)}" text-anchor="middle" class="ch-val">${tot}</text>`;
    labels += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" class="ch-x">${i === n - 1 ? 'Today' : wd(d.date)}</text>`;
    bars += `<rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent" class="ch-hit"><title>${fmtDate(d.date)}: ${d.right} right, ${d.partial} partly, ${d.wrong} wrong</title></rect>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Answers in the last ${n} days">${bars}${labels}<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"></line></svg>`;
}

/* 总进度：掌握进度与阶梯分布 */
function progressBlock(db) {
  const pct = db.total ? Math.round(db.mastered / db.total * 100) : 0;
  const steps = [['Step 1', db.ladder[1]], ['Step 2', db.ladder[2]], ['Step 3', db.ladder[3]], ['Step 4', db.ladder[4]], ['Mastered', db.ladder.mastered]];
  const maxStep = Math.max(1, ...steps.map(s => s[1]));
  return `<section class="panel dash" aria-label="Progress">
    <div class="dash-block">
      <div class="row"><p class="h3 grow">Mastered</p><span class="num"><b>${db.mastered}</b> / ${db.total}</span></div>
      <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${db.total}" aria-valuenow="${db.mastered}" aria-label="Mastered"><i style="width:${pct}%"></i></div>
      <p class="small muted">A question is mastered when you get it right at step 4.</p>
    </div>
    <div class="dash-block">
      <p class="h3">On the ladder</p>
      <div class="ladder-bars">${steps.map(([k, v]) => `<div class="lb-row"><span class="lb-k">${k}</span><span class="lb-bar"><i style="width:${(v / maxStep * 100).toFixed(1)}%" class="${k === 'Mastered' ? 'm' : ''}"></i></span><span class="lb-v num">${v}</span></div>`).join('')}</div>
      <p class="small muted">Ladder: day 1 → 3 → 7 → 14</p>
    </div>
  </section>`;
}

function exById(id) { return S.exercises.find(e => e.id === id); }

function bankOf(e) { const x = e.setId && setById(e.setId); return x ? parseList(x.wordBank) : []; }
function mustUseNote(e, response) {
  const c = mustUseCheck(response, e.mustUse);
  if (!c) return '';
  const out = c.missing.map(m => `Your answer must use "${m}".`);
  if (c.multi) out.push('Your answer must be one sentence.');
  return out.join(' ');
}
function questionBody(e, opts) {
  // opts: {no, name: input name prefix, response, locked, showCorrect}
  const o = opts || {};
  let h = `<div class="qhead">${o.no != null ? `<span class="qno">${o.no}.</span>` : ''}${subjChip(e.subject)}<span class="chip">${esc(topicLabel(e.subject, e.topic, 'en'))}</span>${e.test ? '<span class="chip test">TEST</span>' : ''}</div>`;
  if (e.stem) h += `<div class="stem">${ul(e.stem)}</div>`;
  h += photosBlock(e.images, 'Question photo');
  const r = o.response || '';
  if (e.format === 'mcq') {
    h += `<div class="opts" role="group" aria-label="Options">${(e.options || []).map((t, i) => {
      const L = LETTERS[i];
      let cls = '';
      if (o.showCorrect) { if (L === String(e.answer).toUpperCase()) cls = ' is-right'; else if (L === r) cls = ' is-wrong'; }
      return `<button type="button" class="opt${cls}" data-act="pick" data-key="${esc(o.key)}" data-v="${L}" aria-pressed="${r === L}" ${o.locked ? 'disabled' : ''}><span class="l">(${i + 1})</span><span>${esc(t)}</span></button>`;
    }).join('')}</div>`;
  } else if (e.format === 'pick' && bankOf(e).length) {
    // 选词：词表作为作答按钮，点选的词即回答
    h += `<div class="small muted">Choose from the word bank</div><div class="bank" role="group" aria-label="Word bank">${bankOf(e).map(w => {
      let cls = '';
      if (o.showCorrect) { if (normAnswer(w) === normAnswer(e.answer)) cls = ' is-right'; else if (w === r) cls = ' is-wrong'; }
      return `<button type="button" class="opt word${cls}" data-act="pick" data-key="${esc(o.key)}" data-v="${esc(w)}" aria-pressed="${r === w}" ${o.locked ? 'disabled' : ''}>${esc(w)}</button>`;
    }).join('')}</div>`;
  } else if (e.format === 'short' || e.format === 'pick') {
    h += `<label class="f"><span>Your answer</span><input type="text" class="answer-in" id="ans-${esc(o.key)}" data-ans="${esc(o.key)}" value="${esc(r)}" ${o.locked ? 'disabled' : ''} autocomplete="off"></label>`;
  } else {
    h += `<label class="f"><span>Your answer</span><textarea class="answer-in" id="ans-${esc(o.key)}" data-ans="${esc(o.key)}" rows="4" ${o.locked ? 'disabled' : ''}>${esc(r)}</textarea></label>`;
  }
  return h;
}

function explanationHtml(text) {
  const x = parseExplanation(text);
  if (!x.structured) return `<div class="exp">${x.paras.map(p => `<p>${hl(p)}</p>`).join('')}</div>`;
  let h = '<div class="exp why">';
  if (x.keyIdea) h += `<div class="why-sec"><div class="why-h">Key idea</div><p>${hl(x.keyIdea)}</p></div>`;
  if (x.steps.length) h += `<div class="why-sec"><div class="why-h">Steps</div><ol>${x.steps.map(t => `<li>${hl(t)}</li>`).join('')}</ol></div>`;
  if (x.watchOut.length) h += `<div class="why-sec watch"><div class="why-h">Watch out</div>${x.watchOut.length > 1 ? `<ul>${x.watchOut.map(t => `<li>${hl(t)}</li>`).join('')}</ul>` : `<p>${hl(x.watchOut[0])}</p>`}</div>`;
  return h + '</div>';
}
function solutionBlock(e) {
  let ans = '';
  if (e.format === 'mcq') { const i = LETTERS.indexOf(String(e.answer).toUpperCase()); ans = `(${i + 1}) ${e.options && e.options[i] != null ? e.options[i] : ''}`; }
  else ans = e.answer;
  const c = nameOf(e.subject, 'concept', e.concept), q = nameOf(e.subject, 'qtype', e.qtype);
  const links = [c ? 'Concept: ' + mapLink(e.subject, e.concept, c.en) : '', q ? 'Question type: ' + mapLink(e.subject, e.qtype, q.en) : ''].filter(Boolean).join(' · ');
  return `<div class="solution">
    <div><span class="muted small">${e.format === 'open' ? 'Model answer' : 'Correct answer'}</span><div class="ans">${e.format === 'open' ? hl(ans) : esc(ans)}</div></div>
    ${e.solution ? `<div><span class="muted small">Why</span>${explanationHtml(e.solution)}</div>` : ''}
    ${links ? `<div class="small muted">${links}</div>` : ''}
  </div>`;
}
const markHtml = r => `<span class="mark ${r}">${RESULT[r].sym} ${RESULT[r].en}</span>`;

function renderDaily() {
  const R = S.run;
  if (R.i >= R.ids.length) {
    const s = tally(R.results);
    return `<section class="panel"><p class="h3">Today's redo · done</p>
      <div class="row"><span class="score num">${s.right}/${R.ids.length}</span><span class="muted">${s.right} right · ${s.partial} partly · ${s.wrong} wrong</span></div>
      <p class="muted small">Wrong ones come back tomorrow. Right ones climb the ladder.</p>
      <div><button type="button" class="btn primary" data-act="exit-run">Back to today</button></div></section>`;
  }
  const e = exById(R.ids[R.i]);
  if (!e) { R.i++; return renderDaily(); }
  const pct = Math.round(R.i / R.ids.length * 100);
  let h = `<div class="progress"><span class="small muted num">Question ${R.i + 1} of ${R.ids.length}</span><div class="bar"><i style="width:${pct}%"></i></div><button type="button" class="btn ghost small" data-act="exit-run">Stop</button></div>`;
  if (e.setId) { const prev = R.i > 0 ? exById(R.ids[R.i - 1]) : null; h += materialBlock(setById(e.setId), !(prev && prev.setId === e.setId)); }
  h += `<article class="sheet">${questionBody(e, { key: 'd', response: R.response, locked: R.phase !== 'answer', showCorrect: R.phase !== 'answer' })}`;
  if (R.phase === 'answer') {
    if (R.warn) h += `<p class="note err">${esc(R.warn)} You can fix it, or submit anyway.</p>`;
    h += `<div><button type="button" class="btn primary" data-act="check">${R.warn ? 'Submit anyway' : e.format === 'open' ? 'Show the model answer' : 'Check'}</button></div>`;
  } else {
    if (R.result) h += `<div>${markHtml(R.result)}</div>`;
    h += solutionBlock(e);
    if (!R.result) {
      h += `<div class="grid2" style="gap:6px"><span class="small muted">How did you do? Compare with the highlighted keywords.</span></div>
        <div class="selfmark" role="group" aria-label="Self-mark">${['right', 'partial', 'wrong'].map(r => `<button type="button" data-act="selfmark" data-r="${r}">${RESULT[r].sym} ${RESULT[r].en}</button>`).join('')}</div>`;
    } else {
      h += `<div><button type="button" class="btn primary" data-act="next">${R.i + 1 < R.ids.length ? 'Next question' : 'Finish'}</button></div>`;
    }
  }
  if (R.err) h += `<p class="note err">${esc(R.err)}</p>`;
  h += `</article>`;
  return h;
}

function renderPaperRun() {
  const R = S.run;
  const p = S.papers.find(x => x.id === R.paperId);
  if (!p) return `<div class="panel"><p>That check paper is gone.</p><div><button class="btn" type="button" data-act="exit-run">Back</button></div></div>`;
  const exs = p.exerciseIds.map(exById).filter(Boolean);
  if (R.phase === 'done') {
    const s = R.score;
    return `<section class="panel"><p class="h3">${esc(p.title)} · result</p>
      <div class="row"><span class="score num">${s.right}/${exs.length}</span><span class="muted">${s.right} right · ${s.partial} partly · ${s.wrong} wrong</span></div>
      <p class="muted small">Any you missed go back to the start of the ladder.</p>
      <div><button type="button" class="btn primary" data-act="exit-run">Back to today</button></div></section>`;
  }
  let h = `<div class="progress"><span class="small muted">${esc(p.title)}</span><div class="grow"></div><button type="button" class="btn ghost small" data-act="exit-run">Stop</button></div>`;
  h += exs.map((e, i) => {
    const key = 'p' + i;
    let x = (e.setId && (i === 0 || exs[i - 1].setId !== e.setId)) ? materialBlock(setById(e.setId), true) : '';
    x += `<article class="sheet">${questionBody(e, { key, no: i + 1, response: R.responses[e.id] || '', locked: R.phase !== 'answer', showCorrect: R.phase === 'review' })}`;
    if (R.phase === 'review') {
      const res = R.results[e.id];
      if (e.format !== 'open' && res) x += `<div>${markHtml(res)}</div>`;
      x += solutionBlock(e);
      if (e.format === 'open') x += `<div class="selfmark" role="group" aria-label="Self-mark">${['right', 'partial', 'wrong'].map(r => `<button type="button" data-act="paper-self" data-id="${esc(e.id)}" data-r="${r}" aria-pressed="${res === r}">${RESULT[r].sym} ${RESULT[r].en}</button>`).join('')}</div>`;
    }
    return x + '</article>';
  }).join('');
  if (R.phase === 'answer') h += `${R.warn ? `<div class="note err">${R.warn.map(w => `<div>${esc(w)}</div>`).join('')}<div>You can fix them, or hand in anyway.</div></div>` : ''}<div class="row"><button type="button" class="btn primary" data-act="paper-submit">${R.warn ? 'Hand in anyway' : 'Hand in'}</button><span class="small muted">Answers show after you hand in.</span></div>`;
  else {
    const pending = exs.filter(e => !R.results[e.id]).length;
    h += `<div class="row"><button type="button" class="btn primary" data-act="paper-finish" ${(pending || R.saving) ? 'disabled' : ''}>${R.saving ? 'Saving…' : 'Finish and save'}</button><span class="small muted">${R.saving ? 'Saving your answers. Please wait.' : pending ? `Mark ${pending} more answer${pending > 1 ? 's' : ''} first.` : 'All marked.'}</span></div>`;
  }
  if (R.err) h += `<p class="note err">${esc(R.err)}</p>`;
  return h;
}

/* ---------- 管理标签（中文） ---------- */
function renderManage() {
  let h = '';
  if (S.tab === 'record') h = renderRecord();
  else if (S.tab === 'exercises') h = renderExercises();
  else if (S.tab === 'papers') h = S.paperView ? renderPaperSheet(S.paperView) : renderPapers();
  else h = renderSettings();
  return `<div class="zh" style="display:grid;gap:16px">${h}</div>`;
}

function subjectOptions(sel, withAuto) {
  return (withAuto ? `<option value="">AI 判断</option>` : `<option value="">选科目</option>`) + SUBJECTS.map(s => `<option value="${s[0]}" ${sel === s[0] ? 'selected' : ''}>${s[2]} ${s[1]}</option>`).join('');
}

function renderRecord() {
  const L = S.imgLimits, canPhoto = !!(S.assets && L), canSample = !!S.sample;
  const max = canPhoto ? L.maxCount : 0, n = S.recPhotos.length, full = n >= max, busy = S.recBusy;
  let h = `<section class="panel">
    <p class="h2">录入错题</p>
    <p class="small muted">拍照或贴题目文字，AI 拆成一道道草稿；保存前请逐条核对，尤其是答案。</p>`;
  if (canPhoto) {
    h += `<label class="pick${full || busy ? ' off' : ''}"><input type="file" id="rec-files" accept="${esc((L.mediaTypes || ['image/*']).join(','))}" multiple ${full || busy ? 'disabled' : ''}>
      <span class="pick-main">📷 拍照 / 选照片</span><span class="pick-sub">${full ? `已到 ${max} 张上限` : `可以一张张加，最多 ${max} 张`}</span></label>`;
    if (n) h += `<div class="tray">${S.recPhotos.map((p, i) => `<span class="tray-item"><img src="${p.url}" alt="照片 ${i + 1}"><button type="button" class="tray-x" data-act="drop-photo" data-i="${i}" aria-label="去掉照片 ${i + 1}" ${busy ? 'disabled' : ''}>×</button></span>`).join('')}<span class="small muted">已选 ${n} / ${max}</span></div>`;
  } else if (canSample) h += `<p class="small muted">本页现在不能把照片交给 AI，可以贴题目文字。</p>`;
  h += `<label class="f"><span>也可以贴题目文字</span><textarea id="rec-text" data-bind="recText" rows="3" placeholder="例：Which of the following is a non-flowering plant? (1) hibiscus (2) fern (3) rice (4) mango — Sophia chose (1)">${esc(S.recText)}</textarea></label>
    <div class="rec-go">
      <label class="f"><span>科目</span><select id="rec-subject" data-bind="recSubject">${subjectOptions(S.recSubject, true)}</select></label>
      <button type="button" class="btn primary" data-act="recognise" ${(!canSample || busy) ? 'disabled' : ''}>${busy ? '识别中…' : 'AI识别'}</button>
    </div>
    ${!canSample ? '<p class="note err">AI 识别现在不可用，本页暂时不能录入。</p>' : ''}
    ${S.recMsg ? `<p class="note ${S.recMsg.kind}">${esc(S.recMsg.text)}</p>` : ''}
  </section>`;
  const newDrafts = S.drafts.filter(d => !d.editId);
  const saveNote = S.saveMsg ? `<p class="note ${S.saveMsg.kind}">${esc(S.saveMsg.text)}</p>` : '';
  if (newDrafts.length || S.setDrafts.length) {
    h += `<div id="rec-drafts" style="display:grid;gap:8px"><div class="row"><p class="h2 grow">待核对 ${newDrafts.length} 道${S.setDrafts.length ? `，题组 ${S.setDrafts.length} 个` : ''}</p><button type="button" class="btn primary" data-act="save-all">全部保存</button><button type="button" class="btn ghost" data-act="discard-all">全部放弃</button></div>${saveNote}</div>`;
    for (const sd of S.setDrafts) {
      const members = newDrafts.filter(d => d.setRef === 'new:' + sd.key);
      h += setForm(sd, members.length);
      h += members.map(d => `<div class="member">${draftForm(d)}</div>`).join('');
    }
    h += newDrafts.filter(d => !S.setDrafts.some(sd => d.setRef === 'new:' + sd.key)).map(draftForm).join('');
  } else h += saveNote;
  return h;
}

function clearPhotos() {
  for (const p of S.recPhotos) URL.revokeObjectURL(p.url);
  S.recPhotos = [];
}
function addPhotos(files) {
  const L = S.imgLimits, skipped = [];
  for (const f of files) {
    if (S.recPhotos.length >= L.maxCount) skipped.push(`「${f.name}」超过 ${L.maxCount} 张上限`);
    else if (L.maxInputBytes && f.size > L.maxInputBytes) skipped.push(`「${f.name}」太大（最大 ${Math.floor(L.maxInputBytes / 1048576 * 10) / 10} MB），换一张或压缩后再加`);
    else S.recPhotos.push({ file: f, url: URL.createObjectURL(f), assetId: null });
  }
  if (skipped.length) S.recMsg = { kind: 'err', text: '没加上：' + skipped.join('；') + '。' };
}

function setForm(sd, nMembers) {
  const k = sd.key, edit = k === 'edit';
  const inp = (field, v, ph) => `<input type="text" id="s${k}-${field}" data-s="${k}" data-f="${field}" value="${esc(v)}" placeholder="${esc(ph || '')}">`;
  let h = `<section class="panel setcard" id="set-${k}">
    <div class="row"><p class="h3 grow">${edit ? '编辑题组' : (sd.savedId ? '题组（已保存）' : '题组草稿')}</p>${edit ? '' : `<button type="button" class="btn ghost small" data-act="drop-set" data-s="${k}">放弃题组</button>`}</div>
    <div class="grid2">
      ${edit ? `<div class="f small"><span class="muted">科目</span><div>${esc(SUBJ[sd.subject] ? SUBJ[sd.subject].zh : '')}</div></div>` : `<label class="f"><span>科目 *</span><select id="s${k}-subject" data-s="${k}" data-f="subject" data-rerender="1">${subjectOptions(sd.subject)}</select></label>`}
      <label class="f"><span>标题</span>${inp('title', sd.title, '例：School carnival flyer')}</label>
      <label class="f"><span>出处</span>${inp('source', sd.source, '例：2026 P5 SA2 卷二 Booklet B')}</label>
    </div>
    <label class="f"><span>材料文字（文章、传单或实验装置的文字；[[ ]] 显示为下划线）</span><textarea id="s${k}-text" data-s="${k}" data-f="text" rows="6">${esc(sd.text)}</textarea></label>
    <label class="f"><span>词表（语法完形框里的词，用 ; 或换行分隔；没有就留空）</span><textarea id="s${k}-wordBank" data-s="${k}" data-f="wordBank" data-rerender="1" rows="2" placeholder="例：although; despite; which; whose">${esc(sd.wordBank)}</textarea></label>`;
  if (sd.images.length) h += `<div class="imgs thumbs">${sd.images.map((id, i) => `<span style="display:grid;gap:4px;justify-items:start"><img src="${blobUrl(id)}" alt="材料照片 ${i + 1}"><button type="button" class="btn ghost small" data-act="drop-simg" data-s="${k}" data-i="${i}">去掉照片</button></span>`).join('')}</div>`;
  if (!edit && nMembers === 0) h += `<p class="small muted">还没有小题挂在这个题组下；没有小题的题组不会保存。</p>`;
  if (sd.error) h += `<p class="note err">${esc(sd.error)}</p>`;
  if (edit) h += `<div class="row"><button type="button" class="btn primary" data-act="save-set">保存题组</button><button type="button" class="btn ghost" data-act="cancel-set">取消</button></div>`;
  return h + '</section>';
}

function draftForm(d) {
  const s = d.subject, T = TAX[s];
  const k = d.key;
  const topics = T ? T.layers.map(l => {
    const ts = T.topics.filter(t => t[1] === l[0]);
    return ts.length ? `<optgroup label="${esc(l[1] + ' ' + l[2])}">${ts.map(t => `<option value="${t[0]}" ${d.topic === t[0] ? 'selected' : ''}>${esc(t[2] + ' · ' + t[3])}</option>`).join('')}</optgroup>` : '';
  }).join('') : '';
  const concepts = T ? T.concepts.filter(c => c[1] === d.topic).map(c => `<option value="${c[0]}" ${d.concept === c[0] ? 'selected' : ''}>${esc(c[2] + ' · ' + c[3])}</option>`).join('') : '';
  const qtypes = T ? T.qtypes.map(q => `<option value="${q[0]}" ${d.qtype === q[0] ? 'selected' : ''}>${esc(q[1] + ' · ' + q[2])}</option>`).join('') : '';
  const f = (name, label, html) => `<label class="f"><span>${label}</span>${html}</label>`;
  const inp = (field, v, ph) => `<input type="text" id="d${k}-${field}" data-d="${k}" data-f="${field}" value="${esc(v)}" placeholder="${esc(ph || '')}">`;
  const ta = (field, v, rows, ph) => `<textarea id="d${k}-${field}" data-d="${k}" data-f="${field}" rows="${rows}" placeholder="${esc(ph || '')}">${esc(v)}</textarea>`;
  let h = `<section class="panel draft" id="draft-${k}">
    <div class="row"><p class="h3 grow">${d.editId ? '编辑错题' : '草稿'}</p>${d.editId ? '' : `<button type="button" class="btn ghost small" data-act="drop-draft" data-k="${k}">放弃这道</button>`}</div>
    <div class="grid2">
      ${f('subject', '科目 *', `<select id="d${k}-subject" data-d="${k}" data-f="subject" data-rerender="1">${subjectOptions(s)}</select>`)}
      ${f('topic', '专题 *', `<select id="d${k}-topic" data-d="${k}" data-f="topic" data-rerender="1"><option value="">选专题</option>${topics}</select>`)}
      ${f('concept', '概念', `<select id="d${k}-concept" data-d="${k}" data-f="concept"><option value="">（不填）</option>${concepts}</select>`)}
      ${f('qtype', '题型', `<select id="d${k}-qtype" data-d="${k}" data-f="qtype"><option value="">（不填）</option>${qtypes}</select>`)}
      ${f('format', '作答形式', `<select id="d${k}-format" data-d="${k}" data-f="format" data-rerender="1">${FORMATS.map(x => `<option value="${x[0]}" ${d.format === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select>`)}
      ${f('cause', '错因', `<select id="d${k}-cause" data-d="${k}" data-f="cause">${CAUSES.map(c => `<option value="${c[0]}" ${d.cause === c[0] ? 'selected' : ''}>${c[1]}</option>`).join('')}</select>`)}
    </div>
    ${f('setRef', '所属题组', `<select id="d${k}-setRef" data-d="${k}" data-f="setRef" data-rerender="1"><option value="">无（独立的题）</option>${S.setDrafts.filter(sd => !sd.subject || !s || sd.subject === s).map(sd => `<option value="new:${sd.key}" ${d.setRef === 'new:' + sd.key ? 'selected' : ''}>本批新建：${esc(sd.title || '未命名题组')}</option>`).join('')}${(s ? liveSets(s) : []).map(x => `<option value="${esc(x.id)}" ${d.setRef === x.id ? 'selected' : ''}>${esc(x.title || '未命名题组')}</option>`).join('')}</select>`)}
    ${f('stem', (d.setRef ? '题目文字（只写这一问，材料在题组里）' : '题目文字') + '；[[ ]] 显示为下划线', ta('stem', d.stem, 4))}`;
  if (d.images.length) h += `<div class="imgs thumbs">${d.images.map((id, i) => `<span style="display:grid;gap:4px;justify-items:start"><img src="${blobUrl(id)}" alt="题目照片 ${i + 1}"><button type="button" class="btn ghost small" data-act="drop-img" data-k="${k}" data-i="${i}">去掉照片</button></span>`).join('')}</div>`;
  if (d.format === 'mcq') {
    h += `<div class="grid2">${d.options.map((o, i) => f('o' + i, `选项 (${i + 1})`, `<input type="text" id="d${k}-o${i}" data-d="${k}" data-f="opt" data-i="${i}" value="${esc(o)}">`)).join('')}</div>
      <div class="row"><button type="button" class="btn ghost small" data-act="add-opt" data-k="${k}">加一个选项</button>${d.options.length > 2 ? `<button type="button" class="btn ghost small" data-act="del-opt" data-k="${k}">去掉最后一个</button>` : ''}</div>
      <div class="grid2">${f('answer', '正确选项 *', `<select id="d${k}-answer" data-d="${k}" data-f="answer">${d.options.map((o, i) => `<option value="${LETTERS[i]}" ${String(d.answer).toUpperCase() === LETTERS[i] ? 'selected' : ''}>(${i + 1})</option>`).join('')}</select>`)}
      ${f('wrongAnswer', '她当时选的', inp('wrongAnswer', d.wrongAnswer, '例：(1)'))}</div>`;
  } else if (d.format === 'pick') {
    const sd = setOfDraft(d), bank = sd ? parseList(sd.wordBank) : [];
    h += bank.length
      ? `<div class="grid2">${f('answer', '正确的词 *（取自所属题组的词表）', `<select id="d${k}-answer" data-d="${k}" data-f="answer"><option value="">选词</option>${bank.map(w => `<option value="${esc(w)}" ${normAnswer(d.answer) === normAnswer(w) ? 'selected' : ''}>${esc(w)}</option>`).join('')}</select>`)}${f('wrongAnswer', '她当时填的', inp('wrongAnswer', d.wrongAnswer))}</div>`
      : `<p class="note err">选词题要属于带词表的题组：先选所属题组，并在题组卡片里填好词表。</p>`;
  } else if (d.format === 'short') {
    h += `<div class="grid2">${f('answer', '正确答案 *', inp('answer', d.answer))}${f('accepted', '其他可接受答案（用 ; 分隔）', inp('accepted', d.accepted, '例：0.5; 1/2'))}${f('wrongAnswer', '她当时的答案', inp('wrongAnswer', d.wrongAnswer))}</div>`;
  } else {
    h += f('answer', '标准答法 *（得分关键词用 [[ ]] 括起来）', ta('answer', d.answer, 3, '例：Warmer [[water vapour]] in the surrounding air [[loses heat]] to the [[cooler surface]] and [[condenses]].'));
    h += f('wrongAnswer', '她当时的答案', ta('wrongAnswer', d.wrongAnswer, 2));
    h += f('mustUse', '必须用的词（句子改写用；; 分隔，分开的词组写成 Neither…nor）', inp('mustUse', d.mustUse, '例：Despite'));
  }
  h += f('solution', '讲解（三段：Key idea: … / Steps: 1. … / Watch out: …；关键词用 [[ ]]）', ta('solution', d.solution, 5, 'Key idea: …\nSteps:\n1. …\n2. …\nWatch out: …'));
  h += `<div class="grid2">${f('source', '出处', inp('source', d.source, '例：2026 P5 SA2 卷二 Q7'))}</div>`;
  if (d.error) h += `<p class="note err">${esc(d.error)}</p>`;
  h += `<div class="row"><button type="button" class="btn primary" data-act="save-draft" data-k="${k}">${d.editId ? '保存修改' : '保存这道'}</button>${d.editId ? `<button type="button" class="btn ghost" data-act="cancel-edit" data-k="${k}">取消</button>` : ''}</div></section>`;
  return h;
}

function newDraft(x) {
  x = x || {};
  const subject = SUBJ[x.subject] ? x.subject : (S.recSubject || '');
  const topic = subject && nameOf(subject, 'topic', x.topic) ? x.topic : '';
  const concept = topic && nameOf(subject, 'concept', x.concept) && IDX[subject].concept[x.concept].topic === topic ? x.concept : '';
  const qtype = subject && nameOf(subject, 'qtype', x.qtype) ? x.qtype : '';
  const format = ['mcq', 'pick', 'short', 'open'].includes(x.format) ? x.format : 'open';
  let options = Array.isArray(x.options) ? x.options.map(String) : [];
  if (format === 'mcq') while (options.length < 4) options.push('');
  return {
    key: draftSeq++, editId: x.editId || null, subject, topic, concept, qtype, format,
    stem: String(x.stem || ''), options: format === 'mcq' ? options : ['', '', '', ''],
    answer: String(x.answer || (format === 'mcq' ? 'A' : '')),
    accepted: Array.isArray(x.accepted) ? x.accepted.filter(a => normAnswer(a) !== normAnswer(x.answer)).join('; ') : String(x.accepted || ''),
    solution: String(x.solution || ''), wrongAnswer: String(x.wrongAnswer || ''),
    cause: CAUSE[x.cause] ? x.cause : 'concept', source: String(x.source || ''),
    images: Array.isArray(x.images) ? x.images.slice() : [], error: (x.topic && !topic) ? 'Claude 给的专题不在体系里，请选一个。' : '',
    setRef: x.setRef != null ? String(x.setRef) : String(x.setId || ''), origSetId: x.setId || null, setPos: x.setPos || null,
    mustUse: parseList(x.mustUse).join('; ')
  };
}

function draftToDoc(d) {
  const err = [];
  if (!SUBJ[d.subject]) err.push('科目');
  if (!d.topic) err.push('专题');
  const sd = setOfDraft(d);
  if (d.setRef && !sd) err.push('所属题组');
  if (sd && sd.subject && sd.subject !== d.subject) err.push('与题组相同的科目');
  const hasMat = sd && (String(sd.text || '').trim() || (sd.images || []).length);
  if (!d.stem.trim() && !d.images.length && !hasMat) err.push('题目文字或照片');
  const options = d.format === 'mcq' ? d.options.map(o => o.trim()) : [];
  if (d.format === 'mcq' && options.filter(Boolean).length < 2) err.push('至少两个选项');
  if (!String(d.answer).trim()) err.push('答案');
  if (d.format === 'pick') {
    const bank = sd ? parseList(sd.wordBank) : [];
    if (!bank.length) err.push('带词表的所属题组');
    else if (!bank.some(w => normAnswer(w) === normAnswer(d.answer))) err.push('词表里的答案');
  }
  if (err.length) return { error: '还缺：' + err.join('、') };
  const accepted = d.format === 'short' ? [d.answer.trim()].concat(d.accepted.split(';').map(a => a.trim()).filter(Boolean)) : [];
  return { doc: {
    subject: d.subject, topic: d.topic, concept: d.concept || null, qtype: d.qtype || null, format: d.format,
    stem: d.stem.trim(), images: d.images, options, answer: String(d.answer).trim(), accepted,
    solution: d.solution.trim(), wrongAnswer: d.wrongAnswer.trim(), cause: d.cause, source: d.source.trim(),
    mustUse: d.format === 'open' ? parseList(String(d.mustUse || '').replace(/\n/g, ';')) : []
  } };
}
