      case 'drop-img': { const d = draftByKey(b.dataset.k); d.images.splice(Number(b.dataset.i), 1); render(); break; }
      case 'add-opt': { const d = draftByKey(b.dataset.k); if (d.options.length < 6) d.options.push(''); render(); break; }
      case 'del-opt': { const d = draftByKey(b.dataset.k); if (d.options.length > 2) d.options.pop(); render(); break; }
      case 'save-draft': if (await saveDraft(draftByKey(b.dataset.k))) { S.recMsg = null; S.saveMsg = null; } render(); break;
      case 'save-all': {
        let n = 0;
        for (const d of draftsInOrder()) { if (await saveDraft(d)) n++; }
        const left = S.drafts.filter(x => !x.editId).length;
        S.recMsg = null;
        S.saveMsg = { kind: left ? 'err' : 'ok', text: `Saved ${plural(n, 'exercise')}.` + (left ? ` ${left} still incomplete; see the notes below.` : '') };
        render(); break;
      }
      case 'cancel-edit': S.drafts = S.drafts.filter(d => d.key !== Number(b.dataset.k)); render(); break;

      case 'detail': S.detailId = b.dataset.id; S.confirmDel = null; render(); window.scrollTo(0, 0); break;
      case 'back-list': S.detailId = null; S.confirmDel = null; render(); break;
      case 'edit': { const e = exById(b.dataset.id); S.drafts.push(newDraft(Object.assign({}, e, { editId: e.id }))); render(); window.scrollTo(0, 0); break; }
      case 'ask-del': S.confirmDel = b.dataset.id; render(); break;
      case 'cancel-del': S.confirmDel = null; render(); break;
      case 'delete-ex': { const e = exById(b.dataset.id); await S.db.doc('exercises/' + b.dataset.id).delete(); if (e && e.setId) await cleanupSet(e.setId, e.id); S.detailId = null; S.confirmDel = null; render(); break; }

      case 'paper-preview': {
        const P = S.paperForm;
        S.paperPreview = paperLayout(drawPaper(paperPool(), { subject: P.subject, topics: P.topics, count: Math.max(1, Math.min(50, Number(P.count) || 10)) }));
        S.paperMsg = null; render(); break;
      }
      case 'paper-create': {
        const P = S.paperForm, today = localToday();
        const tnames = P.topics.length ? P.topics.map(t => topicLabel(P.subject, t)).join(', ') : 'All topics';
        const doc = { title: `${SUBJ[P.subject].en} · ${tnames} · ${fmtDate(today)}`, createdAt: today, madeAt: nowLocal(), madeBy: S.me, subject: P.subject, topics: P.topics.slice(), count: Number(P.count) || 10, exerciseIds: S.paperPreview.map(e => e.id), owner: S.settings.defaultOwner };
        await S.db.collection('papers').doc().set(doc);
        S.paperPreview = null; S.paperMsg = { kind: 'ok', text: 'Check paper created.' }; render(); break;
      }
      case 'paper-view': S.tab = 'papers'; S.paperView = b.dataset.id; S.paperIdx = 0; S.paperOpenSets = {}; render(); window.scrollTo(0, 0); break;
      case 'paper-view-close': S.paperView = null; render(); break;
      case 'goto-ex': S.tab = 'exercises'; S.detailId = b.dataset.id; S.paperView = null; S.drafts = S.drafts.filter(d => !d.editId); render(); window.scrollTo(0, 0); break;
      case 'paper-delete': await S.db.doc('papers/' + b.dataset.id).delete(); S.confirmDel = null; render(); break;

      case 'save-settings': {
        const v = readSettings({ dailyLimit: $('#set-limit').value, practiceDays: $('#set-days').value, papersPerWeek: $('#set-papers').value, defaultOwner: $('#set-owner').value }, S.me);
        await S.db.doc('settings/' + S.me).set(v);
        S.settingsMsg = { kind: 'ok', text: `Saved: up to ${plural(v.dailyLimit, 'question')} per batch; ${plural(v.practiceDays, 'practice day')} and ${plural(v.papersPerWeek, 'check paper')} a week; default owner ${userName(v.defaultOwner)}.` }; render(); break;
      }
    }
  } catch (err) {
    const msg = dbErr(err);
    if (S.run) { S.run.err = msg; } else { S.errMsg = msg; }
    render();
  }
});

function draftByKey(k) { return S.drafts.find(d => d.key === Number(k)); }

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.ans != null && S.run) {
    // 只写作答并重画翻页条（题号随即变实心），不整页重画，以免打断输入
    const e = runExs()[Number(t.dataset.ans.slice(1))]; if (e) S.run.responses[e.id] = t.value;
    const pg = document.querySelector('.cardpager');
    if (pg) pg.outerHTML = cardPager(runMarks(runExs(), S.run.phase, S.run.responses, S.run.results, S.run.saved), S.run.idx, 'card-go');
  } else if (t.dataset.d) {
    const d = draftByKey(t.dataset.d); if (!d) return;
    if (t.dataset.f === 'opt') d.options[Number(t.dataset.i)] = t.value; else if (!t.dataset.rerender) d[t.dataset.f] = t.value;
  } else if (t.dataset.s) {
    const sd = setDraftByKey(t.dataset.s); if (sd && !t.dataset.rerender) sd[t.dataset.f] = t.value;
  } else if (t.dataset.bind) {
    S[t.dataset.bind] = t.value;
  } else if (t.dataset.search) {
    // 搜索：整页重画（题数、Clear filters、翻页随之更新），再把焦点与光标放回搜索框
    const pos = t.selectionStart;
    S.filters.q = t.value; S.listPage = 1; render();
    const el = $('#flt-q'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
  }
});

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.photos) { addPhotos(Array.from(t.files || [])); t.value = ''; render(); return; }
  if (t.dataset.d && t.dataset.rerender) {
    const d = draftByKey(t.dataset.d); if (!d) return;
    d[t.dataset.f] = t.value;
    if (t.dataset.f === 'subject') { d.topic = ''; d.concept = ''; d.qtype = ''; const sd = setOfDraft(d); if (sd && sd.subject && sd.subject !== d.subject) d.setRef = ''; }
    if (t.dataset.f === 'topic') d.concept = '';
    if (t.dataset.f === 'format') {
      if (t.value === 'mcq') { while (d.options.length < 4) d.options.push(''); if (!LETTERS.includes(String(d.answer).toUpperCase())) d.answer = 'A'; }
    }
    render(); return;
  }
  if (t.dataset.d) { const d = draftByKey(t.dataset.d); if (d && t.dataset.f !== 'opt') d[t.dataset.f] = t.value; return; }
  if (t.dataset.s) { const sd = setDraftByKey(t.dataset.s); if (sd) { sd[t.dataset.f] = t.value; if (t.dataset.rerender) render(); } return; }
  if (t.dataset.filter) { S.filters[t.dataset.filter] = t.value; if (t.dataset.filter === 'subject') S.filters.topic = ''; S.listPage = 1; render(); return; }
  if (t.dataset.pfilter) { S.paperFilters[t.dataset.pfilter] = t.value; S.paperPage = 1; render(); return; }
  const act = t.dataset.actChange;
  try {
    if (act === 'list-sort') { S.listSort.key = t.value; S.listPage = 1; render(); }
    else if (act === 'paper-sort') { S.paperSort.key = t.value; S.paperPage = 1; render(); }
    else if (act === 'paper-subject') { S.paperForm.subject = t.value; S.paperForm.topics = []; S.paperPreview = null; render(); }
    else if (act === 'paper-count') { S.paperForm.count = t.value; S.paperPreview = null; }
    else if (act === 'paper-topic') { const P = S.paperForm; P.topics = t.checked ? P.topics.concat([t.value]) : P.topics.filter(x => x !== t.value); S.paperPreview = null; render(); }
    else if (act === 'override') {
      const e = exById(t.dataset.id), i = Number(t.dataset.i);
      if (!e || !e.attempts[i] || e.attempts[i].by !== S.me) return;   // 只改判自己的作答
      const attempts = e.attempts.map((a, j) => j === i ? Object.assign({}, a, { result: t.value, judgedBy: 'parent' }) : a);
      await writeAttempts(e, attempts);
    }
  } catch (err) { S.errMsg = dbErr(err); render(); }
});

// 题组材料展开或收起时记下（作答页记在 S.run.openSets，详情页记在 S.paperOpenSets），重画与翻到同组其他卡时沿用
document.addEventListener('toggle', ev => {
  const d = ev.target;
  if (!d.classList || !d.classList.contains('material') || !d.dataset.set) return;
  const store = S.run ? (S.run.openSets = S.run.openSets || {}) : S.paperOpenSets;
  if (d.open) store[d.dataset.set] = true; else delete store[d.dataset.set];
}, true);
// 整行可点的卷子：Enter 键同点击
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
});

/* ---------- 保存草稿 ---------- */
async function saveDraft(d) {
  const r = draftToDoc(d);
  if (r.error) { d.error = r.error; return false; }
  d.error = '';
  try {
    let setId = null;
    if (String(d.setRef).startsWith('new:')) {
      const sd = setOfDraft(d);
      if (!sd.savedId) {
        sd.subject = sd.subject || d.subject;
        if (!String(sd.text).trim() && !sd.images.length && !d.stem.trim()) { d.error = 'The question set still needs material text or a photo.'; return false; }
        const ref = S.db.collection('sets').doc();
        await ref.set({ subject: sd.subject, title: sd.title.trim(), text: sd.text.trim(), images: sd.images, source: sd.source.trim(), wordBank: parseList(sd.wordBank), createdAt: localToday() });
        sd.savedId = ref.id;
      }
      setId = sd.savedId;
    } else if (d.setRef) setId = d.setRef;
    const setPos = setId ? ((d.editId && d.origSetId === setId && d.setPos) ? d.setPos : nextPos(setId)) : null;
    Object.assign(r.doc, { setId, setPos });
    if (d.editId) {
      const old = exById(d.editId);
      const attempts = (old && old.attempts) || [];
      const createdAt = (old && old.createdAt) || localToday();
      const doc = Object.assign(r.doc, { createdAt, attempts, owner: d.owner || null });
      if (old && old.recordedAt) doc.recordedAt = old.recordedAt;
      if (old && old.test) doc.test = true;
      await S.db.doc('exercises/' + d.editId).set(doc);
      if (d.origSetId && d.origSetId !== setId) await cleanupSet(d.origSetId, d.editId);
    } else {
      const createdAt = localToday();
      await S.db.collection('exercises').doc().set(Object.assign(r.doc, { createdAt, recordedAt: nowLocal(), owner: recOwner(), attempts: [] }));
    }
    S.drafts = S.drafts.filter(x => x !== d);
    S.setDrafts = S.setDrafts.filter(sd => !sd.savedId || S.drafts.some(x => x.setRef === 'new:' + sd.key));
    return true;
  } catch (err) { d.error = dbErr(err); return false; }
}

/* ---------- 识别 ---------- */
function taxonomyText(subjects) {
  return subjects.map(s => {
    const T = TAX[s];
    const lines = [`SUBJECT ${s}`, 'Topics (id: name) with their concepts:'];
    for (const t of T.topics) {
      const cs = T.concepts.filter(c => c[1] === t[0]).map(c => `${c[0]} ${c[3]}`).join('; ');
      lines.push(`- ${t[0]}: ${t[3]}${cs ? ' | concepts: ' + cs : ''}`);
    }
    lines.push('Question types: ' + T.qtypes.map(q => `${q[0]} ${q[2]}`).join('; '));
    return lines.join('\n');
  }).join('\n\n');
}
function recognisePrompt(subject, text, nImages) {
  const subs = subject ? [subject] : Object.keys(TAX);
  return `A parent in Singapore is recording questions that their daughter Sophia (Primary 5, PSLE next year) got wrong, so she can redo them later.
${nImages ? `The ${nImages} attached photo(s) show worksheet or exam questions.` : ''}${text ? `\nText from the parent:\n"""\n${text}\n"""` : ''}

Return one draft per question. Only draft the questions Sophia got wrong when that is visible (her written or marked answer is wrong, or the teacher marked it wrong); if you cannot tell which ones she got wrong, draft every question.
When several questions share one passage, picture, table or experiment set-up, put that material once in "sets" and point each of those questions at it with "set" (its index in "sets"); the stem of such a question holds only that question (not the whole material).
When the question's number, blank or underlined word sits inside the shared text (for example editing or cloze), its stem is the whole sentence from that text that contains it, copied exactly. Keep only this question's number and its blank or [[underlined word]]; in that sentence write every other blank as "…" and every other underlined word as plain text without its number.
Subject: ${subject || 'decide from the content: "english", "math" or "science"'}.

Draft fields:
- subject: "english" | "math" | "science"
- topic: exactly one topic id from the list below for that subject
- concept: a concept id listed under that topic, or null
- qtype: a question-type id from that subject's list, or null
- format: "mcq" when numbered options are given; "pick" when the blank is answered by choosing a word from a word list given with the passage (grammar cloze); "short" when the answer is one word, number or short phrase; otherwise "open"
- stem: the question exactly as printed, keeping line breaks, numbers and units; for mcq leave the options out of the stem; for a question inside the shared text, the whole sentence as described above
- options: the option texts in order for mcq, else []
- mustUse: for sentence synthesis / transformation, the given word(s) the rewritten sentence must use (write split pairs as "Neither…nor"), else []
- answer: mcq → letter of the correct option ("A" = option 1, "B" = option 2, ...); short → the expected answer; open → a model answer a PSLE marker would accept
- accepted: short → every acceptable answer including answer (for example "0.5" and "1/2"), else []
- solution: an explanation an 11-year-old can follow, in exactly this format (each part on its own lines):
  Key idea: one sentence naming what the question tests
  Steps:
  1. first step
  2. next step
  Watch out: the common mistake to avoid
  Wrap the words that earn marks in [[double brackets]].
- wrongAnswer: Sophia's own answer if it is visible (handwriting or a marked choice), else ""
- cause: your best guess of why she got it wrong: "concept" (did not understand the idea), "misread" (misread the question), "careless" (calculation or copying slip), "incomplete" (missing keywords or wrong format)
- source: the paper name and question number if visible, else ""
- set: index into "sets" when the question uses shared material, else null

Set fields: title (a short name, for example "School carnival flyer"), text (the material transcribed exactly; describe pictures briefly in [brackets]; keep blank numbers like (1) ____), source, wordBank (the list of words given in a box for grammar cloze, else []).
Grammar cloze: put the boxed words in the set's wordBank and make each blank a "pick" question whose answer is the word.
Editing for spelling and grammar: write every underlined word as [[word]] in the set text; in a question's stem only its own underlined word (for example "Other times, he finds that people refuse to open the door despite his (41) [[purrsistent]] knocking."); each underlined word is one "short" question whose answer is the corrected word.
Sentence synthesis / transformation: an "open" question; answer is the full rewritten sentence including the given word(s); fill mustUse.
Use the teacher's correction as the answer when one is visible; otherwise solve the question carefully yourself.

Reply with only a JSON object: {"sets": [...], "drafts": [...]}. Use "sets": [] when nothing is shared.

${taxonomyText(subs)}`;
}
async function recognise() {
  const photos = S.recPhotos.slice();
  const text = S.recText.trim();
  if (!photos.length && !text) { S.recMsg = { kind: 'err', text: 'Add a photo or paste the question text first.' }; render(); return; }
  S.recBusy = true; S.saveMsg = null;
  // 先传还没有 asset id 的照片；有一张没传上就停下，不识别，重试只传没传上的
  const todo = photos.filter(p => !p.assetId);
  if (todo.length) { S.recMsg = { kind: '', text: 'Uploading photos…' }; render(); }
  for (const p of todo) {
    try { const a = await S.assets.upload(p.file); p.assetId = a.id; }
    catch (err) { S.recBusy = false; S.recMsg = { kind: 'err', text: `Photo "${p.file.name}" didn't upload (${err && err.code || 'unknown'}); press Read with AI again.` }; render(); return; }
  }
  S.recMsg = { kind: '', text: 'Reading… this usually takes about half a minute.' }; render();
  const imageIds = photos.map(p => p.assetId), files = photos.map(p => p.file);
  let drafts = null, sets = [], fail = '';
  try {
    const out = await S.sample.json(recognisePrompt(S.recSubject, text, files.length), files.length ? { images: files, modelTier: 'complex' } : { modelTier: 'complex' });
    if (Array.isArray(out)) drafts = out.filter(x => x && typeof x === 'object');
    else if (out && Array.isArray(out.drafts)) { drafts = out.drafts.filter(x => x && typeof x === 'object'); sets = Array.isArray(out.sets) ? out.sets.filter(x => x && typeof x === 'object') : []; }
    else fail = "Reading failed: the reply wasn't a list of questions.";
  } catch (err) {
    const c = err && err.code;
    fail = c === 'rate_limited' ? 'Too many reads; please wait a moment and try again.' : c === 'not_granted' ? "This page hasn't been allowed to use Claude, so reading is unavailable." : c === 'invalid_json' ? "Reading failed: the reply couldn't be read." : `Reading is unavailable (${c || 'unknown error'}).`;
  }
  S.recBusy = false;
  if (drafts && drafts.length) {
    const setKeys = sets.map((x, i) => {
      const member = drafts.find(dd => dd.set === i);
      const sd = newSetDraft(Object.assign({}, x, { subject: (member && member.subject) || S.recSubject, images: imageIds }));
      S.setDrafts.push(sd);
      return sd.key;
    });
    for (const x of drafts) {
      const si = Number.isInteger(x.set) && x.set >= 0 && x.set < setKeys.length ? x.set : null;
      S.drafts.push(newDraft(Object.assign({}, x, { images: setKeys.length ? [] : imageIds, setRef: si === null ? '' : 'new:' + setKeys[si] })));
    }
    S.recMsg = { kind: 'ok', text: 'Found ' + (setKeys.length ? `${plural(setKeys.length, 'question set')} and ` : '') + `${plural(drafts.length, 'draft')}. Check each one before saving; the answers were read or worked out by AI.` };
    S.recText = ''; clearPhotos();
    render();
    const el = $('#rec-drafts'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    S.recMsg = { kind: 'err', text: (fail || 'No questions found.') + ' The photos and text are still here; adjust them and press Read with AI again.' };
    render();
  }
}

/* ---------- 导出 ---------- */
async function exportAll() {
  const now = nowLocal();
  const data = exportData(S.exercises, S.sets, S.papers, S.settings, now, S.userIds);
  const text = '# Exercise Arena export (YAML)\n' + toYaml(data) + '\n';
  try {
    await S.downloads.save({ filename: `arena-export-${now.slice(0, 10)}.yaml.txt`, data: text });
    S.exportMsg = { kind: 'ok', text: `Handed to the browser to save: ${plural(S.exercises.length, 'exercise')}, ${plural(S.sets.length, 'question set')}, ${plural(S.papers.length, 'paper')}.` };
  } catch (err) {
    S.exportMsg = err && err.code === 'cancelled' ? null : { kind: 'err', text: `Export failed (${err && err.code || 'unknown'}).` };
  }
  render();
}

/* ---------- 启动 ---------- */
async function boot() {
  render();
  if (!window.claude || !window.claude.use) { S.status = 'nodb'; render(); return; }
  const use = n => window.claude.use(n).catch(() => null);
  const [db, assets, sample, downloads, user] = await Promise.all([use('db'), use('assets'), use('sample'), use('downloads'), use('user')]);
  const me = user ? (await user.me()).id : null;
  if (!db || !me) { S.status = 'nodb'; render(); return; }
  Object.assign(S, { db, assets, sample, downloads, user, me });
  S.settings = readSettings(null, me);   // 拿到 me 后重设：默认归属人是本人
  // 第一次打开时登记自己；名字不存
  try { const u = await db.doc('users/' + me).get(); if (!u.exists) await db.doc('users/' + me).set({ joinedAt: localToday() }); } catch (e) {}
  if (sample && sample.limits) { try { const l = await sample.limits(); S.imgLimits = l && l.images ? l.images : null; } catch (e) { S.imgLimits = null; } }
  let got = 0;
  const ready = () => { if (++got >= 3 && S.status === 'loading') { S.status = 'ready'; render(); } else softRender(); };
  const fail = () => { S.status = 'nodb'; render(); };
  db.collection('exercises').onSnapshot(snap => {
    S.exercises = snap.docs.map(d => Object.assign({ id: d.id, attempts: [] }, d.data()));
    ready(); loadNames();
  }, fail);
  db.collection('papers').onSnapshot(snap => {
    S.papers = snap.docs.map(d => Object.assign({ id: d.id, exerciseIds: [] }, d.data()));
    ready(); loadNames();
  }, fail);
  db.collection('sets').onSnapshot(snap => {
    S.sets = snap.docs.map(d => Object.assign({ id: d.id, images: [] }, d.data()));
    ready();
  }, fail);
  db.collection('users').onSnapshot(snap => {
    S.userIds = snap.docs.map(d => d.id).sort((a, b) => (b === me) - (a === me) || a.localeCompare(b));
    loadNames(); softRender();
  }, () => {});
  db.collection('matches').onSnapshot(snap => {
    S.matches = snap.docs.map(d => Object.assign({ id: d.id, players: [], points: [] }, d.data()));
    softRender();
  }, () => {});
  db.collection('settings').onSnapshot(snap => {
    S.owners = Object.fromEntries(snap.docs.map(d => [d.id, readSettings(d.data(), d.id).defaultOwner]));
    softRender();
  }, () => {});
  db.doc('settings/' + me).onSnapshot(snap => {
    const v = snap.exists ? snap.data() : null;
    S.settings = readSettings(v, me);
    softRender();
  }, () => {});
}
boot();
</script>
