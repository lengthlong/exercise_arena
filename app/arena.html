      <label class="f"><span>Questions</span><input type="number" id="pf-count" min="1" max="50" value="${P.count}" data-act-change="paper-count"></label>
    </div>
    <div class="f small"><span class="muted">Topics (none ticked means all)</span><div class="checks">${topicChecks || '<span class="muted">No exercises in this subject yet.</span>'}</div></div>
    <p class="small muted">Draw order: most times wrong first; on a tie, mastered ones first; then the longest since last answered. Drawn questions from one set sit together on the paper.</p>
    <div class="row"><button type="button" class="btn" data-act="paper-preview">Preview the draw</button>${S.paperPreview ? `<button type="button" class="btn primary" data-act="paper-create" ${S.paperPreview.length ? '' : 'disabled'}>Create check paper (${plural(S.paperPreview.length, 'question')})</button>` : ''}</div>
    ${S.paperPreview ? (S.paperPreview.length ? `<div class="list">${S.paperPreview.map((e, i) => `<div class="item" style="cursor:default"><span class="t">${i + 1}. ${esc(plain(e.stem) || (e.setId ? '(see the set material)' : '(photo only)'))}</span><span class="side">${ladderHtml(e)}</span><span class="meta"><span>${esc(topicLabel(e.subject, e.topic))}</span><span>· wrong ${e.wrongCount}×</span>${setChip(e)}</span></div>`).join('')}</div>` : '<p class="note">No exercises in this range.</p>') : ''}
    ${S.paperMsg ? `<p class="note ${S.paperMsg.kind}">${esc(S.paperMsg.text)}</p>` : ''}
  </section>`;
  const papers = visiblePapers(S.papers, mine(), S.me).filter(p => !S.paperOwner || sameOwner(p.owner, S.paperOwner)).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)) || b.id.localeCompare(a.id));
  h += `<section class="panel"><div class="row"><p class="h3 grow">Papers</p><label class="f"><span>Owner</span><select id="paper-owner" data-act-change="paper-owner">${ownerFilterOptions(S.paperOwner, S.papers)}</select></label></div>`;
  if (!papers.length) h += `<p class="small muted">${S.paperOwner ? 'No papers for this owner.' : "No check papers yet. A new paper shows up on Today for every user whose default owner matches; anyone can start it here."}</p>`;
  else h += `<div class="list">${papers.map(p => `<div class="item" style="cursor:default">
      <span class="t">${esc(p.title)}</span>
      <span class="side">${handedInAt(p, mine(), S.me) ? (() => { const sc = paperScore(p, mine()); return `<span class="num">${sc.right}/${sc.total}</span>`; })() : '<span>Not done by me</span>'}</span>
      <span class="meta">${isDaily(p) ? `<span class="chip">Daily</span>${p.subject ? subjChip(p.subject) : ''}` : `${subjChip(p.subject)}<span>Owner ${esc(userName(p.owner))}</span>`}<span class="num">Created ${esc(fmtWhen(p.madeAt || p.createdAt))}</span>${handedInAt(p, mine(), S.me) ? `<span class="num">Done ${esc(fmtWhen(handedInAt(p, mine(), S.me)))}</span>` : ''}${p.test ? '<span class="chip test">TEST</span>' : ''}
        ${handedInAt(p, mine(), S.me) ? `<button type="button" class="btn ghost small" data-act="paper-view" data-id="${esc(p.id)}">View details</button>` : `<button type="button" class="btn small" data-act="start-paper" data-id="${esc(p.id)}">Start</button>`}
        ${S.confirmDel === p.id ? `<span class="confirm">Delete this paper? Answers already given stay.<button type="button" class="btn danger" data-act="paper-delete" data-id="${esc(p.id)}">Delete</button><button type="button" class="btn ghost" data-act="cancel-del">Cancel</button></span>` : `<button type="button" class="btn ghost small" data-act="ask-del" data-id="${esc(p.id)}">Delete</button>`}
      </span></div>`).join('')}</div>`;
  return h + `</section>`;
}

const JUDGE = { auto: 'Auto', self: 'Self', parent: 'Override' };
function renderPaperSheet(paperId) {
  // 检验卷详情（可改判）
  const p = S.papers.find(x => x.id === paperId);
  const back = `<button type="button" class="btn ghost" data-act="paper-view-close">← Back to papers</button>`;
  if (!p) return `<div class="row">${back}</div><p class="note">This paper has been deleted.</p>`;
  const rows = paperAttempts(p, mine()), sc = paperScore(p, mine());
  const doneAt = handedInAt(p, mine(), S.me), when = doneAt ? doneAt.replace('T', ' ') : 'not done';
  let h = `<div class="row">${back}</div>
  <section class="panel"><p class="h2">${esc(p.title)}</p>
    <div class="row"><span class="score num">${sc.right}/${sc.total}</span><span class="muted">Right ${sc.right} · Partly ${sc.partial} · Wrong ${sc.wrong}</span></div>
    <div class="stats"><span>Handed in <b>${esc(when)}</b></span></div>
  </section>`;
  rows.forEach((r, i) => {
    if (!r.ex) { h += `<article class="sheet"><span class="qno">${i + 1}.</span><p class="muted">This exercise has been deleted.</p></article>`; return; }
    const e = r.ex, a = r.attempt;
    if (e.setId && (i === 0 || !rows[i - 1].ex || rows[i - 1].ex.setId !== e.setId)) h += materialBlock(setById(e.setId), true);
    h += `<article class="sheet">${questionBody(e, { key: 'pv' + i, no: i + 1, response: a ? a.response : '', locked: true, showCorrect: true })}`;
    if (a) h += `<div class="row">${markHtml(a.result)}<span class="small muted">Judged: ${JUDGE[a.judgedBy] || ''}</span></div>`;
    else h += `<p class="small muted">No answer to this question on this paper.</p>`;
    h += solutionBlock(e);
    if (a) {
      const ai = e.allAttempts.indexOf(a);   // 原文档里的下标
      h += `<div class="row"><label class="f"><span>Override</span><select id="pv-ov-${i}" data-act-change="override" data-id="${esc(e.id)}" data-i="${ai}">${['right', 'partial', 'wrong'].map(x => `<option value="${x}" ${a.result === x ? 'selected' : ''}>${RESULT[x].en}</option>`).join('')}</select></label><button type="button" class="btn ghost small" data-act="goto-ex" data-id="${esc(e.id)}">Exercise details</button></div>`;
    }
    h += '</article>';
  });
  return h;
}

function renderSettings() {
  // 三组：取谁的错题、每日重做、每周目标；保存在最后，四个字段一起写
  return `<section class="panel"><p class="h2">Settings</p>
    <div class="set-group"><p class="h3">Whose exercises</p>
      <label class="f"><span>Default owner</span><select id="set-owner">${ownerOptions(S.settings.defaultOwner)}</select></label>
      <p class="small muted">Today's redo and new check papers use this person's exercises, and new exercises are recorded under them.</p>
    </div>
    <div class="set-group"><p class="h3">Daily redo</p>
      <label class="f"><span>Questions per batch (1–50)</span><input type="number" id="set-limit" min="1" max="50" value="${S.settings.dailyLimit}"></label>
    </div>
    <div class="set-group"><p class="h3">Weekly goal</p>
      <div class="grid2">
        <label class="f"><span>Practice days per week (1–7)</span><input type="number" id="set-days" min="1" max="7" value="${S.settings.practiceDays}"></label>
        <label class="f"><span>Check papers per week (0–3)</span><input type="number" id="set-papers" min="0" max="3" value="${S.settings.papersPerWeek}"></label>
      </div>
      <p class="small muted">Weeks run Monday to Sunday. The goal shows in Next 7 days on Today, and Last 7 days compares against it.</p>
    </div>
    <div class="row"><button type="button" class="btn primary" data-act="save-settings">Save</button></div>
    ${S.settingsMsg ? `<p class="note ${S.settingsMsg.kind}">${esc(S.settingsMsg.text)}</p>` : ''}
  </section>
  <section class="panel"><p class="h2">How the review ladder works</p>
    <p class="small muted">After an exercise is recorded, it comes back for a 1st, 2nd, 3rd and 4th redo on day 1, 3, 7 and 14. Right moves it on to the next redo, wrong sends it back to the 1st redo, partly right keeps it waiting for the same redo. Right on the 4th redo means mastered. On a check paper, right and partly right answers don't move a question; a wrong one sends it back to the 1st redo.</p>
  </section>
  <section class="panel"><p class="h2">Export</p>
    <p class="small muted">Exports every exercise (with all answers), question set, paper and these settings as YAML text, without photos (only how many there are). The file is named like arena-export-date.yaml.txt; drop the .txt if needed.</p>
    <div class="row"><button type="button" class="btn" data-act="export" ${S.downloads ? '' : 'disabled'}>Export YAML</button>${S.downloads ? '' : '<span class="small muted">This page can\'t save files, so export is unavailable.</span>'}</div>
    ${S.exportMsg ? `<p class="note ${S.exportMsg.kind}">${esc(S.exportMsg.text)}</p>` : ''}
  </section>`;
}

/* ---------- 写数据 ---------- */
async function writeAttempts(e, attempts) {
  // e 是原文档，attempts 是所有人的全部作答；阶梯按人现算，不写派生字段
  await S.db.doc('exercises/' + e.id).update({ attempts });
}
async function addAttempt(e, a) { await writeAttempts(e, (e.attempts || []).concat([Object.assign({ by: S.me }, a)])); }
function dbErr(err) {
  const c = err && err.code;
  if (c === 'quota_exceeded') return 'The database is full; delete some old exercises and try again.';
  if (c === 'invalid_argument') return "This account can't write data.";
  return 'Saving failed (' + (c || 'unknown error') + '); please try again later.';
}

/* ---------- 事件 ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const R = S.run;
  try {
    switch (act) {
      case 'tab': S.tab = b.dataset.v; store.set('arena.tab', S.tab); S.errMsg = null; S.detailId = null; S.confirmDel = null; S.paperView = null; render(); break;
      case 'clear-filters': S.filters = { owner: '', subject: '', topic: '', cause: '', state: '' }; S.listPage = 1; render(); break;
      case 'list-dir': S.listSort.dir = S.listSort.dir === 'desc' ? 'asc' : 'desc'; S.listPage = 1; render(); break;
      case 'list-page': S.listPage = Number(b.dataset.v) || 1; render(); window.scrollTo(0, 0); break;
      case 'export': await exportAll(); break;

      case 'start-daily': {
        // 不接着做：先删掉这一科今天没交的每日卷（卷上还没有作答），再按这一科此刻的一批新组一张；没有到期题就不组卷
        const today = localToday(), subj = b.dataset.subject;
        if (!SUBJ[subj]) break;
        const list = subjectBatch(todayScope(S.exercises, S.me, S.settings.defaultOwner).todo, today, S.settings.dailyLimit, subj);
        const old = openDailyPaper(S.papers, mine(), S.me, today, subj);
        if (old) { await S.db.doc('papers/' + old.id).delete(); S.papers = S.papers.filter(x => x.id !== old.id); }
        if (!list.length) { render(); break; }
        const doc = makeDailyPaper(list, S.me, S.settings.defaultOwner, today, fmtDate, subj, nowLocal());
        const ref = S.db.collection('papers').doc();
        await ref.set(doc);
        const p = Object.assign({ id: ref.id }, doc);
        if (!S.papers.some(x => x.id === p.id)) S.papers = S.papers.concat([p]);
        S.run = { kind: 'paper', paperId: p.id, phase: 'answer', responses: {}, results: {}, saved: {} };
        render(); window.scrollTo(0, 0); break;
      }
      case 'pick': { const i = Number(b.dataset.key.slice(1)); const p = S.papers.find(x => x.id === R.paperId); R.responses[p.exerciseIds[i]] = b.dataset.v; render(); break; }
      case 'exit-run': S.run = null; render(); break;

      case 'start-paper': S.run = { kind: 'paper', paperId: b.dataset.id, phase: 'answer', responses: {}, results: {}, saved: {} }; render(); window.scrollTo(0, 0); break;
      case 'paper-submit': {
        // 交卷即存：先写客观题的作答（已写过的跳过），再在卷子的 handedIn 记下我；失败时留在本页，可再点补写
        if (R.saving) break;
        const p = S.papers.find(x => x.id === R.paperId);
        if (R.phase === 'answer') {
          if (!R.warned) {
            const warns = p.exerciseIds.map((id, i) => { const e = exById(id); const w = e && e.format === 'open' ? mustUseNote(e, R.responses[id] || '') : ''; return w ? `Question ${i + 1}: ${w}` : ''; }).filter(Boolean);
            if (warns.length) { R.warn = warns; R.warned = true; render(); break; }
          }
          R.warn = null;
          for (const id of p.exerciseIds) { const e = exById(id); if (e && e.format !== 'open') R.results[id] = judgeAuto(e, R.responses[id] || ''); }
          R.phase = 'review';
        }
        R.saving = true; R.err = null; render(); window.scrollTo(0, 0);
        try {
          const today = localToday(), mode = isDaily(p) ? 'daily' : 'paper';
          for (const id of p.exerciseIds) {
            const e = exById(id); if (!e || e.format === 'open' || R.saved[id]) continue;
            if (!(e.attempts || []).some(a => a.paperId === p.id && a.by === S.me))
              await addAttempt(e, { date: today, at: nowLocal(), mode, paperId: p.id, response: String(R.responses[id] || ''), result: R.results[id], judgedBy: 'auto' });
            R.saved[id] = true;
          }
          const cur = S.papers.find(x => x.id === p.id) || p;
          if (!(cur.handedIn && cur.handedIn[S.me])) await S.db.doc('papers/' + p.id).update({ handedIn: Object.assign({}, cur.handedIn, { [S.me]: nowLocal() }) });
          R.handed = true;
        } catch (err) { R.err = dbErr(err); }
        finally { R.saving = false; }
        render(); break;
      }
      case 'paper-self': {
        // 主观题自评即存，存后锁定；要改去卷面详情改判
        const id = b.dataset.id, e = exById(id), p = S.papers.find(x => x.id === R.paperId);
        if (!e || !R.handed || R.saved[id] || R.saving) break;
        R.results[id] = b.dataset.r; R.saving = true; render();
        try {
          if (!(e.attempts || []).some(a => a.paperId === p.id && a.by === S.me))
            await addAttempt(e, { date: localToday(), at: nowLocal(), mode: isDaily(p) ? 'daily' : 'paper', paperId: p.id, response: String(R.responses[id] || ''), result: R.results[id], judgedBy: 'self' });
          R.saved[id] = true;
        } catch (err) { R.err = dbErr(err); }
        finally { R.saving = false; }
        render(); break;
      }

      case 'recognise': await recognise(); break;
      case 'drop-photo': { const p = S.recPhotos.splice(Number(b.dataset.i), 1)[0]; if (p) URL.revokeObjectURL(p.url); render(); break; }
      case 'drop-draft': S.drafts = S.drafts.filter(d => d.key !== Number(b.dataset.k)); render(); break;
      case 'discard-all': S.drafts = S.drafts.filter(d => d.editId); S.setDrafts = []; S.recMsg = null; S.saveMsg = null; render(); break;
      case 'drop-set': { const k = b.dataset.s; for (const d of S.drafts) if (d.setRef === 'new:' + k) d.setRef = ''; S.setDrafts = S.setDrafts.filter(x => x.key !== Number(k)); render(); break; }
      case 'drop-simg': { const sd = setDraftByKey(b.dataset.s); sd.images.splice(Number(b.dataset.i), 1); render(); break; }
      case 'edit-set': { const x = setById(b.dataset.id); S.setEdit = Object.assign(newSetDraft(x), { key: 'edit', id: x.id, createdAt: x.createdAt, test: x.test }); render(); break; }
      case 'cancel-set': S.setEdit = null; render(); break;
      case 'save-set': {
        const E = S.setEdit;
        if (!E.text.trim() && !E.images.length) { E.error = 'Add material text or at least one photo.'; render(); break; }
        const bank = parseList(E.wordBank);
        const lost = S.exercises.filter(x => x.setId === E.id && x.format === 'pick' && !bank.some(w => normAnswer(w) === normAnswer(x.answer)));
        if (lost.length) { E.error = "Can't save: these word-pick answers aren't in the new word bank — " + lost.map(x => `"${plain(x.stem) || x.answer}" (answer ${x.answer})`).join(', ') + '. Change the word bank or these questions first.'; render(); break; }
        const doc = { subject: E.subject, title: E.title.trim(), text: E.text.trim(), images: E.images, source: E.source.trim(), wordBank: bank, createdAt: E.createdAt || localToday() };
        if (E.test) doc.test = true;
        await S.db.doc('sets/' + E.id).set(doc);
        S.setEdit = null; render(); break;
      }
      case 'drop-img': { const d = draftByKey(b.dataset.k); d.images.splice(Number(b.dataset.i), 1); render(); break; }
      case 'add-opt': { const d = draftByKey(b.dataset.k); if (d.options.length < 6) d.options.push(''); render(); break; }
      case 'del-opt': { const d = draftByKey(b.dataset.k); if (d.options.length > 2) d.options.pop(); render(); break; }
      case 'save-draft': if (await saveDraft(draftByKey(b.dataset.k))) { S.recMsg = null; S.saveMsg = null; } render(); break;
      case 'save-all': {
        let n = 0;
        for (const d of draftsInOrder()) { if (await saveDraft(d)) n++; }
        const left = S.drafts.filter(x => !x.editId).length;
        S.recMsg = null;
        S.saveMsg = { kind: left ? 'err' : 'ok', text: `Saved ${plural(n, 'exercise')}.` + (left ? ` ${left} still incomplete; see the notes below.` : '') };
        render(); break;
      }
      case 'cancel-edit': S.drafts = S.drafts.filter(d => d.key !== Number(b.dataset.k)); render(); break;

      case 'detail': S.detailId = b.dataset.id; S.confirmDel = null; render(); window.scrollTo(0, 0); break;
      case 'back-list': S.detailId = null; S.confirmDel = null; render(); break;
      case 'edit': { const e = exById(b.dataset.id); S.drafts.push(newDraft(Object.assign({}, e, { editId: e.id }))); render(); window.scrollTo(0, 0); break; }
      case 'ask-del': S.confirmDel = b.dataset.id; render(); break;
      case 'cancel-del': S.confirmDel = null; render(); break;
      case 'delete-ex': { const e = exById(b.dataset.id); await S.db.doc('exercises/' + b.dataset.id).delete(); if (e && e.setId) await cleanupSet(e.setId, e.id); S.detailId = null; S.confirmDel = null; render(); break; }

      case 'paper-preview': {
        const P = S.paperForm;
        S.paperPreview = paperLayout(drawPaper(paperPool(), { subject: P.subject, topics: P.topics, count: Math.max(1, Math.min(50, Number(P.count) || 10)) }));
        S.paperMsg = null; render(); break;
      }
      case 'paper-create': {
        const P = S.paperForm, today = localToday();
        const tnames = P.topics.length ? P.topics.map(t => topicLabel(P.subject, t)).join(', ') : 'All topics';
        const doc = { title: `${SUBJ[P.subject].en} · ${tnames} · ${fmtDate(today)}`, createdAt: today, madeAt: nowLocal(), subject: P.subject, topics: P.topics.slice(), count: Number(P.count) || 10, exerciseIds: S.paperPreview.map(e => e.id), owner: S.settings.defaultOwner };
        await S.db.collection('papers').doc().set(doc);
        S.paperPreview = null; S.paperMsg = { kind: 'ok', text: 'Check paper created.' }; render(); break;
      }
      case 'paper-view': S.tab = 'papers'; S.paperView = b.dataset.id; render(); window.scrollTo(0, 0); break;
      case 'paper-view-close': S.paperView = null; render(); break;
      case 'goto-ex': S.tab = 'exercises'; S.detailId = b.dataset.id; S.paperView = null; S.drafts = S.drafts.filter(d => !d.editId); render(); window.scrollTo(0, 0); break;
      case 'paper-delete': await S.db.doc('papers/' + b.dataset.id).delete(); S.confirmDel = null; render(); break;

      case 'save-settings': {
        const v = readSettings({ dailyLimit: $('#set-limit').value, practiceDays: $('#set-days').value, papersPerWeek: $('#set-papers').value, defaultOwner: $('#set-owner').value }, S.me);
        await S.db.doc('settings/' + S.me).set(v);
        S.settingsMsg = { kind: 'ok', text: `Saved: up to ${plural(v.dailyLimit, 'question')} per batch; ${plural(v.practiceDays, 'practice day')} and ${plural(v.papersPerWeek, 'check paper')} a week; default owner ${userName(v.defaultOwner)}.` }; render(); break;
      }
    }
  } catch (err) {
    const msg = dbErr(err);
    if (S.run) { S.run.err = msg; } else { S.errMsg = msg; }
    render();
  }
});

function draftByKey(k) { return S.drafts.find(d => d.key === Number(k)); }

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.ans != null && S.run) {
    const key = t.dataset.ans;
    const p = S.papers.find(x => x.id === S.run.paperId); S.run.responses[p.exerciseIds[Number(key.slice(1))]] = t.value;
  } else if (t.dataset.d) {
    const d = draftByKey(t.dataset.d); if (!d) return;
    if (t.dataset.f === 'opt') d.options[Number(t.dataset.i)] = t.value; else if (!t.dataset.rerender) d[t.dataset.f] = t.value;
  } else if (t.dataset.s) {
    const sd = setDraftByKey(t.dataset.s); if (sd && !t.dataset.rerender) sd[t.dataset.f] = t.value;
  } else if (t.dataset.bind) {
    S[t.dataset.bind] = t.value;
  }
});

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.photos) { addPhotos(Array.from(t.files || [])); t.value = ''; render(); return; }
  if (t.dataset.d && t.dataset.rerender) {
    const d = draftByKey(t.dataset.d); if (!d) return;
    d[t.dataset.f] = t.value;
    if (t.dataset.f === 'subject') { d.topic = ''; d.concept = ''; d.qtype = ''; const sd = setOfDraft(d); if (sd && sd.subject && sd.subject !== d.subject) d.setRef = ''; }
    if (t.dataset.f === 'topic') d.concept = '';
    if (t.dataset.f === 'format') {
      if (t.value === 'mcq') { while (d.options.length < 4) d.options.push(''); if (!LETTERS.includes(String(d.answer).toUpperCase())) d.answer = 'A'; }
    }
    render(); return;
  }
  if (t.dataset.d) { const d = draftByKey(t.dataset.d); if (d && t.dataset.f !== 'opt') d[t.dataset.f] = t.value; return; }
  if (t.dataset.s) { const sd = setDraftByKey(t.dataset.s); if (sd) { sd[t.dataset.f] = t.value; if (t.dataset.rerender) render(); } return; }
  if (t.dataset.filter) { S.filters[t.dataset.filter] = t.value; if (t.dataset.filter === 'subject') S.filters.topic = ''; S.listPage = 1; render(); return; }
  const act = t.dataset.actChange;
  try {
    if (act === 'list-sort') { S.listSort.key = t.value; S.listPage = 1; render(); }
    else if (act === 'paper-owner') { S.paperOwner = t.value; render(); }
    else if (act === 'paper-subject') { S.paperForm.subject = t.value; S.paperForm.topics = []; S.paperPreview = null; render(); }
    else if (act === 'paper-count') { S.paperForm.count = t.value; S.paperPreview = null; }
    else if (act === 'paper-topic') { const P = S.paperForm; P.topics = t.checked ? P.topics.concat([t.value]) : P.topics.filter(x => x !== t.value); S.paperPreview = null; render(); }
    else if (act === 'override') {
      const e = exById(t.dataset.id), i = Number(t.dataset.i);
      if (!e || !e.attempts[i] || e.attempts[i].by !== S.me) return;   // 只改判自己的作答
      const attempts = e.attempts.map((a, j) => j === i ? Object.assign({}, a, { result: t.value, judgedBy: 'parent' }) : a);
      await writeAttempts(e, attempts);
    }
  } catch (err) { S.errMsg = dbErr(err); render(); }
});

/* ---------- 保存草稿 ---------- */
async function saveDraft(d) {
  const r = draftToDoc(d);
  if (r.error) { d.error = r.error; return false; }
  d.error = '';
  try {
    let setId = null;
    if (String(d.setRef).startsWith('new:')) {
      const sd = setOfDraft(d);
      if (!sd.savedId) {
        sd.subject = sd.subject || d.subject;
        if (!String(sd.text).trim() && !sd.images.length && !d.stem.trim()) { d.error = 'The question set still needs material text or a photo.'; return false; }
        const ref = S.db.collection('sets').doc();
        await ref.set({ subject: sd.subject, title: sd.title.trim(), text: sd.text.trim(), images: sd.images, source: sd.source.trim(), wordBank: parseList(sd.wordBank), createdAt: localToday() });
        sd.savedId = ref.id;
      }
      setId = sd.savedId;
    } else if (d.setRef) setId = d.setRef;
    const setPos = setId ? ((d.editId && d.origSetId === setId && d.setPos) ? d.setPos : nextPos(setId)) : null;
    Object.assign(r.doc, { setId, setPos });
    if (d.editId) {
      const old = exById(d.editId);
      const attempts = (old && old.attempts) || [];
      const createdAt = (old && old.createdAt) || localToday();
      const doc = Object.assign(r.doc, { createdAt, attempts, owner: d.owner || null });
      if (old && old.recordedAt) doc.recordedAt = old.recordedAt;
      if (old && old.test) doc.test = true;
      await S.db.doc('exercises/' + d.editId).set(doc);
      if (d.origSetId && d.origSetId !== setId) await cleanupSet(d.origSetId, d.editId);
    } else {
      const createdAt = localToday();
      await S.db.collection('exercises').doc().set(Object.assign(r.doc, { createdAt, recordedAt: nowLocal(), owner: recOwner(), attempts: [] }));
    }
    S.drafts = S.drafts.filter(x => x !== d);
    S.setDrafts = S.setDrafts.filter(sd => !sd.savedId || S.drafts.some(x => x.setRef === 'new:' + sd.key));
    return true;
  } catch (err) { d.error = dbErr(err); return false; }
}

/* ---------- 识别 ---------- */
function taxonomyText(subjects) {
  return subjects.map(s => {
    const T = TAX[s];
    const lines = [`SUBJECT ${s}`, 'Topics (id: name) with their concepts:'];
    for (const t of T.topics) {
      const cs = T.concepts.filter(c => c[1] === t[0]).map(c => `${c[0]} ${c[3]}`).join('; ');
      lines.push(`- ${t[0]}: ${t[3]}${cs ? ' | concepts: ' + cs : ''}`);
    }
    lines.push('Question types: ' + T.qtypes.map(q => `${q[0]} ${q[2]}`).join('; '));
    return lines.join('\n');
  }).join('\n\n');
}
function recognisePrompt(subject, text, nImages) {
  const subs = subject ? [subject] : Object.keys(TAX);
  return `A parent in Singapore is recording questions that their daughter Sophia (Primary 5, PSLE next year) got wrong, so she can redo them later.
${nImages ? `The ${nImages} attached photo(s) show worksheet or exam questions.` : ''}${text ? `\nText from the parent:\n"""\n${text}\n"""` : ''}

Return one draft per question. Only draft the questions Sophia got wrong when that is visible (her written or marked answer is wrong, or the teacher marked it wrong); if you cannot tell which ones she got wrong, draft every question.
When several questions share one passage, picture, table or experiment set-up, put that material once in "sets" and point each of those questions at it with "set" (its index in "sets"); the stem of such a question holds only that question.
Subject: ${subject || 'decide from the content: "english", "math" or "science"'}.

Draft fields:
- subject: "english" | "math" | "science"
- topic: exactly one topic id from the list below for that subject
- concept: a concept id listed under that topic, or null
- qtype: a question-type id from that subject's list, or null
- format: "mcq" when numbered options are given; "pick" when the blank is answered by choosing a word from a word list given with the passage (grammar cloze); "short" when the answer is one word, number or short phrase; otherwise "open"
- stem: the question exactly as printed, keeping line breaks, numbers and units; for mcq leave the options out of the stem
- options: the option texts in order for mcq, else []
- mustUse: for sentence synthesis / transformation, the given word(s) the rewritten sentence must use (write split pairs as "Neither…nor"), else []
- answer: mcq → letter of the correct option ("A" = option 1, "B" = option 2, ...); short → the expected answer; open → a model answer a PSLE marker would accept
- accepted: short → every acceptable answer including answer (for example "0.5" and "1/2"), else []
- solution: an explanation an 11-year-old can follow, in exactly this format (each part on its own lines):
  Key idea: one sentence naming what the question tests
  Steps:
  1. first step
  2. next step
  Watch out: the common mistake to avoid
  Wrap the words that earn marks in [[double brackets]].
- wrongAnswer: Sophia's own answer if it is visible (handwriting or a marked choice), else ""
- cause: your best guess of why she got it wrong: "concept" (did not understand the idea), "misread" (misread the question), "careless" (calculation or copying slip), "incomplete" (missing keywords or wrong format)
- source: the paper name and question number if visible, else ""
- set: index into "sets" when the question uses shared material, else null

Set fields: title (a short name, for example "School carnival flyer"), text (the material transcribed exactly; describe pictures briefly in [brackets]; keep blank numbers like (1) ____), source, wordBank (the list of words given in a box for grammar cloze, else []).
Grammar cloze: put the boxed words in the set's wordBank and make each blank a "pick" question whose answer is the word.
Editing for spelling and grammar: write every underlined word as [[word]] in the set text and in the question stem (for example "(3) [[recieve]]"); each underlined word is one "short" question whose answer is the corrected word.
Sentence synthesis / transformation: an "open" question; answer is the full rewritten sentence including the given word(s); fill mustUse.
Use the teacher's correction as the answer when one is visible; otherwise solve the question carefully yourself.

Reply with only a JSON object: {"sets": [...], "drafts": [...]}. Use "sets": [] when nothing is shared.

${taxonomyText(subs)}`;
}
async function recognise() {
  const photos = S.recPhotos.slice();
  const text = S.recText.trim();
  if (!photos.length && !text) { S.recMsg = { kind: 'err', text: 'Add a photo or paste the question text first.' }; render(); return; }
  S.recBusy = true; S.saveMsg = null;
  // 先传还没有 asset id 的照片；有一张没传上就停下，不识别，重试只传没传上的
  const todo = photos.filter(p => !p.assetId);
  if (todo.length) { S.recMsg = { kind: '', text: 'Uploading photos…' }; render(); }
  for (const p of todo) {
    try { const a = await S.assets.upload(p.file); p.assetId = a.id; }
    catch (err) { S.recBusy = false; S.recMsg = { kind: 'err', text: `Photo "${p.file.name}" didn't upload (${err && err.code || 'unknown'}); press Read with AI again.` }; render(); return; }
  }
  S.recMsg = { kind: '', text: 'Reading… this usually takes about half a minute.' }; render();
  const imageIds = photos.map(p => p.assetId), files = photos.map(p => p.file);
  let drafts = null, sets = [], fail = '';
  try {
    const out = await S.sample.json(recognisePrompt(S.recSubject, text, files.length), files.length ? { images: files, modelTier: 'complex' } : { modelTier: 'complex' });
    if (Array.isArray(out)) drafts = out.filter(x => x && typeof x === 'object');
    else if (out && Array.isArray(out.drafts)) { drafts = out.drafts.filter(x => x && typeof x === 'object'); sets = Array.isArray(out.sets) ? out.sets.filter(x => x && typeof x === 'object') : []; }
    else fail = "Reading failed: the reply wasn't a list of questions.";
  } catch (err) {
    const c = err && err.code;
    fail = c === 'rate_limited' ? 'Too many reads; please wait a moment and try again.' : c === 'not_granted' ? "This page hasn't been allowed to use Claude, so reading is unavailable." : c === 'invalid_json' ? "Reading failed: the reply couldn't be read." : `Reading is unavailable (${c || 'unknown error'}).`;
  }
  S.recBusy = false;
  if (drafts && drafts.length) {
    const setKeys = sets.map((x, i) => {
      const member = drafts.find(dd => dd.set === i);
      const sd = newSetDraft(Object.assign({}, x, { subject: (member && member.subject) || S.recSubject, images: imageIds }));
      S.setDrafts.push(sd);
      return sd.key;
    });
    for (const x of drafts) {
      const si = Number.isInteger(x.set) && x.set >= 0 && x.set < setKeys.length ? x.set : null;
      S.drafts.push(newDraft(Object.assign({}, x, { images: setKeys.length ? [] : imageIds, setRef: si === null ? '' : 'new:' + setKeys[si] })));
    }
    S.recMsg = { kind: 'ok', text: 'Found ' + (setKeys.length ? `${plural(setKeys.length, 'question set')} and ` : '') + `${plural(drafts.length, 'draft')}. Check each one before saving; the answers were read or worked out by AI.` };
    S.recText = ''; clearPhotos();
    render();
    const el = $('#rec-drafts'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    S.recMsg = { kind: 'err', text: (fail || 'No questions found.') + ' The photos and text are still here; adjust them and press Read with AI again.' };
    render();
  }
}

/* ---------- 导出 ---------- */
async function exportAll() {
  const now = nowLocal();
  const data = exportData(S.exercises, S.sets, S.papers, S.settings, now, S.userIds);
  const text = '# Exercise Arena export (YAML)\n' + toYaml(data) + '\n';
  try {
    await S.downloads.save({ filename: `arena-export-${now.slice(0, 10)}.yaml.txt`, data: text });
    S.exportMsg = { kind: 'ok', text: `Handed to the browser to save: ${plural(S.exercises.length, 'exercise')}, ${plural(S.sets.length, 'question set')}, ${plural(S.papers.length, 'paper')}.` };
  } catch (err) {
    S.exportMsg = err && err.code === 'cancelled' ? null : { kind: 'err', text: `Export failed (${err && err.code || 'unknown'}).` };
  }
  render();
}

/* ---------- 启动 ---------- */
async function boot() {
  render();
  if (!window.claude || !window.claude.use) { S.status = 'nodb'; render(); return; }
  const use = n => window.claude.use(n).catch(() => null);
  const [db, assets, sample, downloads, user] = await Promise.all([use('db'), use('assets'), use('sample'), use('downloads'), use('user')]);
  const me = user ? (await user.me()).id : null;
  if (!db || !me) { S.status = 'nodb'; render(); return; }
  Object.assign(S, { db, assets, sample, downloads, user, me });
  S.settings = readSettings(null, me);   // 拿到 me 后重设：默认归属人是本人
  // 第一次打开时登记自己；名字不存
  try { const u = await db.doc('users/' + me).get(); if (!u.exists) await db.doc('users/' + me).set({ joinedAt: localToday() }); } catch (e) {}
  if (sample && sample.limits) { try { const l = await sample.limits(); S.imgLimits = l && l.images ? l.images : null; } catch (e) { S.imgLimits = null; } }
  let got = 0;
  const ready = () => { if (++got >= 3 && S.status === 'loading') { S.status = 'ready'; render(); } else softRender(); };
  const fail = () => { S.status = 'nodb'; render(); };
  db.collection('exercises').onSnapshot(snap => {
    S.exercises = snap.docs.map(d => Object.assign({ id: d.id, attempts: [] }, d.data()));
    ready(); loadNames();
  }, fail);
  db.collection('papers').onSnapshot(snap => {
    S.papers = snap.docs.map(d => Object.assign({ id: d.id, exerciseIds: [] }, d.data()));
    ready(); loadNames();
  }, fail);
  db.collection('sets').onSnapshot(snap => {
    S.sets = snap.docs.map(d => Object.assign({ id: d.id, images: [] }, d.data()));
    ready();
  }, fail);
  db.collection('users').onSnapshot(snap => {
    S.userIds = snap.docs.map(d => d.id).sort((a, b) => (b === me) - (a === me) || a.localeCompare(b));
    loadNames(); softRender();
  }, () => {});
  db.doc('settings/' + me).onSnapshot(snap => {
    const v = snap.exists ? snap.data() : null;
    S.settings = readSettings(v, me);
    softRender();
  }, () => {});
}
boot();
</script>
