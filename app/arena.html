<title>Exercise Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: an exercise book — ruled paper, a red margin line on each question, ticks and crosses in a marking-pen hand; Sophia writes in fountain-pen blue. */
:root {
  --paper: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --ink: #1b2231;
  --muted: #5a6376;
  --rule: #e1e6ef;
  --line: #c8d0de;
  --pen: #2547a8;
  --pen-ink: #ffffff;
  --pen-soft: #e3e9fb;
  --red: #c42f27;
  --red-soft: #fbe6e4;
  --green: #1f7a4a;
  --green-soft: #e0f2e8;
  --amber: #a8690f;
  --amber-soft: #fbefd9;
  --hl: #ffe57a;
  --hl-ink: #1b2231;
  --c-right: #1f7a4a;
  --c-partial: #d69e1a;
  --c-wrong: #b3261e;
  --c-seg-ink: #fff;
  --lad1: #9db2ee; --lad2: #5f80dc; --lad3: #2f52c0; --lad4: #1b307a; --lad-m: #1f7a4a;
  --font-body: "Lexend", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-hand: "Patrick Hand", "Lexend", cursive;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141b; --surface: #191e28; --surface-2: #212734; --ink: #e5e9f1; --muted: #9ba4b6;
    --rule: #242b39; --line: #353e50; --pen: #8ea7ff; --pen-ink: #0e1220; --pen-soft: #232c4a;
    --red: #ff7b70; --red-soft: #3a1c1c; --green: #64d295; --green-soft: #15301f; --amber: #f0b862; --amber-soft: #36280f;
    --hl: #6b5a12; --hl-ink: #fff4c4; --c-right: #1f9a80; --c-partial: #bb891c; --c-wrong: #de4b74; --c-seg-ink: #1b2231;
    --lad1: #34488a; --lad2: #4f6cd0; --lad3: #7a98f5; --lad4: #bccbff; --lad-m: #64d295;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --surface: #191e28; --surface-2: #212734; --ink: #e5e9f1; --muted: #9ba4b6;
  --rule: #242b39; --line: #353e50; --pen: #8ea7ff; --pen-ink: #0e1220; --pen-soft: #232c4a;
  --red: #ff7b70; --red-soft: #3a1c1c; --green: #64d295; --green-soft: #15301f; --amber: #f0b862; --amber-soft: #36280f;
  --hl: #6b5a12; --hl-ink: #fff4c4; --c-right: #1f9a80; --c-partial: #bb891c; --c-wrong: #de4b74; --c-seg-ink: #1b2231;
  --lad1: #34488a; --lad2: #4f6cd0; --lad3: #7a98f5; --lad4: #bccbff; --lad-m: #64d295;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 14.5px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
a { color: var(--pen); text-underline-offset: 2px; }
mark { background: var(--hl); color: var(--hl-ink); padding: 0 .15em; border-radius: 3px; }

.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; display: grid; gap: 12px; }
@media (min-width: 720px) { .wrap { padding-inline: 28px; } }

/* tab bar: first line of the page, sticks to the top */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); background: var(--paper); margin-top: -12px; padding-top: 4px; }
.tabs button { border: 0; background: none; padding: 6px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
@media (max-width: 480px) { .tabs { justify-content: space-between; } .tabs button { padding: 6px 3px; font-size: 13px; } }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--pen); font-weight: 500; }

/* generic */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.grow { flex: 1 1 auto; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.h2 { font: 600 15.5px/1.3 var(--font-body); margin: 0; text-wrap: balance; }
.h3 { font: 500 12px/1.4 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 12px; cursor: pointer; line-height: 1.3; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); font-weight: 500; }
.btn.danger { color: var(--red); border-color: var(--red); background: none; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; line-height: 1.3; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--rule); white-space: nowrap; }
.chip.s-english { color: var(--pen); }
.chip.s-math { color: var(--amber); }
.chip.s-science { color: var(--green); }
.chip.test { color: var(--red); border-color: var(--red); }
.note { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.note.err { background: var(--red-soft); color: var(--red); }
.note.ok { background: var(--green-soft); color: var(--green); }
label.f { display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 14px;
}
input[type=number] { width: 7em; }
textarea { min-height: 60px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 10px; }
.num { font-variant-numeric: tabular-nums; }

/* home */
.hello { display: grid; gap: 2px; }
.hello-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.hello-top h1 { margin: 0; min-width: 0; font: 600 clamp(22px, 4vw, 28px)/1.15 var(--font-body); letter-spacing: -.015em; }
.hello .day { flex: none; font: 400 13px var(--font-body); color: var(--muted); }
.hello-line { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.today { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.today .big { font: 400 64px/1 var(--font-hand); color: var(--red); min-width: 1.4ch; text-align: center; }
.today .txt { display: grid; gap: 6px; min-width: 0; }
.today .txt > p { margin: 0; }
.today .row { gap: 6px 8px; }
.today .big .of { font-size: .45em; color: var(--muted); }
.today .done-tag { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--green); line-height: 1.3; }
.today-h { grid-column: 1 / -1; }
.today-papers { grid-column: 1 / -1; display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
.plan .sub, .review .sub, .dash .sub { display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 8px; }
.days7 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.days7 li { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.days7 .d { font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: clip; white-space: nowrap; }
@media (max-width: 480px) { .days7 { gap: 4px; } .days7 .d { font-size: 11px; letter-spacing: -.02em; } }
.days7 .n { font: 400 24px/1 var(--font-hand); color: var(--pen); }
.days7 li.zero .n { color: var(--muted); }
.days7 li.is-today { border-color: var(--pen); background: var(--pen-soft); }
.days7 li.is-today .d { color: var(--pen); font-weight: 600; }
.checklist, .mastered { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.checklist li, .mastered li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tick { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); color: var(--muted); font-size: 12px; flex: none; }
.tick.ok { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 700; }
.rv-head { display: flex; align-items: baseline; gap: 10px; }
.rv-n { font: 400 40px/1 var(--font-hand); color: var(--red); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; }

/* question sheet */
.sheet { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; font-size: 15.5px; line-height: 1.6; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sum-txt { display: grid; gap: 2px; }
.sum-head { display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; min-width: 0; }
.sum-head .h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-head .btn, .sum-head .chip { flex: none; white-space: nowrap; }
@media (max-width: 480px) { .wide-only { display: none; } }
.qhead-r { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
.stem { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.65; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.imgs img { max-width: 100%; max-height: 420px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.imgs.thumbs img { max-height: 96px; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.opt .l { font: 600 14px/1.6 var(--font-body); color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt[aria-pressed="true"] .l { color: var(--pen); }
.opt.is-right { border-color: var(--green); background: var(--green-soft); }
.opt.is-wrong { border-color: var(--red); background: var(--red-soft); }
.answer-in { font-family: var(--font-hand); font-size: 20px; color: var(--pen); }
/* 答题区不随全站收紧：作答框保持原尺寸（短答框 15px，主观题框 20px） */
.sheet input.answer-in { font-size: 15px; padding: 8px 10px; }
.sheet textarea.answer-in { font-size: 20px; padding: 8px 10px; }
/* 交卷后作答框按对错着底色，与选项的底色一致 */
.answer-in.res-right { background: var(--green-soft); border-color: var(--green); }
.answer-in.res-partial { background: var(--amber-soft); border-color: var(--amber); }
.answer-in.res-wrong { background: var(--red-soft); border-color: var(--red); }
.qhead-r select.ov-sel { width: auto; }
.ov-sel.res-right { color: var(--green); } .ov-sel.res-partial { color: var(--amber); } .ov-sel.res-wrong { color: var(--red); }
.solution { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.solution .ans { font-weight: 500; }
.solution .exp { white-space: pre-wrap; overflow-wrap: anywhere; }
.selfmark { display: flex; flex-wrap: wrap; gap: 8px; }
.selfmark button { font: 400 19px/1 var(--font-hand); padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.selfmark button[data-r="right"] { color: var(--green); border-color: var(--green); }
.selfmark button[data-r="partial"] { color: var(--amber); border-color: var(--amber); }
.selfmark button[data-r="wrong"] { color: var(--red); border-color: var(--red); }
.selfmark button[aria-pressed="true"][data-r="right"] { background: var(--green-soft); }
.selfmark button[aria-pressed="true"][data-r="partial"] { background: var(--amber-soft); }
.selfmark button[aria-pressed="true"][data-r="wrong"] { background: var(--red-soft); }
.progress { display: flex; align-items: center; gap: 8px; }
.progress .btn, .progress > .small { white-space: nowrap; }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pen); }
.score { font: 400 48px/1 var(--font-hand); color: var(--red); }

/* ladder dots */
.ladder { font-family: var(--font-body); letter-spacing: 1px; color: var(--pen); font-size: 12px; white-space: nowrap; }
.ladder.m { color: var(--green); letter-spacing: 0; }

/* parent lists */
.list { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 7px 12px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.item .side { display: grid; justify-items: end; gap: 2px; font-size: 12.5px; color: var(--muted); }
.empty { padding: 14px 12px; text-align: left; color: var(--muted); display: grid; gap: 6px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl th { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.tbl select { padding: 4px 6px; font-size: 13px; width: auto; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); }
.checks input { margin: 0; }
.draft { border-left: 3px solid var(--pen); }
.bank { display: flex; flex-wrap: wrap; gap: 6px; }
details.photos > summary { cursor: pointer; font-size: 13px; color: var(--pen); width: fit-content; }
details.photos[open] > summary { margin-bottom: 6px; }
.why { display: grid; gap: 8px; }
.why-sec { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.why-sec.watch { border-left-color: var(--amber); }
.why-h { font: 600 12px/1.4 var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.why p, .exp p { margin: 2px 0; }
.why ol, .why ul { margin: 2px 0; padding-left: 20px; }
.pager { justify-content: center; }
.hello-stats { margin: 0; font: 400 15px/1.25 var(--font-hand); color: var(--pen); text-wrap: balance; }
.dash-block { display: grid; gap: 6px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
/* Last 7 days：7 列平分块宽的叠柱 */
.bars7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; height: 120px; border-bottom: 1px solid var(--line); }
.bars7 .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; border-radius: 4px 4px 0 0; }
.bars7 .col:hover { background: var(--surface-2); }
.bars7 .v { font: 500 11px var(--font-body); color: var(--muted); margin-bottom: 2px; }
.bars7 .stack { width: 60%; max-width: 56px; display: flex; flex-direction: column-reverse; gap: 2px; }
.bars7 .stack i { display: flex; align-items: center; justify-content: center; min-height: 1px; overflow: hidden; }
.bars7 .stack b { font: 600 10.5px/1 var(--font-body); color: var(--c-seg-ink); }
.bars7 .stack .seg-partial b { color: #1b2231; }
.bars7 .stack i:last-child { border-radius: 3px 3px 0 0; }
.bars7 .stack.none { height: 2px; background: var(--line); border-radius: 1px; }
.bars7-x { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }
/* Ladders：环形图与图例 */
.lad { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px 18px; align-items: center; }
@media (max-width: 420px) { .lad { grid-template-columns: minmax(0, 1fr); justify-items: center; } .lad .lad-legend { width: 100%; } }
.lad svg { width: 140px; height: 140px; display: block; }
.lad .lad-n { font: 400 30px var(--font-hand); fill: var(--ink); }
.lad .lad-t { font: 400 11px var(--font-body); fill: var(--muted); }
.lad-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; max-width: 360px; }
.lad-legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.lad-legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.lad-legend .k { color: var(--muted); }
/* 阶梯分段横条（Exercises 每科小卡） */
.ladbar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.ladbar i { display: block; height: 100%; }
.pager button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs button:disabled { opacity: .4; cursor: not-allowed; }
.opt.word { grid-template-columns: auto; padding: 6px 12px; }
.stem u { text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.setcard { border-left: 3px solid var(--amber); }
.material { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 8px 12px; display: grid; gap: 6px; min-width: 0; }
.material > summary { cursor: pointer; font-weight: 500; }
.material .stem { font-size: 15.5px; }
.member { margin-left: 14px; }
/* 录入：照片大按钮、缩略图、科目与 AI识别 一行 */
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pick { position: relative; display: grid; justify-items: center; gap: 2px; padding: 10px 10px; border: 2px dashed var(--pen); border-radius: var(--r); background: var(--pen-soft); color: var(--pen); cursor: pointer; text-align: center; }
.pick:hover { border-style: solid; }
.pick:focus-within { outline: 2px solid var(--pen); outline-offset: 2px; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.pick-ico { font-size: 20px; line-height: 1; }
.pick-main { font: 600 14.5px/1.3 var(--font-body); white-space: nowrap; }
.pick-sub { margin: -4px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
.pick.off { border-color: var(--line); background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.tray { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tray-item { position: relative; }
.tray-item img { display: block; height: 84px; max-width: 140px; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.tray-x { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1; cursor: pointer; }
.tray-x:hover { border-color: var(--red); color: var(--red); }
.rec-go { display: grid; grid-template-columns: minmax(140px, 200px) minmax(0, 1fr); gap: 10px 12px; align-items: end; }
@media (max-width: 480px) { .rec-go { grid-template-columns: minmax(0, 1fr); } }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.filters > * { min-width: 0; }
.filters select { width: 100%; text-overflow: ellipsis; }
.list-bar select.compact { width: auto; }

<script>
/* LOGIC:BEGIN — 纯函数：按用户的视图与归属人、复习阶梯、判对、每日清单、抽题、看板、计划与回顾、设置、金币与比赛（断言见 app/logic.test.js） */
const GAPS = [0, 1, 2, 4, 7];
const SUBJECTS = [['english', 'English'], ['math', 'Math'], ['science', 'Science']];
const SUBJ = Object.fromEntries(SUBJECTS.map(s => [s[0], { en: s[1] }]));
function pad2(n) { return String(n).padStart(2, '0'); }
function localToday(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(iso, n) {
  const p = String(iso).split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}
function deriveState(createdAt, attempts) {
  let step = 1, due = addDays(createdAt, 1), mastered = false, wrongCount = 1, lastAttemptAt = null;
  for (const a of attempts || []) {
    lastAttemptAt = a.date;
    if (mastered) {
      if (a.result === 'wrong') { mastered = false; step = 1; due = addDays(a.date, 1); wrongCount++; }
      continue;
    }
    if (a.result === 'right') {
      if (step === 4) { mastered = true; due = null; }
      else { step++; due = addDays(a.date, GAPS[step]); }
    } else if (a.result === 'partial') {
      due = addDays(a.date, GAPS[step]);
    } else {
      step = 1; due = addDays(a.date, 1); wrongCount++;
    }
  }
  return { step, due, mastered, wrongCount, lastAttemptAt };
}
function ladderInput(attempts) {
  // 推阶梯用的作答：每日重做的全部作答，加检验卷上做错的；检验卷上做对、部分对不改阶梯
  return (attempts || []).filter(a => a.mode !== 'paper' || a.result === 'wrong');
}
function viewFor(exs, uid) {
  // 一位用户的视图：作答只留 by 为该用户的，阶梯由其中的阶梯输入现算；原文档的全部作答留在 allAttempts
  return exs.map(e => {
    const all = e.attempts || [];
    const mine = all.filter(a => a.by === uid);
    return Object.assign({}, e, { allAttempts: all, attempts: mine }, deriveState(e.createdAt, ladderInput(mine)));
  });
}
function sameOwner(a, b) { return (a || null) === (b || null); }
function ownedBy(exs, owner) { return exs.filter(e => sameOwner(e.owner, owner)); }
function attemptGroups(e, uid) {
  // 全部作答按作答人分组，我在最前；组内保持原顺序（即时间顺序），i 是在原数组里的下标
  const groups = [], byUser = {};
  (e.allAttempts || e.attempts || []).forEach((a, i) => {
    const k = a.by || '';
    if (!byUser[k]) { byUser[k] = { by: a.by || null, items: [] }; groups.push(byUser[k]); }
    byUser[k].items.push({ a, i });
  });
  return groups.sort((x, y) => (y.by === uid) - (x.by === uid));
}
function todayScope(exs, uid, defaultOwner) {
  // Today：要做的按默认归属人的错题，做过的按我在全部错题上的作答；两者都用我的阶梯
  const done = viewFor(exs, uid);
  return { todo: ownedBy(done, defaultOwner), done };
}
function normAnswer(s) {
  return String(s == null ? '' : s).toLowerCase().trim().replace(/\s+/g, ' ').replace(/\.$/, '').trim();
}
function asNumber(t) {
  const u = t.replace(/(\d),(?=\d{3}(\D|$))/g, '$1').replace(/\s/g, '');
  return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(u) ? Number(u) : null;
}
function matchShort(response, accepted) {
  const r = normAnswer(response);
  if (!r) return false;
  const rn = asNumber(r);
  return (accepted || []).some(a => {
    const n = normAnswer(a);
    if (!n) return false;
    if (n === r) return true;
    const an = asNumber(n);
    return rn !== null && an !== null && rn === an;
  });
}
function judgeAuto(ex, response) {
  if (ex.format === 'mcq') return String(response || '').trim().toUpperCase() === String(ex.answer || '').trim().toUpperCase() ? 'right' : 'wrong';
  if (ex.format === 'pick') return normAnswer(response) && normAnswer(response) === normAnswer(ex.answer) ? 'right' : 'wrong';
  if (ex.format === 'short') {
    const acc = ex.accepted && ex.accepted.length ? ex.accepted : [ex.answer];
    return matchShort(response, acc) ? 'right' : 'wrong';
  }
  return null;
}
function cmpSetPos(a, b) {
  return ((a.setPos || 0) - (b.setPos || 0)) || String(a.createdAt).localeCompare(String(b.createdAt)) || String(a.id).localeCompare(String(b.id));
}
function lastUsed(e) {
  // 每日清单的「最久没用」键：阶梯输入里最后一条作答的时刻（只有 date 的按当天 0 点），没有时取录入时刻
  let t = '';
  for (const a of ladderInput(e.attempts)) { const k = a.at || (a.date ? a.date + 'T00:00' : ''); if (k > t) t = k; }
  return t || recordedKey(e);
}
function dailyList(exs, today, limit) {
  // 到期题逐题排：没做过的（阶梯输入为空）在前，再按最久没用（lastUsed 最早；没做过的即录入时刻），相同时按最早录入，再按题组（独立题在前）、组内 setPos、最小 id；取前 limit 道，挑中的同组题按 paperLayout 连排
  const due = exs.filter(e => !e.mastered && e.due && e.due <= today);
  const seen = e => ladderInput(e.attempts).length ? 1 : 0;
  const keyed = due.map(e => ({ e, k: { seen: seen(e), used: lastUsed(e), rec: String(recordedKey(e)), set: String(e.setId || ''), pos: e.setPos || 0, id: String(e.id) } }));
  keyed.sort((a, b) => (a.k.seen - b.k.seen) || a.k.used.localeCompare(b.k.used) || a.k.rec.localeCompare(b.k.rec) || a.k.set.localeCompare(b.k.set) || (a.k.pos - b.k.pos) || a.k.id.localeCompare(b.k.id));
  return paperLayout(keyed.slice(0, Math.max(0, limit)).map(x => x.e));

function paperLayout(drawn) {
  // 按抽题顺序，遇到题组的第一道题时把同组抽中的题按 setPos 接在后面
  const out = [], seen = new Set();
  for (const e of drawn) {
    if (!e.setId) { out.push(e); continue; }
    if (seen.has(e.setId)) continue;
    seen.add(e.setId);
    out.push(...drawn.filter(x => x.setId === e.setId).sort(cmpSetPos));

}
function cmpLast(a, b) {
  const x = a.lastAttemptAt, y = b.lastAttemptAt;
  if (!x && !y) return 0;
  if (!x) return -1;
  if (!y) return 1;
  return x.localeCompare(y);
}
function drawPaper(exs, opt) {
  const topics = opt.topics || [];
  const c = exs.filter(e => e.subject === opt.subject && (!topics.length || topics.includes(e.topic)));
  c.sort((a, b) => (b.wrongCount - a.wrongCount) || ((b.mastered ? 1 : 0) - (a.mastered ? 1 : 0)) || cmpLast(a, b));
  return c.slice(0, Math.max(0, opt.count));

function tally(results) {
  const s = { right: 0, partial: 0, wrong: 0 };
  for (const r of results) if (s[r] != null) s[r]++;

}
function nowLocal(d) { d = d || new Date(); return localToday(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function paperAttempts(paper, exs) {
  // 检验卷上每题的作答：按卷面顺序，取 paperId 为本卷的那条；错题已删时 ex 为 null
  const byId = {};
  for (const e of exs) byId[e.id] = e;
  return (paper.exerciseIds || []).map(id => {
    const e = byId[id];
    if (!e) return { id, ex: null, attempt: null };
    return { id, ex: e, attempt: (e.attempts || []).find(x => x.paperId === paper.id) || null };

function isDaily(p) { return p.kind === 'daily'; }
function handedInAt(paper, view, uid) {
  // 我交过这张卷的时刻：卷子的 handedIn 里记的；旧卷没有 handedIn 时取我（view）在本卷作答中最晚的 at（没有 at 取 date）；没交为 null
  if (paper.handedIn) return paper.handedIn[uid] || null;

  for (const e of view) for (const a of e.attempts || []) if (a.paperId === paper.id) { const t = a.at || a.date; if (t && (!last || t > last)) last = t; }

}
function todayPapers(papers, view, defaultOwner, uid, today) {
  // Today 的 Check papers：默认归属人的检验卷中我没交的，加我今天交的；没交的在前、组卷日期新的在前，交过的在后、交卷早的在前
  const at = p => handedInAt(p, view, uid);

  const from = weekStart(today), inWin = d => d >= from && d <= today;

function entrants(userIds, owners, balances, starter, rounds) {

  const ids = Object.keys(places), n = ids.length, out = {};

function podium(rows, coins) {
  // 领奖台：所有人按得分、再按本周挣的金币从高到低排；得分与金币都相同的站同一级；只摆前三级

  }

}

  let h = `<nav class="tabs" aria-label="Tabs">${TABS.map(t => `<button type="button" data-act="tab" data-v="${t[0]}" aria-pressed="${S.tab === t[0]}" ${S.run || matchLive() ? 'disabled' : ''}>${t[1]}</button>`).join('')}</nav>`;
  if (S.status === 'loading') h += `<div class="panel"><p class="muted">Opening the exercise book…</p></div>`;
  else if (S.status === 'nodb') h += `<div class="panel"><p class="h2">Data unavailable</p><p class="muted">Sign in with an invited Claude account, then open this page again. The exercises and answers live in this page's database, which can only be read and written after signing in.</p></div>`;
  else if (S.errMsg && !S.run) h += `<p class="note err">${esc(S.errMsg)}</p>`;
  if (S.status === 'ready' && (S.tab === 'today' || S.run)) h += renderPractice();
  else if (S.status === 'ready') h += renderManage();
  app.innerHTML = h;
}

/* ---------- Today ---------- */
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const wd = iso => { const p = iso.split('-').map(Number); return WD[new Date(p[0], p[1] - 1, p[2]).getDay()]; };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const tick = ok => ok ? '<span class="tick ok" aria-label="done">✓</span>' : '<span class="tick" aria-label="not yet">○</span>';
function renderPractice() {
  if (S.run) return renderPaperRun();
  const today = localToday();
  const dateLine = new Date().toLocaleDateString('en-SG', { weekday: 'short', day: 'numeric', month: 'short' });
  if (!S.exercises.length) {
    return `<section class="hello"><div class="hello-top"><h1>${hiLine()}</h1><span class="day">${dateLine}</span></div></section>
      <div class="panel"><p class="h2">Your exercise book is empty</p><p class="muted">When a wrong answer gets recorded, it shows up here the next day for a redo. Add the questions from the last worksheet or test in Record.</p></div>`;
  }
  const sc = todayScope(S.exercises, S.me, S.settings.defaultOwner);
  const redo = redoButtons(sc.todo, today);
  const cps = todayPapers(S.papers, sc.done, S.settings.defaultOwner, S.me, today);
  const db = dashboardData(sc.todo, sc.done, today);
  const week = weekReview(sc.done, S.papers, today, S.me);
  return helloBlock(dateLine, db)
    + todayBlock(today, redo, cps, sc.todo, sc.done, week)
    + planBlock(dueByDay(sc.todo, today), today, sc.done, week)
    + reviewBlock(week)
    + progressBlock(db);
}

/* 问候、今天的对题数、新掌握数与连续天数 */
function hiLine() { const n = S.names[S.me]; return n ? `Hi ${esc(n)}` : 'Hi'; }
function helloBlock(dateLine, db) {
  // 两行：问候与日期；今天的对题数、新掌握数与连续天数，放不下时折行
  return `<section class="hello" aria-label="Hello">
    <div class="hello-top"><h1>${hiLine()}</h1><span class="day">${dateLine}</span></div>
    <p class="hello-line hello-stats">${esc(helloStats(db).join(' · '))}</p>

}

/* 今天：每日重做与未做的检验卷 */
function redoButtons(todo, today) {
  // 每科一个：题是这一科此刻的一批（每科各算一批）；没有到期题的科目不出按钮
  return SUBJECTS.map(([s]) => {
    const ids = subjectBatch(todo, today, S.settings.dailyLimit, s).map(e => e.id);
    return { subject: s, n: ids.length, ids };
  }).filter(b => b.n);
}
function todayBlock(today, redo, cps, todo, view, week) {
  // n 是各按钮这一批的题数之和；大数字与按钮写「已做/一共」：已做只数每日重做，一共是已做与此刻全部到期的并集；某科没有要做的、但今天做过时出打勾标签
  const n = redo.reduce((t, b) => t + b.n, 0);
  const tc = todayCounts(todo, today, dueNowIds(todo, today));
  const frac = c => `${c.done}/${c.all}`;
  const subjC = Object.fromEntries(tc.bySubject);
  const next = todo.filter(e => !e.mastered && e.due && e.due > today).map(e => e.due).sort()[0];
  // 还有要做的题时不出 h2（大数字已说明已做/一共），只说过期与今天到期各几题、全部到期题主要哪些专题，错得多的专题提醒重读讲解；没有要做的题时 h2 说做完了或今天没有
  const head = n ? '' : tc.total.done ? 'All caught up for today!' : 'Nothing due today';
  const ds = dueSplit(todo, today);
  const split = [[ds.overdue, 'overdue'], [ds.today, 'due today']].filter(x => x[0]).map(x => `${x[0]} ${x[1]}`).join(' · ');
  const tops = leftMix(todo, dueNowIds(todo, today)).topics.slice(0, 2).map(t => esc(topicLabel(t.subject, t.topic)));
  const tip = keyIdeaTip(week, t => topicLabel(t.subject, t.topic, 'en'));
  const whatsLeft = `${split}${tops.length ? `<br>Mostly ${tops.join(' and ')}.` : ''}`;
  let h = `<section class="today" aria-label="Today">
    <p class="h3 today-h">Today</p>
    <div class="big num" aria-hidden="true">${tc.total.all ? `${tc.total.done}<span class="of">/${tc.total.all}</span>` : 0}</div>
    <div class="txt">
      ${head ? `<p class="h2">${head}</p>` : ''}
      <p class="muted small">${!todo.length ? `No questions for ${esc(userName(S.settings.defaultOwner))} yet — choose a default owner in Settings.` : n ? whatsLeft : !next ? 'Everything here is mastered.' : tc.total.done ? `Next redo: ${wd(next)} ${fmtDate(next)}.` : `Next redo comes up on ${fmtDate(next)}.`}</p>
      ${n && tip ? `<p class="small">${esc(tip)}</p>` : ''}
      ${tc.total.all ? `<div class="row">${redo.map(b => `<button type="button" class="btn primary" data-act="start-daily" data-subject="${b.subject}">${esc(SUBJ[b.subject].en)} · ${frac(subjC[b.subject])}</button>`).join('')}${tc.bySubject.filter(([s]) => !redo.some(b => b.subject === s)).map(([s, c]) => `<span class="done-tag">✓ ${esc(SUBJ[s].en)} · ${frac(c)}</span>`).join('')}</div>` : ''}
    </div>`;
  if (cps.length) {
    // 没交的是按钮，点了开始做；今天交的只显示进度与得分，不能点
    h += `<div class="today-papers"><p class="h3">Check papers</p><div class="list">${cps.map(p => {
      const pr = paperProgress(p, view), handed = handedInAt(p, view, S.me);
      const side = `<span class="side"><span class="num">${pr.done}/${pr.total}${handed ? ` · ${paperScore(p, view).right} right` : ''}</span></span>`;
      const body = `<span class="t">${paperTag(p)} ${esc(pname(p))}</span>${side}<span class="meta"><span>set ${fmtDate(p.createdAt)}</span></span>`;
      return handed ? `<div class="item" style="cursor:default">${body}</div>` : `<button type="button" class="item" data-act="start-paper" data-id="${esc(p.id)}">${body}</button>`;
    }).join('')}</div></div>`;
  }
  return h + `</section>`;
}

/* 计划：未来 7 天每天的题数（今天之后按全对推算）与本周目标 */
function planBlock(days, today, done, week) {
  const st = S.settings, ws = weekStart(today);
  const g = goalProgress(done, S.papers, ws, addDays(ws, 6), S.me);
  const goals = [`<li>${tick(g.days >= st.practiceDays)}<span>Practise on ${st.practiceDays} days: <b class="num">${g.days}/${st.practiceDays}</b></span></li>`];
  if (st.papersPerWeek > 0) {
    const met = g.papers >= st.papersPerWeek;
    goals.push(`<li>${tick(met)}<span>Check papers: <b class="num">${g.papers}/${st.papersPerWeek}</b>${met ? '' : esc(paperTry(week, t => topicLabel(t.subject, t.topic, 'en')))}</span></li>`);
  }
  return `<section class="panel plan" aria-label="Next 7 days">
    <p class="h3">Next 7 days</p>
    <ol class="days7">${days.map((x, i) => `<li class="${i === 0 ? 'is-today' : ''}${x.count ? '' : ' zero'}" title="${fmtDate(x.date)}: ${plural(x.count, 'question')}"><span class="d">${i === 0 ? 'Today' : wd(x.date)}</span><span class="n num">${x.count}</span></li>`).join('')}</ol>
    <div class="sub"><p class="h3">This week</p><ul class="checklist">${goals.join('')}</ul></div>
  </section>`;
}

/* 回顾：最近 7 天 */
function reviewBlock(week) {
  const label = g => {
    if (g.kind === 'concept') { const c = nameOf(g.subject, 'concept', g.id); return mapLink(g.subject, g.id, c ? c.en : g.id); }
    return esc(topicLabel(g.subject, g.id, 'en'));
  };
  const mastered = week.newlyMastered.length ? `<ul class="mastered">${week.newlyMastered.map(g => `<li>${subjChip(g.subject)}<span>${label(g)}</span>${g.n > 1 ? `<span class="muted num">×${g.n}</span>` : ''}</li>`).join('')}</ul>` : '';
  return `<section class="panel review" aria-label="Last 7 days">
    <p class="h3">Last 7 days</p>
    <div class="rv-head"><span class="rv-n num">${week.questions}</span><span class="h2">question${week.questions === 1 ? '' : 's'} reviewed</span></div>
    <p class="small muted">${esc(reviewLine(week))}</p>
    <div class="legend small"><span><i style="background:var(--c-right)"></i>Right</span><span><i style="background:var(--c-partial)"></i>Partly</span><span><i style="background:var(--c-wrong)"></i>Wrong</span></div>
    ${activityChart(week.days)}
    ${mastered ? `<div class="sub"><p class="h3">Newly mastered</p>${mastered}</div>` : ''}
  </section>`;
}

function activityChart(days) {
  // 每天一列、7 列平分块宽；每列一根按对、部分对、错自下而上叠的柱子（最后一天是今天），段间 2px 间隔；每列一个提示
  // 段里写它的次数：柱高取「16px × min(3, 当天次数)」与按比例的高中大的那个（只随当天次数增，次数少的柱不会更高），每个有数的段先给 16px，余下（扣去段间 2px）按段内次数分
  const n = days.length, H = 96, MIN = 16;
  const max = Math.max(1, ...days.map(d => d.right + d.partial + d.wrong));
  const order = [['right', 'var(--c-right)'], ['partial', 'var(--c-partial)'], ['wrong', 'var(--c-wrong)']];
  const cols = days.map(d => {
    const tot = d.right + d.partial + d.wrong, on = order.filter(([k]) => d[k] > 0);
    const spare = Math.max(MIN * Math.min(3, tot), tot / max * H) - MIN * on.length - 2 * Math.max(0, on.length - 1);
    const segs = on.map(([k, c]) => `<i class="seg-${k}" style="height:${(MIN + (tot ? d[k] / tot * spare : 0)).toFixed(1)}px;background:${c}"><b class="num">${d[k]}</b></i>`).join('');
    return `<div class="col" title="${fmtDate(d.date)}: ${d.right} right, ${d.partial} partly, ${d.wrong} wrong">${tot ? `<span class="v num">${tot}</span><span class="stack">${segs}</span>` : '<span class="stack none"></span>'}</div>`;
  }).join('');
  return `<div role="img" aria-label="Answers in the last ${n} days"><div class="bars7">${cols}</div><div class="bars7-x" aria-hidden="true">${days.map((d, i) => `<span>${i === n - 1 ? 'Today' : wd(d.date)}</span>`).join('')}</div></div>`;
}

/* 阶梯：五段的环形图与图例 */
const LADDER_SEGS = [[1, '1st redo (day 1)', 'var(--lad1)'], [2, '2nd redo (day 3)', 'var(--lad2)'], [3, '3rd redo (day 7)', 'var(--lad3)'], [4, '4th redo (day 14)', 'var(--lad4)'], ['mastered', 'Mastered', 'var(--lad-m)']];
function progressBlock(db) {
  const sh = ladderShares(db.ladder), R = 54, C = 2 * Math.PI * R, live = sh.filter(x => x.n);
  // 环从 12 点起顺时针；多于一段时每段末尾留 2px 底色间隔
  let off = 0;
  const arcs = live.map(x => {
    const len = x.n / db.total * C, gap = live.length > 1 ? Math.min(2, len / 2) : 0, seg = LADDER_SEGS.find(g => g[0] === x.key);
    const el = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${seg[2]}" stroke-width="18" stroke-dasharray="${(len - gap).toFixed(2)} ${(C - len + gap).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${seg[1]}: ${x.n} (${x.pct}%)</title></circle>`;
    off += len;
    return el;
  }).join('');
  const label = 'Ladders: ' + sh.map(x => x.key === 'mastered' ? `${x.n} mastered` : `${x.n} at ${['1st', '2nd', '3rd', '4th'][x.key - 1]} redo`).join(', ');
  return `<section class="panel dash" aria-label="Ladders">
    <p class="h3">Ladders</p>
    <div class="lad">
      <svg viewBox="0 0 140 140" role="img" aria-label="${label}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--surface-2)" stroke-width="18"></circle>${arcs}<text x="70" y="72" text-anchor="middle" class="lad-n num">${db.total}</text><text x="70" y="90" text-anchor="middle" class="lad-t">question${db.total === 1 ? '' : 's'}</text></svg>
      <ul class="lad-legend">${sh.map((x, i) => `<li><span class="sw" style="background:${LADDER_SEGS[i][2]}"></span><span class="k">${LADDER_SEGS[i][1]}</span><span class="num"><b>${x.n}</b> · ${x.pct}%</span></li>`).join('')}</ul>
    </div>
  </section>`;
}

function exById(id) { return S.exercises.find(e => e.id === id); }

function bankOf(e) { const x = e.setId && setById(e.setId); return x ? parseList(x.wordBank) : []; }
function mustUseNote(e, response) {
  const c = mustUseCheck(response, e.mustUse);
  if (!c) return '';
  const out = c.missing.map(m => `Your answer must use "${m}".`);
  if (c.multi) out.push('Your answer must be one sentence.');
  return out.join(' ');
}
function questionBody(e, opts) {
  // 卡片左上角是专题，不写题号（题号看翻页条）；opts: {key, response, locked, showCorrect, result（对错，给作答框着色）, right（卡片右上角的内容）}
  const o = opts || {};
  const rc = o.showCorrect && o.result ? ` res-${o.result}` : '';
  let h = `<div class="qhead"><span class="chip">${esc(topicLabel(e.subject, e.topic))}</span>${e.test ? '<span class="chip test">TEST</span>' : ''}${o.right ? `<span class="qhead-r">${o.right}</span>` : ''}</div>`;
  if (e.stem) h += `<div class="stem">${ul(e.stem)}</div>`;
  h += photosBlock(e.images, 'Question photo');
  const r = o.response || '';
  if (e.format === 'mcq') {
    h += `<div class="opts" role="group" aria-label="Options">${(e.options || []).map((t, i) => {
      const L = LETTERS[i];
      let cls = '';
      if (o.showCorrect) { if (L === String(e.answer).toUpperCase()) cls = ' is-right'; else if (L === r) cls = ' is-wrong'; }
      return `<button type="button" class="opt${cls}" data-act="pick" data-key="${esc(o.key)}" data-v="${L}" aria-pressed="${r === L}" ${o.locked ? 'disabled' : ''}><span class="l">(${i + 1})</span><span>${esc(t)}</span></button>`;
    }).join('')}</div>`;
  } else if (e.format === 'pick' && bankOf(e).length) {
    // 选词：词表作为作答按钮，点选的词即回答
    h += `<div class="small muted">Choose from the word bank</div><div class="bank" role="group" aria-label="Word bank">${bankOf(e).map(w => {
      let cls = '';
      if (o.showCorrect) { if (normAnswer(w) === normAnswer(e.answer)) cls = ' is-right'; else if (w === r) cls = ' is-wrong'; }
      return `<button type="button" class="opt word${cls}" data-act="pick" data-key="${esc(o.key)}" data-v="${esc(w)}" aria-pressed="${r === w}" ${o.locked ? 'disabled' : ''}>${esc(w)}</button>`;
    }).join('')}</div>`;
  } else if (e.format === 'short' || e.format === 'pick') {
    h += `<label class="f"><span>Your answer</span><input type="text" class="answer-in${rc}" id="ans-${esc(o.key)}" data-ans="${esc(o.key)}" value="${esc(r)}" ${o.locked ? 'disabled' : ''} autocomplete="off"></label>`;
  } else {
    h += `<label class="f"><span>Your answer</span><textarea class="answer-in${rc}" id="ans-${esc(o.key)}" data-ans="${esc(o.key)}" rows="4" ${o.locked ? 'disabled' : ''}>${esc(r)}</textarea></label>`;
  }
  return h;
}

function explanationHtml(text) {
  const x = parseExplanation(text);
  if (!x.structured) return `<div class="exp">${x.paras.map(p => `<p>${hl(p)}</p>`).join('')}</div>`;
  let h = '<div class="exp why">';
  if (x.keyIdea) h += `<div class="why-sec"><div class="why-h">Key idea</div><p>${hl(x.keyIdea)}</p></div>`;
  if (x.steps.length) h += `<div class="why-sec"><div class="why-h">Steps</div><ol>${x.steps.map(t => `<li>${hl(t)}</li>`).join('')}</ol></div>`;
  if (x.watchOut.length) h += `<div class="why-sec watch"><div class="why-h">Watch out</div>${x.watchOut.length > 1 ? `<ul>${x.watchOut.map(t => `<li>${hl(t)}</li>`).join('')}</ul>` : `<p>${hl(x.watchOut[0])}</p>`}</div>`;
  return h + '</div>';
}
function solutionBlock(e) {
  let ans = '';
  if (e.format === 'mcq') { const i = LETTERS.indexOf(String(e.answer).toUpperCase()); ans = `(${i + 1}) ${e.options && e.options[i] != null ? e.options[i] : ''}`; }
  else ans = e.answer;
  const c = nameOf(e.subject, 'concept', e.concept), q = nameOf(e.subject, 'qtype', e.qtype);
  const links = [c ? 'Concept: ' + mapLink(e.subject, e.concept, c.en) : '', q ? 'Question type: ' + mapLink(e.subject, e.qtype, q.en) : ''].filter(Boolean).join(' · ');
  return `<div class="solution">
    <div><span class="muted small">${e.format === 'open' ? 'Model answer' : 'Correct answer'}</span><div class="ans">${e.format === 'open' ? hl(ans) : esc(ans)}</div></div>
    ${e.solution ? `<div><span class="muted small">Why</span>${explanationHtml(e.solution)}</div>` : ''}
    ${links ? `<div class="small muted">${links}</div>` : ''}
  </div>`;
}

const MARK_TITLE = { todo: 'not answered yet', answered: 'answered', right: 'right', partial: 'partly right', wrong: 'wrong', tomark: 'to self-mark', none: 'no answer', gone: 'deleted' };
function cardPager(marks, idx, act) {
  // 卡片上方的翻页条（一行，占满宽度）：只有题号（按状态着色，当前题 aria-pressed；放不下时按 pagerSlots 用省略号）；作答页与 View details 共用
  // 一行放得下的位置数按页面宽度估：每个题号约 27px
  const n = marks.length, vw = window.innerWidth || 880, avail = Math.min(vw, 880) - (vw >= 720 ? 56 : 32);
  const max = Math.floor(avail / 27);
  return `<nav class="cardpager" aria-label="Questions"><div class="cp-row">
    ${pagerSlots(n, idx, max).map(i => i === null ? '<span class="pg-gap" aria-hidden="true">…</span>' : `<button type="button" class="pg-n m-${marks[i]}" data-act="${act}" data-v="${i}" aria-pressed="${i === idx}" title="Question ${i + 1}: ${MARK_TITLE[marks[i]] || marks[i]}">${i + 1}</button>`).join('')}</div></nav>`;
}
function cardNav(idx, n, act, lastLabel) {
  // 题卡底部：左边 Previous、右边 Next；第一张的 Previous 不可点；最后一张给了 lastLabel 时 Next 换成交卷按钮（作答阶段），否则不可点；作答页与 View details 共用
  const next = idx >= n - 1 && lastLabel
    ? `<button type="button" class="btn primary small" data-act="paper-submit">${lastLabel}</button>`
    : `<button type="button" class="btn ghost small" data-act="${act}" data-v="${idx + 1}" ${idx >= n - 1 ? 'disabled' : ''}>Next →</button>`;
  return `<div class="card-nav"><button type="button" class="btn ghost small" data-act="${act}" data-v="${idx - 1}" ${idx <= 0 ? 'disabled' : ''}>← Previous</button>${next}</div>`;
}
function runExs() { const p = S.run && S.papers.find(x => x.id === S.run.paperId); return p ? p.exerciseIds.map(exById).filter(Boolean) : []; }
function renderPaperRun() {
  // 检验卷与每日卷同一个作答页：一次一张卡，翻页条在卡片上方，Hand in 在顶上一行、作答阶段也在最后一张卡的底部；交卷即存客观题，主观题自评即存并锁定
  const R = S.run;
  const p = S.papers.find(x => x.id === R.paperId);
  if (!p) return `<div class="panel"><p>That paper is gone.</p><div><button class="btn" type="button" data-act="exit-run">Back</button></div></div>`;
  const exs = runExs();
  R.idx = Math.min(Math.max(0, R.idx || 0), Math.max(0, exs.length - 1));
  const marks = runMarks(exs, R.phase, R.responses, R.results, R.saved);
  let h = `<div class="progress">${paperTag(p)}<span class="small muted">${esc(pname(p))}</span><div class="grow"></div>${R.phase === 'answer' ? `<button type="button" class="btn primary" data-act="paper-submit">${R.warn ? 'Hand in anyway' : 'Hand in'}</button><button type="button" class="btn ghost small" data-act="exit-run">Stop</button>` : ''}</div>`;
  if (R.phase === 'review') {
    // 得分立即显示：客观题交卷即判，主观题自评存好后算进
    const s = tally(exs.filter(e => e.format === 'open' ? R.saved[e.id] : R.results[e.id]).map(e => R.results[e.id]));
    const toMark = exs.filter(e => e.format === 'open' && !R.saved[e.id]).length;
    // 摘要卡右上角是返回（与 View details 的返回同一位置）
    h += `<section class="panel"><div class="sum-head"><p class="h3 grow">${R.saving ? 'Saving…' : R.handed ? 'Handed in · saved' : 'Not saved yet'}</p><button type="button" class="btn ghost small" data-act="exit-run" aria-label="Back to today">← Back<span class="wide-only"> to today</span></button></div>
      <div class="row"><span class="score num">${s.right}/${exs.length}</span><span class="muted">${s.right} right · ${s.partial} partly · ${s.wrong} wrong${toMark ? ` · ${toMark} to self-mark` : ''}</span></div>
      <p class="muted small">${toMark ? 'Check your written answers against the model answers and mark each one.' : 'Any you missed go back to the start of the ladder.'}</p></section>`;
  }
  if (R.phase === 'answer' && R.warn) {
    // 交卷前的提醒：必用词（每题一行）与没答的题（题号可点，跳到那张卡）
    h += `<div class="note err">${R.warn.must.map(w => `<div>${esc(w)}</div>`).join('')}${R.warn.missing.length ? `<div>No answer yet: questions ${R.warn.missing.map(n => `<button type="button" class="linkbtn" data-act="card-go" data-v="${n - 1}">${n}</button>`).join(', ')}.</div>` : ''}<div>You can fix them, or hand in anyway.</div></div>`;
  }
  if (exs.length) {
    const i = R.idx, e = exs[i], key = 'p' + i;
    h += cardPager(marks, i, 'card-go');
    // 交卷后的对错看作答的底色（选项、作答框）；题组材料放在卡片下方，每张卡都放、默认收起，点开后同组各卡保持展开（R.openSets）
    const res = R.results[e.id], shown = R.phase === 'review' && res && (e.format !== 'open' || R.saved[e.id]);
    h += `<article class="sheet">${questionBody(e, { key, response: R.responses[e.id] || '', locked: R.phase !== 'answer', showCorrect: R.phase === 'review', result: shown ? res : '' })}`;
    if (R.phase === 'review') {
      h += solutionBlock(e);
      if (e.format === 'open' && !R.saved[e.id]) h += `<div class="selfmark" role="group" aria-label="Self-mark">${['right', 'partial', 'wrong'].map(r => `<button type="button" data-act="paper-self" data-id="${esc(e.id)}" data-r="${r}" ${R.handed && !R.saving ? '' : 'disabled'}>${RESULT[r].sym} ${RESULT[r].en}</button>`).join('')}</div>`;
    }
    h += cardNav(i, exs.length, 'card-go', R.phase === 'answer' ? (R.warn ? 'Hand in anyway' : 'Hand in') : '') + '</article>';
    if (e.setId) h += materialBlock(setById(e.setId), !!(R.openSets && R.openSets[e.setId]));
  }
  if (R.phase === 'review' && !R.handed) h += `<div class="row"><button type="button" class="btn primary" data-act="paper-submit" ${R.saving ? 'disabled' : ''}>${R.saving ? 'Saving…' : 'Save again'}</button></div>`;
  if (R.err) h += `<p class="note err">${esc(R.err)}</p>`;
  return h;
}

/* ---------- 管理标签 ---------- */
function renderManage() {
  let h = '';
  if (S.tab === 'record') h = renderRecord();
  else if (S.tab === 'exercises') h = renderExercises();
  else if (S.tab === 'papers') h = S.paperView ? renderPaperSheet(S.paperView) : renderPapers();
  else if (S.tab === 'games') h = renderGames();
  else h = renderSettings();
  return `<div style="display:grid;gap:12px">${h}</div>`;
}

function subjectOptions(sel, withAuto) {
  return (withAuto ? `<option value="">Let AI decide</option>` : `<option value="">Choose subject</option>`) + SUBJECTS.map(s => `<option value="${s[0]}" ${sel === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('');
}

function renderRecord() {
  const L = S.imgLimits, canPhoto = !!(S.assets && L), canSample = !!S.sample;

  let h = `<section class="panel">
    <p class="h2">Record exercises</p>
    <p class="small muted">Take a photo or paste the question text; AI splits it into drafts. Check each draft before saving, especially the answer.</p>`;
  if (canPhoto) {
    // 两个按钮：拍照（直接开相机）与选照片（从相册或文件里多选）
    const off = full || busy, acc = esc((L.mediaTypes || ['image/*']).join(','));
    h += `<div class="picks">
      <label class="pick${off ? ' off' : ''}"><input type="file" id="rec-camera" data-photos="1" accept="${acc}" capture="environment" ${off ? 'disabled' : ''}><span class="pick-ico" aria-hidden="true">📷</span><span class="pick-main">Take photo</span></label>
      <label class="pick${off ? ' off' : ''}"><input type="file" id="rec-files" data-photos="1" accept="${acc}" multiple ${off ? 'disabled' : ''}><span class="pick-ico" aria-hidden="true">🖼️</span><span class="pick-main">Choose photos</span></label>
    </div><p class="pick-sub">${full ? `Limit of ${max} photos reached` : `Add them one by one, up to ${max}`}</p>`;

  } else if (canSample) h += `<p class="small muted">This page can't send photos to AI right now; paste the question text instead.</p>`;
  h += `<label class="f"><span>Or paste the question text</span><textarea id="rec-text" data-bind="recText" rows="3" placeholder="e.g. Which of the following is a non-flowering plant? (1) hibiscus (2) fern (3) rice (4) mango — Sophia chose (1)">${esc(S.recText)}</textarea></label>

      <label class="f"><span>Subject</span><select id="rec-subject" data-bind="recSubject">${subjectOptions(S.recSubject, true)}</select></label>

      <button type="button" class="btn primary" data-act="recognise" ${(!canSample || busy) ? 'disabled' : ''}>${busy ? 'Reading…' : 'Read with AI'}</button>
    </div>
    ${!canSample ? '<p class="note err">Reading with AI is unavailable right now, so exercises can\'t be recorded here for the moment.</p>' : ''}
    ${S.recMsg ? `<p class="note ${S.recMsg.kind}">${esc(S.recMsg.text)}</p>` : ''}
  </section>`;
  const newDrafts = S.drafts.filter(d => !d.editId);
  const saveNote = S.saveMsg ? `<p class="note ${S.saveMsg.kind}">${esc(S.saveMsg.text)}</p>` : '';

    h += `<div id="rec-drafts" style="display:grid;gap:8px"><div class="row"><p class="h2 grow">To check: ${plural(newDrafts.length, 'exercise')}${S.setDrafts.length ? `, ${plural(S.setDrafts.length, 'question set')}` : ''}</p><button type="button" class="btn primary" data-act="save-all">Save all</button><button type="button" class="btn ghost" data-act="discard-all">Discard all</button></div>${saveNote}</div>`;

function clearPhotos() {
  for (const p of S.recPhotos) URL.revokeObjectURL(p.url);
  S.recPhotos = [];
}
function addPhotos(files) {
  const L = S.imgLimits, skipped = [];
  for (const f of files) {
    if (S.recPhotos.length >= L.maxCount) skipped.push(`"${f.name}" is over the limit of ${L.maxCount} photos`);
    else if (L.maxInputBytes && f.size > L.maxInputBytes) skipped.push(`"${f.name}" is too large (max ${Math.floor(L.maxInputBytes / 1048576 * 10) / 10} MB); use another photo or shrink it first`);
    else S.recPhotos.push({ file: f, url: URL.createObjectURL(f), assetId: null });
  }
  if (skipped.length) S.recMsg = { kind: 'err', text: 'Not added: ' + skipped.join('; ') + '.' };
}

      ${f('cause', 'Error cause', `<select id="d${k}-cause" data-d="${k}" data-f="cause">${CAUSES.map(c => `<option value="${c[0]}" ${d.cause === c[0] ? 'selected' : ''}>${c[1]}</option>`).join('')}</select>`)}

    ${f('stem', (d.setRef ? 'Question text (for a question inside the material: the sentence that holds it)' : 'Question text') + '; [[ ]] shows as underlined', ta('stem', d.stem, 4))}`;

  }
  h += f('solution', 'Explanation (three parts: Key idea: … / Steps: 1. … / Watch out: …; key words in [[ ]])', ta('solution', d.solution, 5, 'Key idea: …\nSteps:\n1. …\n2. …\nWatch out: …'));
  h += `<div class="grid2">${f('source', 'Source', inp('source', d.source, 'e.g. 2026 P5 SA2 Paper 2 Q7'))}</div>`;
  if (d.error) h += `<p class="note err">${esc(d.error)}</p>`;
  h += `<div class="row"><button type="button" class="btn primary" data-act="save-draft" data-k="${k}">${d.editId ? 'Save changes' : 'Save this one'}</button>${d.editId ? `<button type="button" class="btn ghost" data-act="cancel-edit" data-k="${k}">Cancel</button>` : ''}</div></section>`;
  return h;
}

function newDraft(x) {
  x = x || {};
  const subject = SUBJ[x.subject] ? x.subject : (S.recSubject || '');
  const topic = subject && nameOf(subject, 'topic', x.topic) ? x.topic : '';
  const concept = topic && nameOf(subject, 'concept', x.concept) && IDX[subject].concept[x.concept].topic === topic ? x.concept : '';
  const qtype = subject && nameOf(subject, 'qtype', x.qtype) ? x.qtype : '';
  const format = ['mcq', 'pick', 'short', 'open'].includes(x.format) ? x.format : 'open';
  let options = Array.isArray(x.options) ? x.options.map(String) : [];
  if (format === 'mcq') while (options.length < 4) options.push('');
  return {
    key: draftSeq++, editId: x.editId || null, owner: x.owner || null, subject, topic, concept, qtype, format,
    stem: String(x.stem || ''), options: format === 'mcq' ? options : ['', '', '', ''],
    answer: String(x.answer || (format === 'mcq' ? 'A' : '')),
    accepted: Array.isArray(x.accepted) ? x.accepted.filter(a => normAnswer(a) !== normAnswer(x.answer)).join('; ') : String(x.accepted || ''),
    solution: String(x.solution || ''), wrongAnswer: String(x.wrongAnswer || ''),
    cause: CAUSE[x.cause] ? x.cause : 'concept', source: String(x.source || ''),
    images: Array.isArray(x.images) ? x.images.slice() : [], error: (x.topic && !topic) ? "Claude's topic isn't in the list; please choose one." : '',
    setRef: x.setRef != null ? String(x.setRef) : String(x.setId || ''), origSetId: x.setId || null, setPos: x.setPos || null,
    mustUse: parseList(x.mustUse).join('; ')
  };
}

function draftToDoc(d) {
  const err = [];
  if (!SUBJ[d.subject]) err.push('subject');
  if (!d.topic) err.push('topic');
  const sd = setOfDraft(d);
  if (d.setRef && !sd) err.push('question set');
  if (sd && sd.subject && sd.subject !== d.subject) err.push('the same subject as its set');
  const hasMat = sd && (String(sd.text || '').trim() || (sd.images || []).length);
  if (!d.stem.trim() && !d.images.length && !hasMat) err.push('question text or photo');
  const options = d.format === 'mcq' ? d.options.map(o => o.trim()) : [];
  if (d.format === 'mcq' && options.filter(Boolean).length < 2) err.push('at least two options');
  if (!String(d.answer).trim()) err.push('answer');
  if (d.format === 'pick') {
    const bank = sd ? parseList(sd.wordBank) : [];
    if (!bank.length) err.push('a question set with a word bank');
    else if (!bank.some(w => normAnswer(w) === normAnswer(d.answer))) err.push('an answer from the word bank');
  }
  if (!(d.editId ? d.owner : recOwner())) err.push('owner');
  if (err.length) return { error: 'Still missing: ' + err.join(', ') };
  const accepted = d.format === 'short' ? [d.answer.trim()].concat(d.accepted.split(';').map(a => a.trim()).filter(Boolean)) : [];
  return { doc: {
    subject: d.subject, topic: d.topic, concept: d.concept || null, qtype: d.qtype || null, format: d.format,
    stem: d.stem.trim(), images: d.images, options, answer: String(d.answer).trim(), accepted,
    solution: d.solution.trim(), wrongAnswer: d.wrongAnswer.trim(), cause: d.cause, source: d.source.trim(),
    mustUse: d.format === 'open' ? parseList(String(d.mustUse || '').replace(/\n/g, ';')) : []
  } };
}

function renderExercises() {
  const editing = S.drafts.find(d => d.editId);
  if (editing) return draftForm(editing);
  if (S.detailId) return renderDetail();
  const F = S.filters, today = localToday();
  const owned = mine().filter(e => !F.owner || sameOwner(e.owner, F.owner));
  const list = owned.filter(e => (!F.subject || e.subject === F.subject) && (!F.topic || e.topic === F.topic) && (!F.cause || e.cause === F.cause)
    && (!F.state || (F.state === 'mastered' ? e.mastered : F.state === 'due' ? (!e.mastered && e.due && e.due <= today) : !e.mastered))
    && matchesQuery(e, e.setId && setById(e.setId), F.q));
  const sorted = sortExercises(list, S.listSort.key, S.listSort.dir);
  const pg = pageSlice(sorted, S.listPage, 20);
  S.listPage = pg.page;
  const topicOpts = F.subject ? TAX[F.subject].topics.map(t => `<option value="${t[0]}" ${F.topic === t[0] ? 'selected' : ''}>${esc(t[3])}</option>`).join('') : '';
  // 筛选一行：搜索框与下拉框不另加标签，第一项写明「全部」；选了的高亮；排序与题数一行
  const on = k => F[k] ? ' on' : '';
  const sel = (k, label, opts, dis) => `<select id="flt-${k}" class="compact${on(k)}" data-filter="${k}" aria-label="${label}" ${dis ? 'disabled' : ''}>${opts}</select>`;
  const opt = (k, v, t) => `<option value="${v}" ${F[k] === v ? 'selected' : ''}>${t}</option>`;
  const anyF = ['owner', 'subject', 'topic', 'cause', 'state'].some(k => F[k]) || !!String(F.q || '').trim();
  let h = `<section class="panel list-tools">
    <div class="filters">

function subjectCards(exs, today, active) {
  // 每科一张小卡：只按 Owner 筛选后的错题算，不随其他筛选与搜索变；点卡按这一科筛选，再点取消
  const cards = subjectSummary(exs, today);
  if (!cards.length) return '';
  return `<div class="subj-cards">${cards.map(c => {
    const segs = c.steps.map((n, i) => [n, LADDER_SEGS[i][2]]).concat([[c.mastered, LADDER_SEGS[4][2]]]).filter(x => x[0]);
    return `<button type="button" class="subj-card" data-act="subj-card" data-v="${c.subject}" aria-pressed="${active === c.subject}" title="${active === c.subject ? 'Show all subjects' : 'Show only ' + esc(SUBJ[c.subject].en)}">
      <span class="sc-h">${esc(SUBJ[c.subject].en)} · <span class="num">${c.n}</span></span>
      <span class="ladbar" role="img" aria-label="${c.steps.map((n, i) => `${n} at ${['1st', '2nd', '3rd', '4th'][i]} redo`).join(', ')}, ${c.mastered} mastered">${segs.map(([n, col]) => `<i style="flex:${n};background:${col}"></i>`).join('')}</span>
      <span class="num"><b>${c.due}</b> due · <b>${c.mastered}</b> mastered · wrong ${c.wrongAvg.toFixed(1)}× on average</span>
      <span>Top topics: ${c.topics.map(t => `${esc(topicLabel(c.subject, t.topic))} <b class="num">${t.n}</b>`).join(' · ')}</span>
      <span>${c.causes.map(([k, n]) => `${esc(CAUSE[k] ? CAUSE[k].en : k)} <b class="num">${n}</b>`).join(' · ')}</span>
    </button>`;
  }).join('')}</div>`;
}

    <tr><td class="num">${esc(a.at ? a.at.replace('T', ' ') : a.date)}</td><td>${a.mode === 'paper' ? (S.papers.some(p => p.id === a.paperId) ? 'Check paper' : 'Check paper (deleted)') : 'Daily redo'}</td><td>${esc(a.response || '—')}</td>

const JUDGE = { auto: 'Auto', self: 'Self', parent: 'Override' };
function renderPaperSheet(paperId) {
  // 卷子详情（可改判）：一次一张卡，翻页条在卡片上方；题组材料同作答页
  const p = S.papers.find(x => x.id === paperId);
  const back = `<button type="button" class="btn ghost small" data-act="paper-view-close" aria-label="Back to papers">← Back<span class="wide-only"> to papers</span></button>`;
  if (!p) return `<div class="row">${back}</div><p class="note">This paper has been deleted.</p>`;
  const rows = paperAttempts(p, mine()), sc = paperScore(p, mine());
  const doneAt = handedInAt(p, mine(), S.me), when = doneAt ? doneAt.replace('T', ' ') : 'not done';
  // 摘要卡：右上角返回；得分右侧上一行对错计数、下一行交卷时刻
  let h = `<section class="panel"><div class="sum-head">${paperTag(p)}<p class="h2 grow">${esc(pname(p))}</p>${back}</div>
    <div class="row"><span class="score num">${sc.right}/${sc.total}</span><div class="sum-txt"><span class="muted">Right ${sc.right} · Partly ${sc.partial} · Wrong ${sc.wrong}</span><span class="small muted">Handed in <b>${esc(when)}</b></span></div></div>
  </section>`;
  if (!rows.length) return h;
  const i = S.paperIdx = Math.min(Math.max(0, S.paperIdx || 0), rows.length - 1), r = rows[i];
  h += cardPager(sheetMarks(rows), i, 'sheet-go');
  if (!r.ex) return h + `<article class="sheet"><p class="muted">This exercise has been deleted.</p>${cardNav(i, rows.length, 'sheet-go')}</article>`;
  const e = r.ex, a = r.attempt;
  // 卡片右上角：改判下拉（不加标签，选中项即当前结果）与 Detail 按钮；对错另看作答的底色；题组材料在卡片下方
  const ov = a ? `<select id="pv-ov-${i}" class="compact ov-sel res-${esc(a.result)}" data-act-change="override" data-id="${esc(e.id)}" data-i="${e.allAttempts.indexOf(a)}" aria-label="Override the result">${['right', 'partial', 'wrong'].map(x => `<option value="${x}" ${a.result === x ? 'selected' : ''}>${RESULT[x].en}</option>`).join('')}</select>` : '';
  const top = ov + `<button type="button" class="btn ghost small" data-act="goto-ex" data-id="${esc(e.id)}">Detail</button>`;
  h += `<article class="sheet">${questionBody(e, { key: 'pv' + i, response: a ? a.response : '', locked: true, showCorrect: true, result: a ? a.result : '', right: top })}`;
  if (!a) h += `<p class="small muted">No answer to this question on this paper.</p>`;
  h += solutionBlock(e);
  h += cardNav(i, rows.length, 'sheet-go') + '</article>';
  if (e.setId) h += materialBlock(setById(e.setId), !!S.paperOpenSets[e.setId]);
  return h;
}

// 本组：默认归属人与我的默认归属人相同的用户（缺 settings 读成本人）
function groupOf(id) { return S.owners[id] || id; }

function coinInfo(id, today) { return coinsFor(S.exercises, S.matches, id, today || localToday()); }
const fmtP = v => String(Math.round(v * 10) / 10);
function renderGames() {
  const today = localToday(), c = coinInfo(S.me, today), from = weekStart(today), group = myGroup();
  const coinsBlock = `<section class="panel coins"><div class="coin-top"><p class="h2">My coins this week</p><span class="small muted">${fmtDate(from)} – ${fmtDate(today)}</span></div>

    <p class="small muted">Earned: ${c.right} right × 1 + ${c.up} ladder steps × 2 + ${c.mastered} mastered × 10.</p></section>`;
  // 这一局播完前，积分榜与历史先不算它，免得提前看到结果
  const shown = matchLive() && S.lift.id ? S.matches.filter(m => m.id !== S.lift.id) : S.matches;

function countUp(scope) {

  // 用定时器而不是 requestAnimationFrame：后者在不绘制的窗格里不触发
  const timer = setInterval(() => {
    if (!root.isConnected) { clearInterval(timer); return; }
    const f = Math.min(1, Math.max(0, (performance.now() - t0 - 200) / 1400)), e = f < .5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
    svgs.forEach(svg => liftPose(svg, e));
    els.forEach(el => { el.textContent = Math.round(Number(el.dataset.kg) * e) + ' kg'; });
    if (f >= 1) clearInterval(timer);

}
