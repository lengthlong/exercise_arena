<title>Sophia's Exercise Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Patrick+Hand&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: an exercise book — ruled paper, a red margin line on each question, ticks and crosses in a marking-pen hand; Sophia writes in fountain-pen blue. */
:root {
  --paper: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --ink: #1b2231;
  --muted: #5a6376;
  --rule: #e1e6ef;
  --line: #c8d0de;
  --pen: #2547a8;
  --pen-ink: #ffffff;
  --pen-soft: #e3e9fb;
  --red: #c42f27;
  --red-soft: #fbe6e4;
  --green: #1f7a4a;
  --green-soft: #e0f2e8;
  --amber: #a8690f;
  --amber-soft: #fbefd9;
  --hl: #ffe57a;
  --hl-ink: #1b2231;
  --font-body: "Lexend", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-hand: "Patrick Hand", "Lexend", "Noto Sans SC", cursive;
  --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Lexend", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141b; --surface: #191e28; --surface-2: #212734; --ink: #e5e9f1; --muted: #9ba4b6;
    --rule: #242b39; --line: #353e50; --pen: #8ea7ff; --pen-ink: #0e1220; --pen-soft: #232c4a;
    --red: #ff7b70; --red-soft: #3a1c1c; --green: #64d295; --green-soft: #15301f; --amber: #f0b862; --amber-soft: #36280f;
    --hl: #6b5a12; --hl-ink: #fff4c4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --surface: #191e28; --surface-2: #212734; --ink: #e5e9f1; --muted: #9ba4b6;
  --rule: #242b39; --line: #353e50; --pen: #8ea7ff; --pen-ink: #0e1220; --pen-soft: #232c4a;
  --red: #ff7b70; --red-soft: #3a1c1c; --green: #64d295; --green-soft: #15301f; --amber: #f0b862; --amber-soft: #36280f;
  --hl: #6b5a12; --hl-ink: #fff4c4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 15.5px/1.6 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
a { color: var(--pen); text-underline-offset: 2px; }
[lang="zh"], .zh { font-family: var(--font-zh); }
mark { background: var(--hl); color: var(--hl-ink); padding: 0 .15em; border-radius: 3px; }

.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 64px; display: grid; gap: 18px; }
@media (min-width: 720px) { .wrap { padding-inline: 28px; } }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: grid; gap: 0; }
.brand b { font: 600 20px/1.2 var(--font-body); letter-spacing: -.01em; text-wrap: balance; }
.brand span { font: 400 13px/1.4 var(--font-body); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font-zh); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--pen); font-weight: 500; }

/* generic */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.grow { flex: 1 1 auto; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.h2 { font: 600 17px/1.3 var(--font-body); margin: 0; text-wrap: balance; }
.h3 { font: 500 12px/1.4 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 14px; cursor: pointer; line-height: 1.3; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); font-weight: 500; }
.btn.danger { color: var(--red); border-color: var(--red); background: none; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; line-height: 1.3; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--rule); white-space: nowrap; }
.chip.s-english { color: var(--pen); }
.chip.s-math { color: var(--amber); }
.chip.s-science { color: var(--green); }
.chip.test { color: var(--red); border-color: var(--red); }
.note { font-size: 13.5px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.note.err { background: var(--red-soft); color: var(--red); }
.note.ok { background: var(--green-soft); color: var(--green); }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
label.f > span { font-family: var(--font-zh); }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 15px;
}
textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 12px; }
.num { font-variant-numeric: tabular-nums; }

/* home */
.hello { display: grid; gap: 4px; }
.hello .day { font: 400 13px var(--font-body); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.hello h1 { margin: 0; font: 600 clamp(24px, 4vw, 32px)/1.15 var(--font-body); letter-spacing: -.015em; text-wrap: balance; }
.today { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.today .big { font: 400 64px/1 var(--font-hand); color: var(--red); min-width: 1.4ch; text-align: center; }
.today .txt { display: grid; gap: 8px; min-width: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 600; }

/* question sheet */
.sheet { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 18px 30px; display: grid; gap: 12px; min-width: 0;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); background-position: 0 14px; }
.sheet::before { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 1.5px; background: var(--red); opacity: .55; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qno { font: 400 22px/1 var(--font-hand); color: var(--red); margin-right: 4px; }
.stem { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.65; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.imgs img { max-width: 100%; max-height: 420px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.imgs.thumbs img { max-height: 96px; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.opt .l { font: 600 14px/1.6 var(--font-body); color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt[aria-pressed="true"] .l { color: var(--pen); }
.opt.is-right { border-color: var(--green); background: var(--green-soft); }
.opt.is-wrong { border-color: var(--red); background: var(--red-soft); }
.answer-in { font-family: var(--font-hand); font-size: 20px; color: var(--pen); }
.mark { display: inline-flex; align-items: center; gap: 8px; font: 400 26px/1 var(--font-hand); }
.mark.right { color: var(--green); }
.mark.partial { color: var(--amber); }
.mark.wrong { color: var(--red); }
.solution { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.solution .ans { font-weight: 500; }
.solution .exp { white-space: pre-wrap; overflow-wrap: anywhere; }
.selfmark { display: flex; flex-wrap: wrap; gap: 8px; }
.selfmark button { font: 400 19px/1 var(--font-hand); padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.selfmark button[data-r="right"] { color: var(--green); border-color: var(--green); }
.selfmark button[data-r="partial"] { color: var(--amber); border-color: var(--amber); }
.selfmark button[data-r="wrong"] { color: var(--red); border-color: var(--red); }
.selfmark button[aria-pressed="true"][data-r="right"] { background: var(--green-soft); }
.selfmark button[aria-pressed="true"][data-r="partial"] { background: var(--amber-soft); }
.selfmark button[aria-pressed="true"][data-r="wrong"] { background: var(--red-soft); }
.progress { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pen); }
.score { font: 400 48px/1 var(--font-hand); color: var(--red); }

/* ladder dots */
.ladder { font-family: var(--font-body); letter-spacing: 1px; color: var(--pen); font-size: 12px; white-space: nowrap; }
.ladder.m { color: var(--green); letter-spacing: 0; }

/* parent lists */
.list { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 14px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.item .side { display: grid; justify-items: end; gap: 2px; font-size: 12.5px; color: var(--muted); }
.empty { padding: 22px 16px; text-align: left; color: var(--muted); display: grid; gap: 6px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl th { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.tbl select { padding: 4px 6px; font-size: 13px; width: auto; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); }
.checks input { margin: 0; }
.draft { border-left: 3px solid var(--pen); }
.setcard { border-left: 3px solid var(--amber); }
.material { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 10px 14px; display: grid; gap: 8px; min-width: 0; }
.material > summary { cursor: pointer; font-weight: 500; }
.material .stem { font-size: 15.5px; }
.member { margin-left: 14px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); }
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
/* LOGIC:BEGIN — 纯函数：复习阶梯、判对、每日清单、抽题（design/arena/README.md） */
const GAPS = [0, 1, 2, 4, 7];
function pad2(n) { return String(n).padStart(2, '0'); }
function localToday(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(iso, n) {
  const p = String(iso).split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}
function deriveState(createdAt, attempts) {
  let step = 1, due = addDays(createdAt, 1), mastered = false, wrongCount = 1, lastAttemptAt = null;
  for (const a of attempts || []) {
    lastAttemptAt = a.date;
    if (mastered) {
      if (a.result === 'wrong') { mastered = false; step = 1; due = addDays(a.date, 1); wrongCount++; }
      continue;
    }
    if (a.result === 'right') {
      if (step === 4) { mastered = true; due = null; }
      else { step++; due = addDays(a.date, GAPS[step]); }
    } else if (a.result === 'partial') {
      due = addDays(a.date, GAPS[step]);
    } else {
      step = 1; due = addDays(a.date, 1); wrongCount++;
    }
  }
  return { step, due, mastered, wrongCount, lastAttemptAt };
}
function normAnswer(s) {
  return String(s == null ? '' : s).toLowerCase().trim().replace(/\s+/g, ' ').replace(/\.$/, '').trim();
}
function asNumber(t) {
  const u = t.replace(/(\d),(?=\d{3}(\D|$))/g, '$1').replace(/\s/g, '');
  return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(u) ? Number(u) : null;
}
function matchShort(response, accepted) {
  const r = normAnswer(response);
  if (!r) return false;
  const rn = asNumber(r);
  return (accepted || []).some(a => {
    const n = normAnswer(a);
    if (!n) return false;
    if (n === r) return true;
    const an = asNumber(n);
    return rn !== null && an !== null && rn === an;
  });
}
function judgeAuto(ex, response) {
  if (ex.format === 'mcq') return String(response || '').trim().toUpperCase() === String(ex.answer || '').trim().toUpperCase() ? 'right' : 'wrong';
  if (ex.format === 'short') {
    const acc = ex.accepted && ex.accepted.length ? ex.accepted : [ex.answer];
    return matchShort(response, acc) ? 'right' : 'wrong';
  }
  return null;
}
function cmpSetPos(a, b) {
  return ((a.setPos || 0) - (b.setPos || 0)) || String(a.createdAt).localeCompare(String(b.createdAt)) || String(a.id).localeCompare(String(b.id));
}
function dailyList(exs, today, limit) {
  // 到期题合成单元：独立题各成一个，同一题组的到期题合成一个；单元按最早 due、再按最早 createdAt 排
  const due = exs.filter(e => !e.mastered && e.due && e.due <= today);
  const units = [], bySet = {};
  for (const e of due) {
    if (e.setId) {
      if (!bySet[e.setId]) { bySet[e.setId] = []; units.push(bySet[e.setId]); }
      bySet[e.setId].push(e);
    } else units.push([e]);
  }
  const key = u => ({
    due: u.reduce((m, e) => e.due < m ? e.due : m, u[0].due),
    c: u.reduce((m, e) => String(e.createdAt) < m ? String(e.createdAt) : m, String(u[0].createdAt))
  });
  const keyed = units.map(u => ({ u: u.slice().sort(cmpSetPos), k: key(u) }));
  keyed.sort((a, b) => a.k.due.localeCompare(b.k.due) || a.k.c.localeCompare(b.k.c));
  const out = [];
  const cap = Math.max(0, limit);
  for (const x of keyed) {
    if (!out.length) { if (cap) out.push(...x.u); continue; }
    if (out.length + x.u.length <= cap) out.push(...x.u);
  }
  return out;
}
function paperLayout(drawn) {
  // 按抽题顺序，遇到题组的第一道题时把同组抽中的题按 setPos 接在后面
  const out = [], seen = new Set();
  for (const e of drawn) {
    if (!e.setId) { out.push(e); continue; }
    if (seen.has(e.setId)) continue;
    seen.add(e.setId);
    out.push(...drawn.filter(x => x.setId === e.setId).sort(cmpSetPos));
  }
  return out;
}
function cmpLast(a, b) {
  const x = a.lastAttemptAt, y = b.lastAttemptAt;
  if (!x && !y) return 0;
  if (!x) return -1;
  if (!y) return 1;
  return x.localeCompare(y);
}
function drawPaper(exs, opt) {
  const topics = opt.topics || [];
  const c = exs.filter(e => e.subject === opt.subject && (!topics.length || topics.includes(e.topic)));
  c.sort((a, b) => (b.wrongCount - a.wrongCount) || ((b.mastered ? 1 : 0) - (a.mastered ? 1 : 0)) || cmpLast(a, b));
  return c.slice(0, Math.max(0, opt.count));
}
function tally(results) {
  const s = { right: 0, partial: 0, wrong: 0 };
  for (const r of results) if (s[r] != null) s[r]++;
  return s;
}
/* LOGIC:END */

<script>

const plain = s => String(s || '').replace(/\[\[(.+?)\]\]/g, '$1');

const subjChip = s => `<span class="chip s-${esc(s)}">${esc(SUBJ[s] ? SUBJ[s].en : s)}</span>`;
function mapLink(subject, id, label) {

const store = {

/* ---------- 状态 ---------- */
const S = {

function exById(id) { return S.exercises.find(e => e.id === id); }

function questionBody(e, opts) {

  const newDrafts = S.drafts.filter(d => !d.editId);
  if (newDrafts.length || S.setDrafts.length) {
    h += `<div class="row"><p class="h2 grow">草稿 ${newDrafts.length} 道${S.setDrafts.length ? `，题组 ${S.setDrafts.length} 个` : ''}</p><button type="button" class="btn primary" data-act="save-all">全部保存</button><button type="button" class="btn ghost" data-act="discard-all">全部放弃</button></div>`;
    for (const sd of S.setDrafts) {
      const members = newDrafts.filter(d => d.setRef === 'new:' + sd.key);
      h += setForm(sd, members.length);
      h += members.map(d => `<div class="member">${draftForm(d)}</div>`).join('');
    }
    h += newDrafts.filter(d => !S.setDrafts.some(sd => d.setRef === 'new:' + sd.key)).map(draftForm).join('');
  }
  return h;
}

function setForm(sd, nMembers) {
  const k = sd.key, edit = k === 'edit';
  const inp = (field, v, ph) => `<input type="text" id="s${k}-${field}" data-s="${k}" data-f="${field}" value="${esc(v)}" placeholder="${esc(ph || '')}">`;
  let h = `<section class="panel setcard" id="set-${k}">
    <div class="row"><p class="h3 grow">${edit ? '编辑题组' : (sd.savedId ? '题组（已保存）' : '题组草稿')}</p>${edit ? '' : `<button type="button" class="btn ghost small" data-act="add-to-set" data-s="${k}">加一道小题</button><button type="button" class="btn ghost small" data-act="drop-set" data-s="${k}">放弃题组</button>`}</div>
    <div class="grid2">
      ${edit ? `<div class="f small"><span class="muted">科目</span><div>${esc(SUBJ[sd.subject] ? SUBJ[sd.subject].zh : '')}</div></div>` : `<label class="f"><span>科目 *</span><select id="s${k}-subject" data-s="${k}" data-f="subject" data-rerender="1">${subjectOptions(sd.subject)}</select></label>`}
      <label class="f"><span>标题</span>${inp('title', sd.title, '例：School carnival flyer')}</label>

    </div>
    <label class="f"><span>材料文字（文章、传单或实验装置的文字）</span><textarea id="s${k}-text" data-s="${k}" data-f="text" rows="6">${esc(sd.text)}</textarea></label>`;
  if (sd.images.length) h += `<div class="imgs thumbs">${sd.images.map((id, i) => `<span style="display:grid;gap:4px;justify-items:start"><img src="${blobUrl(id)}" alt="材料照片 ${i + 1}"><button type="button" class="btn ghost small" data-act="drop-simg" data-s="${k}" data-i="${i}">去掉照片</button></span>`).join('')}</div>`;

}

function draftForm(d) {
  const s = d.subject, T = TAX[s];
  const k = d.key;
  const topics = T ? T.layers.map(l => {
    const ts = T.topics.filter(t => t[1] === l[0]);
    return ts.length ? `<optgroup label="${esc(l[1] + ' ' + l[2])}">${ts.map(t => `<option value="${t[0]}" ${d.topic === t[0] ? 'selected' : ''}>${esc(t[2] + ' · ' + t[3])}</option>`).join('')}</optgroup>` : '';
  }).join('') : '';
  const concepts = T ? T.concepts.filter(c => c[1] === d.topic).map(c => `<option value="${c[0]}" ${d.concept === c[0] ? 'selected' : ''}>${esc(c[2] + ' · ' + c[3])}</option>`).join('') : '';
  const qtypes = T ? T.qtypes.map(q => `<option value="${q[0]}" ${d.qtype === q[0] ? 'selected' : ''}>${esc(q[1] + ' · ' + q[2])}</option>`).join('') : '';
  const f = (name, label, html) => `<label class="f"><span>${label}</span>${html}</label>`;
  const inp = (field, v, ph) => `<input type="text" id="d${k}-${field}" data-d="${k}" data-f="${field}" value="${esc(v)}" placeholder="${esc(ph || '')}">`;
  const ta = (field, v, rows, ph) => `<textarea id="d${k}-${field}" data-d="${k}" data-f="${field}" rows="${rows}" placeholder="${esc(ph || '')}">${esc(v)}</textarea>`;
  let h = `<section class="panel draft" id="draft-${k}">
    <div class="row"><p class="h3 grow">${d.editId ? '编辑错题' : '草稿'}</p>${d.editId ? '' : `<button type="button" class="btn ghost small" data-act="drop-draft" data-k="${k}">放弃这道</button>`}</div>
    <div class="grid2">
      ${f('subject', '科目 *', `<select id="d${k}-subject" data-d="${k}" data-f="subject" data-rerender="1">${subjectOptions(s)}</select>`)}
      ${f('topic', '专题 *', `<select id="d${k}-topic" data-d="${k}" data-f="topic" data-rerender="1"><option value="">选专题</option>${topics}</select>`)}
      ${f('concept', '概念', `<select id="d${k}-concept" data-d="${k}" data-f="concept"><option value="">（不填）</option>${concepts}</select>`)}
      ${f('qtype', '题型', `<select id="d${k}-qtype" data-d="${k}" data-f="qtype"><option value="">（不填）</option>${qtypes}</select>`)}
      ${f('format', '作答形式', `<select id="d${k}-format" data-d="${k}" data-f="format" data-rerender="1">${FORMATS.map(x => `<option value="${x[0]}" ${d.format === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select>`)}
      ${f('cause', '错因', `<select id="d${k}-cause" data-d="${k}" data-f="cause">${CAUSES.map(c => `<option value="${c[0]}" ${d.cause === c[0] ? 'selected' : ''}>${c[1]}</option>`).join('')}</select>`)}
    </div>
    ${f('setRef', '所属题组', `<select id="d${k}-setRef" data-d="${k}" data-f="setRef" data-rerender="1"><option value="">无（独立的题）</option>${S.setDrafts.filter(sd => !sd.subject || !s || sd.subject === s).map(sd => `<option value="new:${sd.key}" ${d.setRef === 'new:' + sd.key ? 'selected' : ''}>本批新建：${esc(sd.title || '未命名题组')}</option>`).join('')}${(s ? liveSets(s) : []).map(x => `<option value="${esc(x.id)}" ${d.setRef === x.id ? 'selected' : ''}>${esc(x.title || '未命名题组')}</option>`).join('')}</select>`)}
    ${f('stem', d.setRef ? '题目文字（只写这一问，材料在题组里）' : '题目文字', ta('stem', d.stem, 4))}`;
  if (d.images.length) h += `<div class="imgs thumbs">${d.images.map((id, i) => `<span style="display:grid;gap:4px;justify-items:start"><img src="${blobUrl(id)}" alt="题目照片 ${i + 1}"><button type="button" class="btn ghost small" data-act="drop-img" data-k="${k}" data-i="${i}">去掉照片</button></span>`).join('')}</div>`;
  if (d.format === 'mcq') {
    h += `<div class="grid2">${d.options.map((o, i) => f('o' + i, `选项 (${i + 1})`, `<input type="text" id="d${k}-o${i}" data-d="${k}" data-f="opt" data-i="${i}" value="${esc(o)}">`)).join('')}</div>
      <div class="row"><button type="button" class="btn ghost small" data-act="add-opt" data-k="${k}">加一个选项</button>${d.options.length > 2 ? `<button type="button" class="btn ghost small" data-act="del-opt" data-k="${k}">去掉最后一个</button>` : ''}</div>
      <div class="grid2">${f('answer', '正确选项 *', `<select id="d${k}-answer" data-d="${k}" data-f="answer">${d.options.map((o, i) => `<option value="${LETTERS[i]}" ${String(d.answer).toUpperCase() === LETTERS[i] ? 'selected' : ''}>(${i + 1})</option>`).join('')}</select>`)}
      ${f('wrongAnswer', '她当时选的', inp('wrongAnswer', d.wrongAnswer, '例：(1)'))}</div>`;
  } else if (d.format === 'short') {
    h += `<div class="grid2">${f('answer', '正确答案 *', inp('answer', d.answer))}${f('accepted', '其他可接受答案（用 ; 分隔）', inp('accepted', d.accepted, '例：0.5; 1/2'))}${f('wrongAnswer', '她当时的答案', inp('wrongAnswer', d.wrongAnswer))}</div>`;
  } else {
    h += f('answer', '标准答法 *（得分关键词用 [[ ]] 括起来）', ta('answer', d.answer, 3, '例：Warmer [[water vapour]] in the surrounding air [[loses heat]] to the [[cooler surface]] and [[condenses]].'));
    h += f('wrongAnswer', '她当时的答案', ta('wrongAnswer', d.wrongAnswer, 2));
  }
  h += f('solution', '讲解（关键词用 [[ ]]）', ta('solution', d.solution, 3));
  h += `<div class="grid2">${f('source', '出处', inp('source', d.source, '例：2026 P5 SA2 卷二 Q7'))}</div>`;
  if (d.error) h += `<p class="note err">${esc(d.error)}</p>`;
  h += `<div class="row"><button type="button" class="btn primary" data-act="save-draft" data-k="${k}">${d.editId ? '保存修改' : '保存这道'}</button>${d.editId ? `<button type="button" class="btn ghost" data-act="cancel-edit" data-k="${k}">取消</button>` : ''}</div></section>`;
  return h;
}

function newDraft(x) {
  x = x || {};
  const subject = SUBJ[x.subject] ? x.subject : (S.recSubject || '');
  const topic = subject && nameOf(subject, 'topic', x.topic) ? x.topic : '';
  const concept = topic && nameOf(subject, 'concept', x.concept) && IDX[subject].concept[x.concept].topic === topic ? x.concept : '';
  const qtype = subject && nameOf(subject, 'qtype', x.qtype) ? x.qtype : '';
  const format = ['mcq', 'short', 'open'].includes(x.format) ? x.format : 'open';
  let options = Array.isArray(x.options) ? x.options.map(String) : [];
  if (format === 'mcq') while (options.length < 4) options.push('');
  return {
    key: draftSeq++, editId: x.editId || null, subject, topic, concept, qtype, format,
    stem: String(x.stem || ''), options: format === 'mcq' ? options : ['', '', '', ''],
    answer: String(x.answer || (format === 'mcq' ? 'A' : '')),
    accepted: Array.isArray(x.accepted) ? x.accepted.filter(a => normAnswer(a) !== normAnswer(x.answer)).join('; ') : String(x.accepted || ''),
    solution: String(x.solution || ''), wrongAnswer: String(x.wrongAnswer || ''),
    cause: CAUSE[x.cause] ? x.cause : 'concept', source: String(x.source || ''),
    images: Array.isArray(x.images) ? x.images.slice() : [], error: (x.topic && !topic) ? 'Claude 给的专题不在体系里，请选一个。' : '',
    setRef: x.setRef != null ? String(x.setRef) : String(x.setId || ''), origSetId: x.setId || null, setPos: x.setPos || null
  };
}

function draftToDoc(d) {
  const err = [];
  if (!SUBJ[d.subject]) err.push('科目');
  if (!d.topic) err.push('专题');
  const sd = setOfDraft(d);
  if (d.setRef && !sd) err.push('所属题组');
  if (sd && sd.subject && sd.subject !== d.subject) err.push('与题组相同的科目');
  const hasMat = sd && (String(sd.text || '').trim() || (sd.images || []).length);
  if (!d.stem.trim() && !d.images.length && !hasMat) err.push('题目文字或照片');
  const options = d.format === 'mcq' ? d.options.map(o => o.trim()) : [];
  if (d.format === 'mcq' && options.filter(Boolean).length < 2) err.push('至少两个选项');
  if (!String(d.answer).trim()) err.push('答案');
  if (err.length) return { error: '还缺：' + err.join('、') };
  const accepted = d.format === 'short' ? [d.answer.trim()].concat(d.accepted.split(';').map(a => a.trim()).filter(Boolean)) : [];
  return { doc: {
    subject: d.subject, topic: d.topic, concept: d.concept || null, qtype: d.qtype || null, format: d.format,
    stem: d.stem.trim(), images: d.images, options, answer: String(d.answer).trim(), accepted,
    solution: d.solution.trim(), wrongAnswer: d.wrongAnswer.trim(), cause: d.cause, source: d.source.trim()
  } };
}

function renderExercises() {
  const editing = S.drafts.find(d => d.editId);
  if (editing) return draftForm(editing);

  const F = S.filters, today = localToday();
  const list = S.exercises.filter(e => (!F.subject || e.subject === F.subject) && (!F.topic || e.topic === F.topic) && (!F.cause || e.cause === F.cause)
    && (!F.state || (F.state === 'mastered' ? e.mastered : F.state === 'due' ? (!e.mastered && e.due && e.due <= today) : !e.mastered)))
    .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)) || a.id.localeCompare(b.id));
  const topicOpts = F.subject ? TAX[F.subject].topics.map(t => `<option value="${t[0]}" ${F.topic === t[0] ? 'selected' : ''}>${esc(t[2])}</option>`).join('') : '';
  const byCause = CAUSES.map(c => [c[1], S.exercises.filter(e => e.cause === c[0] && (!F.subject || e.subject === F.subject)).length]);

      <label class="f"><span>科目</span><select id="flt-subject" data-filter="subject"><option value="">全部</option>${SUBJECTS.map(s => `<option value="${s[0]}" ${F.subject === s[0] ? 'selected' : ''}>${s[2]}</option>`).join('')}</select></label>
      <label class="f"><span>专题</span><select id="flt-topic" data-filter="topic" ${F.subject ? '' : 'disabled'}><option value="">全部</option>${topicOpts}</select></label>
      <label class="f"><span>错因</span><select id="flt-cause" data-filter="cause"><option value="">全部</option>${CAUSES.map(c => `<option value="${c[0]}" ${F.cause === c[0] ? 'selected' : ''}>${c[1]}</option>`).join('')}</select></label>
      <label class="f"><span>状态</span><select id="flt-state" data-filter="state"><option value="">全部</option><option value="learning" ${F.state === 'learning' ? 'selected' : ''}>在阶梯上</option><option value="due" ${F.state === 'due' ? 'selected' : ''}>今天到期</option><option value="mastered" ${F.state === 'mastered' ? 'selected' : ''}>已掌握</option></select></label>
    </div>
    <div class="stats">${byCause.map(c => `<span>${c[0]} <b class="num">${c[1]}</b></span>`).join('')}</div>
  </section>`;
  if (!S.exercises.length) return h + `<div class="list"><div class="empty"><b>还没有错题</b><span>到「录入」拍一张 Sophia 做错的题，或者在 Claude Code 对话里把题目发给 Claude。</span></div></div>`;
  h += `<div class="list">${list.length ? list.map(e => `
    <button type="button" class="item" data-act="detail" data-id="${esc(e.id)}">
      <span class="t">${esc(plain(e.stem) || (e.setId ? '（见题组材料）' : '（只有照片）'))}</span>
      <span class="side">${ladderHtml(e)}<span class="num">${e.mastered ? '' : '到期 ' + fmtDate(e.due)}</span></span>
      <span class="meta">${subjChip(e.subject)}<span>${esc(topicLabel(e.subject, e.topic, 'zh'))}</span><span>· ${esc(CAUSE[e.cause] ? CAUSE[e.cause].zh : '')}</span><span>· 错 ${e.wrongCount} 次</span>${setChip(e)}${e.test ? '<span class="chip test">TEST</span>' : ''}</span>
    </button>`).join('') : '<div class="empty">没有符合筛选的错题。</div>'}</div>`;
  return h;
}

  if (!papers.length) h += `<p class="small muted">还没有检验卷。组好的卷子会出现在 Sophia 那一侧，也可以下载打印。</p>`;
  else h += `<div class="list">${papers.map(p => `<div class="item" style="cursor:default">
      <span class="t">${esc(p.title)}</span>
      <span class="side">${p.status === 'done' && p.score ? `<span class="num">${p.score.right}/${p.exerciseIds.length}</span>` : '<span>未做</span>'}</span>
      <span class="meta">${subjChip(p.subject)}<span class="num">${esc(p.createdAt)}</span>${p.test ? '<span class="chip test">TEST</span>' : ''}
        ${S.downloads ? `<button type="button" class="btn ghost small" data-act="paper-print" data-id="${esc(p.id)}">下载打印版</button>` : ''}
        ${p.status === 'open' ? `<button type="button" class="btn ghost small" data-act="paper-entry" data-id="${esc(p.id)}">录入纸上结果</button>` : ''}
        ${S.confirmDel === p.id ? `<span class="confirm">删除这张卷？已写进阶梯的作答不受影响。<button type="button" class="btn danger" data-act="paper-delete" data-id="${esc(p.id)}">确认</button><button type="button" class="btn ghost" data-act="cancel-del">取消</button></span>` : `<button type="button" class="btn ghost small" data-act="ask-del" data-id="${esc(p.id)}">删除</button>`}
      </span></div>`).join('')}</div>`;
  return h + `</section>`;
}

function renderPaperEntry() {
  const E = S.paperEntry;
  const p = S.papers.find(x => x.id === E.paperId);
  if (!p) { S.paperEntry = null; return renderPapers(); }
  const exs = p.exerciseIds.map(exById).filter(Boolean);
  const pending = exs.filter(e => !E.results[e.id]).length;
  return `<div class="row"><button type="button" class="btn ghost" data-act="paper-entry-cancel">← 返回</button><p class="h2 grow">${esc(p.title)} · 录入纸上结果</p></div>
  ${exs.map((e, i) => `${(e.setId && (i === 0 || exs[i - 1].setId !== e.setId)) ? materialBlock(setById(e.setId), true) : ''}<article class="sheet">${questionBody(e, { key: 'e' + i, no: i + 1, locked: true })}${solutionBlock(e)}
    <div class="selfmark" role="group" aria-label="结果">${['right', 'partial', 'wrong'].map(r => `<button type="button" data-act="entry-mark" data-id="${esc(e.id)}" data-r="${r}" aria-pressed="${E.results[e.id] === r}">${RESULT[r].sym} ${RESULT[r].zh}</button>`).join('')}</div></article>`).join('')}
  <div class="row"><button type="button" class="btn primary" data-act="paper-entry-save" ${(pending || E.saving) ? 'disabled' : ''}>${E.saving ? '保存中…' : '保存结果'}</button><span class="small muted">${pending ? `还有 ${pending} 题没勾。` : '都勾好了。'}</span></div>
  ${E.err ? `<p class="note err">${esc(E.err)}</p>` : ''}`;
}

/* ---------- 写数据 ---------- */
async function writeAttempts(e, attempts) {
  const derived = deriveState(e.createdAt, attempts);
  await S.db.doc('exercises/' + e.id).update(Object.assign({ attempts }, derived));
}
async function addAttempt(e, a) { await writeAttempts(e, (e.attempts || []).concat([a])); }
function dbErr(err) {
  const c = err && err.code;
  if (c === 'quota_exceeded') return '数据库已满，删掉一些旧错题后再试。';
  if (c === 'invalid_argument') return '这个账号不能写入数据。';
  return '保存没有成功（' + (c || '未知错误') + '），请稍后再试。';
}

/* ---------- 事件 ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const R = S.run;
  try {
    switch (act) {
      case 'side': S.side = b.dataset.v; S.confirmDel = null; render(); break;
      case 'ptab': S.ptab = b.dataset.v; store.set('arena.ptab', S.ptab); S.detailId = null; S.confirmDel = null; render(); break;

      case 'start-daily': {
        const ids = dailyList(S.exercises, localToday(), S.settings.dailyLimit).map(e => e.id);
        S.run = { kind: 'daily', ids, i: 0, phase: 'answer', response: '', result: null, results: [] };
        render(); window.scrollTo(0, 0); break;
      }
      case 'pick':
        if (b.dataset.key === 'd') { R.response = b.dataset.v; }
        else { const i = Number(b.dataset.key.slice(1)); const p = S.papers.find(x => x.id === R.paperId); R.responses[p.exerciseIds[i]] = b.dataset.v; }
        render(); break;
      case 'check': {
        const e = exById(R.ids[R.i]);
        if (e.format !== 'open' && !String(R.response).trim()) { R.err = 'Write or pick an answer first.'; render(); break; }
        R.err = null; R.phase = 'review';
        if (e.format !== 'open') {
          R.result = judgeAuto(e, R.response);
          render();
          await addAttempt(e, { date: localToday(), mode: 'daily', paperId: null, response: String(R.response), result: R.result, judgedBy: 'auto' });
          R.results.push(R.result);
        } else render();
        break;
      }
      case 'selfmark': {
        const e = exById(R.ids[R.i]);
        R.result = b.dataset.r; render();
        await addAttempt(e, { date: localToday(), mode: 'daily', paperId: null, response: String(R.response), result: R.result, judgedBy: 'self' });
        R.results.push(R.result);
        break;
      }
      case 'next': R.i++; R.phase = 'answer'; R.response = ''; R.result = null; R.err = null; render(); window.scrollTo(0, 0); break;
      case 'exit-run': S.run = null; render(); break;

      case 'start-paper': S.run = { kind: 'paper', paperId: b.dataset.id, phase: 'answer', responses: {}, results: {} }; render(); window.scrollTo(0, 0); break;
      case 'paper-submit': {
        const p = S.papers.find(x => x.id === R.paperId);
        for (const id of p.exerciseIds) { const e = exById(id); if (e && e.format !== 'open') R.results[id] = judgeAuto(e, R.responses[id] || ''); }
        R.phase = 'review'; render(); window.scrollTo(0, 0); break;
      }
      case 'paper-self': R.results[b.dataset.id] = b.dataset.r; render(); break;
      case 'paper-finish': {
        // 每张卷每道题只写一次作答：保存中不再响应；卷子已出结果或该题已有本卷作答时跳过
        if (R.saving) break;
        const p = S.papers.find(x => x.id === R.paperId);
        if (p.status === 'done') { R.phase = 'done'; R.score = p.score || tally([]); render(); break; }
        R.saving = true; R.err = null; render();
        const today = localToday(), res = [];
        try {
          for (const id of p.exerciseIds) {
            const e = exById(id); if (!e) continue;
            const r = R.results[id]; res.push(r);
            if ((e.attempts || []).some(a => a.paperId === p.id)) continue;
            await addAttempt(e, { date: today, mode: 'paper', paperId: p.id, response: String(R.responses[id] || ''), result: r, judgedBy: e.format === 'open' ? 'self' : 'auto' });
          }
          const score = tally(res);
          await S.db.doc('papers/' + p.id).update({ status: 'done', score });
          R.phase = 'done'; R.score = score;
        } finally { R.saving = false; }
        render(); window.scrollTo(0, 0); break;
      }

      case 'recognise': await recognise(); break;
      case 'blank-draft': S.drafts.push(newDraft({ subject: S.recSubject })); render(); break;
      case 'drop-draft': S.drafts = S.drafts.filter(d => d.key !== Number(b.dataset.k)); render(); break;
      case 'discard-all': S.drafts = S.drafts.filter(d => d.editId); S.setDrafts = []; S.recMsg = null; render(); break;
      case 'new-set': { const sd = newSetDraft({ subject: S.recSubject }); S.setDrafts.push(sd); S.drafts.push(newDraft({ subject: sd.subject, setRef: 'new:' + sd.key })); render(); break; }
      case 'add-to-set': { const sd = setDraftByKey(b.dataset.s); S.drafts.push(newDraft({ subject: sd.subject, setRef: 'new:' + sd.key })); render(); break; }
      case 'drop-set': { const k = b.dataset.s; for (const d of S.drafts) if (d.setRef === 'new:' + k) d.setRef = ''; S.setDrafts = S.setDrafts.filter(x => x.key !== Number(k)); render(); break; }
      case 'drop-simg': { const sd = setDraftByKey(b.dataset.s); sd.images.splice(Number(b.dataset.i), 1); render(); break; }
      case 'edit-set': { const x = setById(b.dataset.id); S.setEdit = Object.assign(newSetDraft(x), { key: 'edit', id: x.id, createdAt: x.createdAt, test: x.test }); render(); break; }
      case 'cancel-set': S.setEdit = null; render(); break;
      case 'save-set': {
        const E = S.setEdit;
        if (!E.text.trim() && !E.images.length) { E.error = '材料文字或照片至少要有一项。'; render(); break; }
        const doc = { subject: E.subject, title: E.title.trim(), text: E.text.trim(), images: E.images, source: E.source.trim(), createdAt: E.createdAt || localToday() };
        if (E.test) doc.test = true;
        await S.db.doc('sets/' + E.id).set(doc);
        S.setEdit = null; render(); break;
      }
      case 'drop-img': { const d = draftByKey(b.dataset.k); d.images.splice(Number(b.dataset.i), 1); render(); break; }
      case 'add-opt': { const d = draftByKey(b.dataset.k); if (d.options.length < 6) d.options.push(''); render(); break; }
      case 'del-opt': { const d = draftByKey(b.dataset.k); if (d.options.length > 2) d.options.pop(); render(); break; }
      case 'save-draft': await saveDraft(draftByKey(b.dataset.k)); render(); break;
      case 'save-all': {
        let n = 0;
        for (const d of draftsInOrder()) { if (await saveDraft(d)) n++; }
        const left = S.drafts.filter(x => !x.editId).length;
        S.recMsg = { kind: left ? 'err' : 'ok', text: `已保存 ${n} 道。` + (left ? `还有 ${left} 道没填完，见下方提示。` : '') };
        render(); break;
      }
      case 'cancel-edit': S.drafts = S.drafts.filter(d => d.key !== Number(b.dataset.k)); render(); break;

      case 'detail': S.detailId = b.dataset.id; S.confirmDel = null; render(); window.scrollTo(0, 0); break;
      case 'back-list': S.detailId = null; S.confirmDel = null; render(); break;
      case 'edit': { const e = exById(b.dataset.id); S.drafts.push(newDraft(Object.assign({}, e, { editId: e.id }))); render(); window.scrollTo(0, 0); break; }
      case 'ask-del': S.confirmDel = b.dataset.id; render(); break;
      case 'cancel-del': S.confirmDel = null; render(); break;
      case 'delete-ex': { const e = exById(b.dataset.id); await S.db.doc('exercises/' + b.dataset.id).delete(); if (e && e.setId) await cleanupSet(e.setId, e.id); S.detailId = null; S.confirmDel = null; render(); break; }

      case 'paper-preview': {
        const P = S.paperForm;
        S.paperPreview = paperLayout(drawPaper(S.exercises, { subject: P.subject, topics: P.topics, count: Math.max(1, Math.min(50, Number(P.count) || 10)) }));
        S.paperMsg = null; render(); break;
      }
      case 'paper-create': {
        const P = S.paperForm, today = localToday();
        const tnames = P.topics.length ? P.topics.map(t => topicLabel(P.subject, t, 'en')).join(', ') : 'All topics';
        const doc = { title: `${SUBJ[P.subject].en} · ${tnames} · ${fmtDate(today)}`, createdAt: today, subject: P.subject, topics: P.topics.slice(), count: Number(P.count) || 10, exerciseIds: S.paperPreview.map(e => e.id), status: 'open', score: null };
        await S.db.collection('papers').doc().set(doc);
        S.paperPreview = null; S.paperMsg = { kind: 'ok', text: '检验卷已生成，Sophia 那一侧可以开始做了。' }; render(); break;
      }
      case 'paper-print': await printPaper(b.dataset.id); break;
      case 'paper-entry': S.paperEntry = { paperId: b.dataset.id, results: {} }; render(); window.scrollTo(0, 0); break;
      case 'paper-entry-cancel': S.paperEntry = null; render(); break;
      case 'entry-mark': S.paperEntry.results[b.dataset.id] = b.dataset.r; render(); break;
      case 'paper-entry-save': {
        const E = S.paperEntry, p = S.papers.find(x => x.id === E.paperId), today = localToday(), res = [];
        if (E.saving) break;
        if (p.status === 'done') { S.paperEntry = null; S.paperMsg = { kind: 'err', text: '这张卷已经有结果了，没有重复保存。' }; render(); break; }
        E.saving = true; E.err = null; render();
        try {
          for (const id of p.exerciseIds) {
            const e = exById(id); if (!e) continue;
            res.push(E.results[id]);
            if ((e.attempts || []).some(a => a.paperId === p.id)) continue;
            await addAttempt(e, { date: today, mode: 'paper', paperId: p.id, response: '', result: E.results[id], judgedBy: 'parent' });
          }
          await S.db.doc('papers/' + p.id).update({ status: 'done', score: tally(res) });
        } finally { E.saving = false; }
        S.paperEntry = null; S.paperMsg = { kind: 'ok', text: '纸上结果已保存，阶梯已更新。' }; render(); break;
      }
      case 'paper-delete': await S.db.doc('papers/' + b.dataset.id).delete(); S.confirmDel = null; render(); break;

      case 'save-settings': {
        const v = Math.max(1, Math.min(50, Number($('#set-limit').value) || 10));
        await S.db.doc('settings/main').set({ dailyLimit: v });
        S.settingsMsg = { kind: 'ok', text: `已保存：每日最多 ${v} 题。` }; render(); break;
      }
    }
  } catch (err) {
    const msg = dbErr(err);
    if (S.run) { S.run.err = msg; } else if (S.paperEntry) { S.paperEntry.err = msg; } else { S.recMsg = { kind: 'err', text: msg }; S.paperMsg = S.ptab === 'papers' ? { kind: 'err', text: msg } : S.paperMsg; }
    render();
  }
});

function draftByKey(k) { return S.drafts.find(d => d.key === Number(k)); }

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.ans != null && S.run) {
    const key = t.dataset.ans;
    if (key === 'd') S.run.response = t.value;
    else { const p = S.papers.find(x => x.id === S.run.paperId); S.run.responses[p.exerciseIds[Number(key.slice(1))]] = t.value; }
  } else if (t.dataset.d) {
    const d = draftByKey(t.dataset.d); if (!d) return;
    if (t.dataset.f === 'opt') d.options[Number(t.dataset.i)] = t.value; else if (!t.dataset.rerender) d[t.dataset.f] = t.value;
  } else if (t.dataset.s) {
    const sd = setDraftByKey(t.dataset.s); if (sd && !t.dataset.rerender) sd[t.dataset.f] = t.value;
  } else if (t.dataset.bind) {
    S[t.dataset.bind] = t.value;
  }
});

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'rec-files') { S.recFiles = Array.from(t.files || []); return; }
  if (t.dataset.d && t.dataset.rerender) {
    const d = draftByKey(t.dataset.d); if (!d) return;
    d[t.dataset.f] = t.value;
    if (t.dataset.f === 'subject') { d.topic = ''; d.concept = ''; d.qtype = ''; const sd = setOfDraft(d); if (sd && sd.subject && sd.subject !== d.subject) d.setRef = ''; }
    if (t.dataset.f === 'topic') d.concept = '';
    if (t.dataset.f === 'format') {
      if (t.value === 'mcq') { while (d.options.length < 4) d.options.push(''); if (!LETTERS.includes(String(d.answer).toUpperCase())) d.answer = 'A'; }
    }
    render(); return;
  }
  if (t.dataset.d) { const d = draftByKey(t.dataset.d); if (d && t.dataset.f !== 'opt') d[t.dataset.f] = t.value; return; }
  if (t.dataset.s) { const sd = setDraftByKey(t.dataset.s); if (sd) { sd[t.dataset.f] = t.value; if (t.dataset.rerender) render(); } return; }
  if (t.dataset.filter) { S.filters[t.dataset.filter] = t.value; if (t.dataset.filter === 'subject') S.filters.topic = ''; render(); return; }
  const act = t.dataset.actChange;
  try {
    if (act === 'paper-subject') { S.paperForm.subject = t.value; S.paperForm.topics = []; S.paperPreview = null; render(); }
    else if (act === 'paper-count') { S.paperForm.count = t.value; S.paperPreview = null; }
    else if (act === 'paper-topic') { const P = S.paperForm; P.topics = t.checked ? P.topics.concat([t.value]) : P.topics.filter(x => x !== t.value); S.paperPreview = null; render(); }
    else if (act === 'override') {
      const e = exById(t.dataset.id), i = Number(t.dataset.i);
      const attempts = e.attempts.map((a, j) => j === i ? Object.assign({}, a, { result: t.value, judgedBy: 'parent' }) : a);
      await writeAttempts(e, attempts);
    }
  } catch (err) { S.recMsg = { kind: 'err', text: dbErr(err) }; render(); }
});

/* ---------- 保存草稿 ---------- */
async function saveDraft(d) {
  const r = draftToDoc(d);
  if (r.error) { d.error = r.error; return false; }
  d.error = '';
  try {
    let setId = null;
    if (String(d.setRef).startsWith('new:')) {
      const sd = setOfDraft(d);
      if (!sd.savedId) {
        sd.subject = sd.subject || d.subject;
        if (!String(sd.text).trim() && !sd.images.length && !d.stem.trim()) { d.error = '题组还缺材料文字或照片。'; return false; }
        const ref = S.db.collection('sets').doc();
        await ref.set({ subject: sd.subject, title: sd.title.trim(), text: sd.text.trim(), images: sd.images, source: sd.source.trim(), createdAt: localToday() });
        sd.savedId = ref.id;
      }
      setId = sd.savedId;
    } else if (d.setRef) setId = d.setRef;
    const setPos = setId ? ((d.editId && d.origSetId === setId && d.setPos) ? d.setPos : nextPos(setId)) : null;
    Object.assign(r.doc, { setId, setPos });
    if (d.editId) {
      const old = exById(d.editId);
      const attempts = (old && old.attempts) || [];
      const createdAt = (old && old.createdAt) || localToday();
      const doc = Object.assign(r.doc, { createdAt, attempts }, deriveState(createdAt, attempts));
      if (old && old.test) doc.test = true;
      await S.db.doc('exercises/' + d.editId).set(doc);
      if (d.origSetId && d.origSetId !== setId) await cleanupSet(d.origSetId, d.editId);
    } else {
      const createdAt = localToday();
      await S.db.collection('exercises').doc().set(Object.assign(r.doc, { createdAt, attempts: [] }, deriveState(createdAt, [])));
    }
    S.drafts = S.drafts.filter(x => x !== d);
    S.setDrafts = S.setDrafts.filter(sd => !sd.savedId || S.drafts.some(x => x.setRef === 'new:' + sd.key));
    return true;
  } catch (err) { d.error = dbErr(err); return false; }
}

/* ---------- 识别 ---------- */
function taxonomyText(subjects) {
  return subjects.map(s => {
    const T = TAX[s];
    const lines = [`SUBJECT ${s}`, 'Topics (id: name) with their concepts:'];
    for (const t of T.topics) {
      const cs = T.concepts.filter(c => c[1] === t[0]).map(c => `${c[0]} ${c[3]}`).join('; ');
      lines.push(`- ${t[0]}: ${t[3]}${cs ? ' | concepts: ' + cs : ''}`);
    }
    lines.push('Question types: ' + T.qtypes.map(q => `${q[0]} ${q[2]}`).join('; '));
    return lines.join('\n');
  }).join('\n\n');
}
function recognisePrompt(subject, text, nImages) {
  const subs = subject ? [subject] : Object.keys(TAX);
  return `A parent in Singapore is recording questions that their daughter Sophia (Primary 5, PSLE next year) got wrong, so she can redo them later.
${nImages ? `The ${nImages} attached photo(s) show worksheet or exam questions.` : ''}${text ? `\nText from the parent:\n"""\n${text}\n"""` : ''}

Return one draft per question. Only draft the questions Sophia got wrong when that is visible (her written or marked answer is wrong, or the teacher marked it wrong); if you cannot tell which ones she got wrong, draft every question.
When several questions share one passage, picture, table or experiment set-up, put that material once in "sets" and point each of those questions at it with "set" (its index in "sets"); the stem of such a question holds only that question.
Subject: ${subject || 'decide from the content: "english", "math" or "science"'}.

Draft fields:
- subject: "english" | "math" | "science"
- topic: exactly one topic id from the list below for that subject
- concept: a concept id listed under that topic, or null
- qtype: a question-type id from that subject's list, or null
- format: "mcq" when numbered options are given; "short" when the answer is one word, number or short phrase; otherwise "open"
- stem: the question exactly as printed, keeping line breaks, numbers and units; for mcq leave the options out of the stem
- options: the option texts in order for mcq, else []
- answer: mcq → letter of the correct option ("A" = option 1, "B" = option 2, ...); short → the expected answer; open → a model answer a PSLE marker would accept
- accepted: short → every acceptable answer including answer (for example "0.5" and "1/2"), else []
- solution: a short explanation an 11-year-old can follow; wrap the words that earn marks in [[double brackets]]
- wrongAnswer: Sophia's own answer if it is visible (handwriting or a marked choice), else ""
- cause: your best guess of why she got it wrong: "concept" (did not understand the idea), "misread" (misread the question), "careless" (calculation or copying slip), "incomplete" (missing keywords or wrong format)
- source: the paper name and question number if visible, else ""
- set: index into "sets" when the question uses shared material, else null

Set fields: title (a short name, for example "School carnival flyer"), text (the material transcribed exactly; describe pictures briefly in [brackets]), source.
Use the teacher's correction as the answer when one is visible; otherwise solve the question carefully yourself.

Reply with only a JSON object: {"sets": [...], "drafts": [...]}. Use "sets": [] when nothing is shared.

${taxonomyText(subs)}`;
}
async function recognise() {
  const files = S.recFiles.slice();
  const text = S.recText.trim();
  if (!files.length && !text) { S.recMsg = { kind: 'err', text: '先选照片或贴题目文字。' }; render(); return; }
  S.recBusy = true; S.recMsg = { kind: '', text: files.length ? '正在上传照片…' : '正在识别…' }; render();
  const imageIds = [];
  let sendFiles = files;
  if (S.imgLimits && files.length > S.imgLimits.maxCount) sendFiles = files.slice(0, S.imgLimits.maxCount);
  const tooBig = S.imgLimits ? sendFiles.filter(f => f.size > S.imgLimits.maxInputBytes) : [];
  for (const f of files) {
    try { const a = await S.assets.upload(f); imageIds.push(a.id); }
    catch (err) { S.recMsg = { kind: 'err', text: `照片「${f.name}」上传失败（${err && err.code || '未知'}），其余照常。` }; }
  }
  S.recMsg = { kind: '', text: '正在识别，通常要半分钟左右…' }; render();
  let drafts = null, sets = [], fail = '';
  try {
    const okFiles = sendFiles.filter(f => !tooBig.includes(f));
    const out = await S.sample.json(recognisePrompt(S.recSubject, text, okFiles.length), okFiles.length ? { images: okFiles, modelTier: 'complex' } : { modelTier: 'complex' });
    if (Array.isArray(out)) drafts = out.filter(x => x && typeof x === 'object');
    else if (out && Array.isArray(out.drafts)) { drafts = out.drafts.filter(x => x && typeof x === 'object'); sets = Array.isArray(out.sets) ? out.sets.filter(x => x && typeof x === 'object') : []; }
    else fail = '识别没有成功：回来的内容不是题目清单。';
  } catch (err) {
    const c = err && err.code;
    fail = c === 'rate_limited' ? '识别太频繁了，请过一会儿再试。' : c === 'not_granted' ? '没有允许本页使用 Claude，识别不可用。' : c === 'invalid_json' ? '识别没有成功：回来的内容读不出来。' : `识别不可用（${c || '未知错误'}）。`;
  }
  S.recBusy = false;
  if (drafts && drafts.length) {
    const setKeys = sets.map((x, i) => {
      const member = drafts.find(dd => dd.set === i);
      const sd = newSetDraft(Object.assign({}, x, { subject: (member && member.subject) || S.recSubject, images: imageIds }));
      S.setDrafts.push(sd);
      return sd.key;
    });
    for (const x of drafts) {
      const si = Number.isInteger(x.set) && x.set >= 0 && x.set < setKeys.length ? x.set : null;
      S.drafts.push(newDraft(Object.assign({}, x, { images: setKeys.length ? [] : imageIds, setRef: si === null ? '' : 'new:' + setKeys[si] })));
    }
    S.recMsg = { kind: 'ok', text: (setKeys.length ? `拆出 ${setKeys.length} 个题组、` : '拆出 ') + `${drafts.length} 道草稿。请逐条核对后保存，答案是 Claude 读出或解出的。` + (files.length > sendFiles.length ? ` 只识别了前 ${sendFiles.length} 张照片。` : '') };
    S.recText = ''; S.recFiles = [];
  } else {
    S.drafts.push(newDraft({ subject: S.recSubject, stem: text, images: imageIds }));
    S.recMsg = { kind: 'err', text: (fail || '没有识别出题目。') + ' 已给出一份空白草稿，照片已挂上，请手填。' };
  }
  render();
}

/* ---------- 打印版 ---------- */
async function blobToDataUrl(id) {
  try {
    const r = await fetch(blobUrl(id)); if (!r.ok) return null;
    const b = await r.blob();
    return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(b); });
  } catch (e) { return null; }
}
async function printPaper(id) {
  const p = S.papers.find(x => x.id === id);
  const exs = p.exerciseIds.map(exById).filter(Boolean);
  const imgs = {};
  const setIds = [...new Set(exs.map(e => e.setId).filter(Boolean))];
  for (const e of exs) for (const i of e.images || []) if (!(i in imgs)) imgs[i] = await blobToDataUrl(i);
  for (const sid of setIds) { const x = setById(sid); for (const i of (x && x.images) || []) if (!(i in imgs)) imgs[i] = await blobToDataUrl(i); }
  const mat = x => x ? `<div class="mat"><div class="mt">${esc(x.title || '')}</div>${x.text ? `<div class="stem">${esc(x.text)}</div>` : ''}${(x.images || []).map(i => imgs[i] ? `<img src="${imgs[i]}" alt="">` : `<p class="miss">（照片见练习场页面）</p>`).join('')}</div>` : '';
  const q = (e, n) => {
    let h = `<div class="q"><div class="n">${n}.</div><div>`;
    if (e.stem) h += `<div class="stem">${esc(e.stem)}</div>`;
    for (const i of e.images || []) h += imgs[i] ? `<img src="${imgs[i]}" alt="">` : `<p class="miss">（照片见练习场页面）</p>`;
    if (e.format === 'mcq') h += `<ol class="opts">${e.options.map(o => `<li>${esc(o)}</li>`).join('')}</ol><p class="ansline">Answer: (&nbsp;&nbsp;&nbsp;&nbsp;)</p>`;
    else if (e.format === 'short') h += `<p class="ansline">Answer: ____________________</p>`;
    else h += `<div class="lines"></div>`;
    return h + '</div></div>';
  };
  const key = (e, n) => {
    let a = e.answer;
    if (e.format === 'mcq') { const i = LETTERS.indexOf(String(e.answer).toUpperCase()); a = `(${i + 1}) ${e.options[i] || ''}`; }
    return `<div class="k"><b>${n}.</b> ${hl(a)}${e.solution ? `<div class="why">${hl(e.solution)}</div>` : ''}</div>`;
  };
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(p.title)}</title><style>
body{font:15px/1.6 Georgia,"Noto Serif SC","Songti SC",serif;color:#111;max-width:720px;margin:24px auto;padding:0 16px}
h1{font-size:20px;margin:0 0 4px}.meta{color:#555;font-size:13px;margin-bottom:18px;border-bottom:1px solid #999;padding-bottom:8px}
.q{display:grid;grid-template-columns:28px 1fr;gap:6px;margin:0 0 22px;break-inside:avoid}.n{font-weight:bold}.stem{white-space:pre-wrap}
img{max-width:100%;max-height:340px;display:block;margin:6px 0}.opts{margin:6px 0;padding-left:24px}.opts li{list-style:decimal}
.ansline{margin:8px 0 0}.lines{height:96px;background:repeating-linear-gradient(transparent 0 31px,#bbb 31px 32px)}
.miss{color:#a00;font-size:13px}.mat{border:1px solid #999;padding:10px 12px;margin:0 0 14px}.mt{font-weight:bold}.key{break-before:page}.k{margin:0 0 12px}.why{color:#444;font-size:14px;white-space:pre-wrap}
mark{background:#ffe57a}@media print{body{margin:0 auto}}
</style></head><body>
<h1>${esc(p.title)}</h1><div class="meta">Name: Sophia &nbsp;&nbsp; Date: ____________ &nbsp;&nbsp; Score: ____ / ${exs.length}</div>
${exs.map((e, i) => ((e.setId && (i === 0 || exs[i - 1].setId !== e.setId)) ? mat(setById(e.setId)) : '') + q(e, i + 1)).join('')}
<section class="key"><h1>Answers</h1><div class="meta">${esc(p.title)}</div>${exs.map((e, i) => key(e, i + 1)).join('')}</section>
</body></html>`;
  try {
    await S.downloads.save({ filename: `check-paper-${p.createdAt}-${p.subject}.html`, data: html });
    S.paperMsg = { kind: 'ok', text: '已交给浏览器保存。用浏览器打开这个文件即可打印；答案在最后一页。' };
  } catch (err) {
    S.paperMsg = err && err.code === 'cancelled' ? null : { kind: 'err', text: `下载没有成功（${err && err.code || '未知'}）。` };
  }
  render();
}

/* ---------- 启动 ---------- */
async function boot() {
  render();
  if (!window.claude || !window.claude.use) { S.status = 'nodb'; render(); return; }
  const use = n => window.claude.use(n).catch(() => null);
  const [db, assets, sample, downloads] = await Promise.all([use('db'), use('assets'), use('sample'), use('downloads')]);
  if (!db) { S.status = 'nodb'; render(); return; }
  Object.assign(S, { db, assets, sample, downloads });
  if (sample && sample.limits) { try { const l = await sample.limits(); S.imgLimits = l && l.images ? l.images : null; } catch (e) { S.imgLimits = null; } }
  let got = 0;
  const ready = () => { if (++got >= 3 && S.status === 'loading') { S.status = 'ready'; render(); } else softRender(); };
  const fail = () => { S.status = 'nodb'; render(); };
  db.collection('exercises').onSnapshot(snap => {
    S.exercises = snap.docs.map(d => Object.assign({ id: d.id, attempts: [] }, d.data()));
    ready();
  }, fail);
  db.collection('papers').onSnapshot(snap => {
    S.papers = snap.docs.map(d => Object.assign({ id: d.id, exerciseIds: [] }, d.data()));
    ready();
  }, fail);
  db.collection('sets').onSnapshot(snap => {
    S.sets = snap.docs.map(d => Object.assign({ id: d.id, images: [] }, d.data()));
    ready();
  }, fail);
  db.doc('settings/main').onSnapshot(snap => {
    const v = snap.exists ? snap.data() : null;
    S.settings = { dailyLimit: v && v.dailyLimit ? v.dailyLimit : 10 };
    softRender();
  }, () => {});
}
boot();
</script>
