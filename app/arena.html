<style>
/* Layout: an exercise book — ruled paper, a red margin line on each question, ticks and crosses in a marking-pen hand; Sophia writes in fountain-pen blue. */
:root {
  --paper: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #eef1f7;

  --red: #c42f27;
  --red-soft: #fbe6e4;
  --green: #1f7a4a;
  --green-soft: #e0f2e8;
  --amber: #a8690f;
  --amber-soft: #fbefd9;
  --hl: #ffe57a;
  --hl-ink: #1b2231;
  --c-right: #1f7a4a;
  --c-partial: #d69e1a;
  --c-wrong: #b3261e;

}

    --rule: #242b39; --line: #353e50; --pen: #8ea7ff; --pen-ink: #0e1220; --pen-soft: #232c4a;
    --red: #ff7b70; --red-soft: #3a1c1c; --green: #64d295; --green-soft: #15301f; --amber: #f0b862; --amber-soft: #36280f;
    --hl: #6b5a12; --hl-ink: #fff4c4; --c-right: #1f9a80; --c-partial: #bb891c; --c-wrong: #de4b74;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --surface: #191e28; --surface-2: #212734; --ink: #e5e9f1; --muted: #9ba4b6;
  --rule: #242b39; --line: #353e50; --pen: #8ea7ff; --pen-ink: #0e1220; --pen-soft: #232c4a;
  --red: #ff7b70; --red-soft: #3a1c1c; --green: #64d295; --green-soft: #15301f; --amber: #f0b862; --amber-soft: #36280f;
  --hl: #6b5a12; --hl-ink: #fff4c4; --c-right: #1f9a80; --c-partial: #bb891c; --c-wrong: #de4b74;

}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 15.5px/1.6 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }

mark { background: var(--hl); color: var(--hl-ink); padding: 0 .15em; border-radius: 3px; }

.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 64px; display: grid; gap: 18px; }

/* tab bar: first line of the page, sticks to the top */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--muted); }

.tabs { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); background: var(--paper); margin-top: -18px; padding-top: 6px; }
.tabs button { border: 0; background: none; padding: 8px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
@media (max-width: 480px) { .tabs button { padding: 8px 6px; font-size: 14px; } }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--pen); font-weight: 500; }

/* generic */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.grow { flex: 1 1 auto; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); font-weight: 500; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; line-height: 1.3; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--rule); white-space: nowrap; }

.chip.s-math { color: var(--amber); }
.chip.s-science { color: var(--green); }

.note { font-size: 13.5px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.note.err { background: var(--red-soft); color: var(--red); }
.note.ok { background: var(--green-soft); color: var(--green); }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 15px;
}
textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 12px; }

/* home */
.hello { display: grid; gap: 2px; }
.hello-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.hello-top h1 { margin: 0; min-width: 0; font: 600 clamp(22px, 4vw, 28px)/1.15 var(--font-body); letter-spacing: -.015em; }
.hello .day { flex: none; font: 400 13px var(--font-body); color: var(--muted); }

.hello-meta { margin: 0; font-size: 13px; color: var(--muted); }

.hello-meta .star { color: var(--amber); white-space: nowrap; }
.today { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.today .big { font: 400 64px/1 var(--font-hand); color: var(--red); min-width: 1.4ch; text-align: center; }
.today .txt { display: grid; gap: 8px; min-width: 0; }
.today .big .of { font-size: .45em; color: var(--muted); }
.today .done-tag { display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--green); line-height: 1.3; }
.today-papers { grid-column: 1 / -1; display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
.plan .sub, .review .sub { display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 12px; }
.days7 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.days7 li { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.days7 .d { font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: clip; white-space: nowrap; }
@media (max-width: 480px) { .days7 { gap: 4px; } .days7 .d { font-size: 11px; letter-spacing: -.02em; } }
.days7 .n { font: 400 24px/1 var(--font-hand); color: var(--pen); }
.days7 li.zero .n { color: var(--muted); }
.days7 li.is-today { border-color: var(--pen); background: var(--pen-soft); }
.days7 li.is-today .d { color: var(--pen); font-weight: 600; }
.checklist, .tips, .mastered { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14.5px; }
.checklist li, .mastered li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tick { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); color: var(--muted); font-size: 12px; flex: none; }

.stats b { color: var(--ink); font-weight: 600; }

/* question sheet */
.sheet { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 18px 30px; display: grid; gap: 12px; min-width: 0;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); background-position: 0 14px; }
.sheet::before { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 1.5px; background: var(--red); opacity: .55; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qno { font: 400 22px/1 var(--font-hand); color: var(--red); margin-right: 4px; }
.stem { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.65; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; }

.imgs.thumbs img { max-height: 96px; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.opt .l { font: 600 14px/1.6 var(--font-body); color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }

.opt.is-right { border-color: var(--green); background: var(--green-soft); }
.opt.is-wrong { border-color: var(--red); background: var(--red-soft); }
.answer-in { font-family: var(--font-hand); font-size: 20px; color: var(--pen); }
.mark { display: inline-flex; align-items: center; gap: 8px; font: 400 26px/1 var(--font-hand); }
.mark.right { color: var(--green); }
.mark.partial { color: var(--amber); }
.mark.wrong { color: var(--red); }
.solution { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.solution .ans { font-weight: 500; }
.solution .exp { white-space: pre-wrap; overflow-wrap: anywhere; }
.selfmark { display: flex; flex-wrap: wrap; gap: 8px; }
.selfmark button { font: 400 19px/1 var(--font-hand); padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.selfmark button[data-r="right"] { color: var(--green); border-color: var(--green); }
.selfmark button[data-r="partial"] { color: var(--amber); border-color: var(--amber); }
.selfmark button[data-r="wrong"] { color: var(--red); border-color: var(--red); }
.selfmark button[aria-pressed="true"][data-r="right"] { background: var(--green-soft); }
.selfmark button[aria-pressed="true"][data-r="partial"] { background: var(--amber-soft); }
.selfmark button[aria-pressed="true"][data-r="wrong"] { background: var(--red-soft); }
.progress { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pen); }
.score { font: 400 48px/1 var(--font-hand); color: var(--red); }

/* ladder dots */
.ladder { font-family: var(--font-body); letter-spacing: 1px; color: var(--pen); font-size: 12px; white-space: nowrap; }
.ladder.m { color: var(--green); letter-spacing: 0; }

/* parent lists */
.list { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 14px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.item .side { display: grid; justify-items: end; gap: 2px; font-size: 12.5px; color: var(--muted); }
.empty { padding: 22px 16px; text-align: left; color: var(--muted); display: grid; gap: 6px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }

.tbl select { padding: 4px 6px; font-size: 13px; width: auto; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); }
.checks input { margin: 0; }
.draft { border-left: 3px solid var(--pen); }
.bank { display: flex; flex-wrap: wrap; gap: 6px; }
details.photos > summary { cursor: pointer; font-size: 13px; color: var(--pen); width: fit-content; }
details.photos[open] > summary { margin-bottom: 6px; }
.why { display: grid; gap: 8px; }
.why-sec { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.why-sec.watch { border-left-color: var(--amber); }
.why-h { font: 600 12px/1.4 var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.why p, .exp p { margin: 2px 0; }
.why ol, .why ul { margin: 2px 0; padding-left: 20px; }
.pager { justify-content: center; }
.cheer-msg { margin: 0; font: 400 24px/1.25 var(--font-hand); color: var(--pen); text-wrap: balance; }
.dash { gap: 18px; }
.dash-block { display: grid; gap: 6px; min-width: 0; }
.meter { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; max-width: 440px; height: auto; display: block; }
.chart .ch-val { font: 500 11px var(--font-body); fill: var(--muted); }
.chart .ch-x { font: 400 11px var(--font-body); fill: var(--muted); }

.ladder-bars { display: grid; gap: 6px; }
.lb-row { display: grid; grid-template-columns: 124px minmax(0, 1fr) 32px; gap: 8px; align-items: center; font-size: 13px; }
.lb-k { color: var(--muted); white-space: nowrap; }
.lb-bar { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }

.pager button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tabs button:disabled { opacity: .4; cursor: not-allowed; }
.opt.word { grid-template-columns: auto; padding: 6px 12px; }
.stem u { text-decoration-thickness: 1.5px; text-underline-offset: 3px; }

.member { margin-left: 14px; }
/* 录入：照片大按钮、缩略图、科目与 AI识别 一行 */
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

<script>
/* LOGIC:BEGIN — 纯函数：按用户的视图与归属人、复习阶梯、判对、每日清单、抽题、看板、计划与回顾、设置（断言见 app/logic.test.js） */
const GAPS = [0, 1, 2, 4, 7];
const SUBJECTS = [['english', 'English'], ['math', 'Math'], ['science', 'Science']];
const SUBJ = Object.fromEntries(SUBJECTS.map(s => [s[0], { en: s[1] }]));
function pad2(n) { return String(n).padStart(2, '0'); }
function localToday(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(iso, n) {
  const p = String(iso).split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}
function deriveState(createdAt, attempts) {
  let step = 1, due = addDays(createdAt, 1), mastered = false, wrongCount = 1, lastAttemptAt = null;
  for (const a of attempts || []) {
    lastAttemptAt = a.date;
    if (mastered) {
      if (a.result === 'wrong') { mastered = false; step = 1; due = addDays(a.date, 1); wrongCount++; }
      continue;
    }
    if (a.result === 'right') {
      if (step === 4) { mastered = true; due = null; }
      else { step++; due = addDays(a.date, GAPS[step]); }
    } else if (a.result === 'partial') {
      due = addDays(a.date, GAPS[step]);
    } else {
      step = 1; due = addDays(a.date, 1); wrongCount++;
    }
  }
  return { step, due, mastered, wrongCount, lastAttemptAt };
}
function ladderInput(attempts) {
  // 推阶梯用的作答：每日重做的全部作答，加检验卷上做错的；检验卷上做对、部分对不改阶梯
  return (attempts || []).filter(a => a.mode !== 'paper' || a.result === 'wrong');

  const open = todo.filter(e => !e.mastered && e.due);
  return Array.from({ length: 7 }, (_, i) => {
    const date = addDays(today, i);
    return { date, count: i === 0 ? todayCounts(todo, today, dueNowIds(todo, today)).total.all : open.filter(e => e.due === date).length };
  });
}
function weekStart(today) {

  const p = String(today).split('-').map(Number);
  const dow = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
  return addDays(today, -((dow + 6) % 7));
}
function goalProgress(exs, papers, from, to, uid) {
  // exs 是我的视图：区间内有作答的天数、我在区间内交过的检验卷张数（每日卷不算）
  const days = new Set();
  for (const e of exs) for (const a of e.attempts || []) if (a.date >= from && a.date <= to) days.add(a.date);
  const done = papers.filter(p => { if (isDaily(p)) return false; const t = handedInAt(p, exs, uid); return t && t.slice(0, 10) >= from && t.slice(0, 10) <= to; }).length;
  return { days: days.size, papers: done };
}
function weekReview(todo, done, papers, today, uid) {
  // 最近 7 天（含今天）；过期与第 4 级的题数按 todo（默认归属人的错题），其余按 done（我的全部错题）
  const exs = done;

  for (const e of exs) {
    let hit = false, step = 1, mastered = false;
    for (const a of e.attempts || []) {
      const inW = a.date >= from && a.date <= today;
      if (inW) {
        hit = true;
        if (ans[a.result] != null) { ans[a.result]++; days[idx[a.date]][a.result]++; }
        if (a.result === 'wrong') { const k = e.subject + '|' + e.topic; wrongBy[k] = (wrongBy[k] || 0) + 1; }
      }
      // 与 deriveState 同一套逐次规则，数作答时尚未掌握、做对而升级的题；只看阶梯输入（检验卷上做对、部分对不算）
      if (!ladderInput([a]).length) continue;
      if (mastered) { if (a.result === 'wrong') { mastered = false; step = 1; } continue; }
      if (a.result === 'right') { if (inW) moved.add(e.id); if (step === 4) mastered = true; else step++; }
      else if (a.result !== 'partial') step = 1;
    }
    if (hit) questions++;
  }
  const top = Object.entries(wrongBy).sort((a, b) => b[1] - a[1] || a[0].split('|')[1].localeCompare(b[0].split('|')[1]))[0];
  const groups = {};
  for (const e of exs) {
    const m = e.mastered && masteredOn(e);
    if (!m || m < from || m > today) continue;
    const kind = e.concept ? 'concept' : 'topic', id = e.concept || e.topic, k = e.subject + '|' + kind + '|' + id;
    (groups[k] = groups[k] || { subject: e.subject, kind, id, n: 0 }).n++;
  }
  const newlyMastered = Object.values(groups).sort((a, b) => b.n - a.n || String(a.id).localeCompare(String(b.id)));
  let fallback = '';
  if (!newlyMastered.length) {
    const s4 = todo.filter(e => !e.mastered && e.step === 4).length;
    if (s4) fallback = `Almost there: ${s4} question${s4 === 1 ? ' is' : 's are'} waiting for the 4th redo.`;
    else if (moved.size) fallback = `${moved.size} question${moved.size === 1 ? '' : 's'} moved up the ladder in the last 7 days.`;
  }
  const g = goalProgress(exs, papers, from, today, uid);
  return {
    from, questions, answers: ans.right + ans.partial + ans.wrong, right: ans.right, partial: ans.partial, wrong: ans.wrong,
    practised: g.days, papersDone: g.papers, days, newlyMastered, fallback,
    overdue: todo.filter(e => !e.mastered && e.due && e.due < today).length,
    topWrong: top ? { subject: top[0].split('|')[0], topic: top[0].split('|')[1], n: top[1] } : null
  };
}
function goalChecks(week, settings) {
  // 三行对比；每周检验卷目标为 0 时不出检验卷行
  const rows = [{ key: 'days', value: week.practised, goal: settings.practiceDays, ok: week.practised >= settings.practiceDays }];
  if (settings.papersPerWeek > 0) rows.push({ key: 'papers', value: week.papersDone, goal: settings.papersPerWeek, ok: week.papersDone >= settings.papersPerWeek });
  rows.push({ key: 'overdue', value: week.overdue, ok: week.overdue === 0 });
  return rows;
}
function weekTips(week, checks, settings, topicName) {
  // 建议跟着对比行走，按序取成立的，最多 3 条；三行都达到且没有别的建议时说 Great week
  const name = topicName || (t => t.topic);
  const unmet = k => checks.some(c => c.key === k && !c.ok);
  const are = n => n === 1 ? '1 question is' : `${n} questions are`;
  const tips = [];
  if (week.overdue > 0) tips.push(`${are(week.overdue)} overdue — do ${week.overdue === 1 ? 'it' : 'them'} first.`);
  if (unmet('days')) tips.push(`Little and often: aim for ${settings.practiceDays} days a week — you practised on ${week.practised} of the last 7.`);
  if (unmet('papers')) tips.push(week.topWrong ? `Make a check paper on ${name(week.topWrong)}.` : 'Make a check paper on mixed topics.');
  if (week.topWrong && week.topWrong.n >= 3) tips.push(`Read the Key idea again for ${name(week.topWrong)} before you redo it.`);
  if (!tips.length && checks.every(c => c.ok)) tips.push('Great week — keep the same rhythm!');
  return tips.slice(0, 3);
}

      <p class="muted small">${!todo.length ? `No questions for ${esc(userName(S.settings.defaultOwner))} yet — choose a default owner in Settings.` : n ? whatsLeft : !next ? 'Everything here is mastered.' : tc.total.done ? `Next redo: ${wd(next)} ${fmtDate(next)}.` : `Next redo comes up on ${fmtDate(next)}.`}</p>
      ${tc.total.all ? `<div class="row">${redo.map(b => `<button type="button" class="btn primary" data-act="start-daily" data-subject="${b.subject}">${esc(SUBJ[b.subject].en)} · ${frac(subjC[b.subject])}</button>`).join('')}${tc.bySubject.filter(([s]) => !redo.some(b => b.subject === s)).map(([s, c]) => `<span class="done-tag">✓ ${esc(SUBJ[s].en)} · ${frac(c)}</span>`).join('')}</div>` : ''}
    </div>`;
  if (cps.length) {
    // 没交的是按钮，点了开始做；今天交的只显示进度与得分，不能点
    h += `<div class="today-papers"><p class="h3">Check papers</p><div class="list">${cps.map(p => {
      const pr = paperProgress(p, view), handed = handedInAt(p, view, S.me);
      const side = `<span class="side"><span class="num">${pr.done}/${pr.total}${handed ? ` · ${paperScore(p, view).right} right` : ''}</span></span>`;
      const body = `<span class="t">${esc(p.title)}</span>${side}<span class="meta">${subjChip(p.subject)}<span>set ${fmtDate(p.createdAt)}</span></span>`;
      return handed ? `<div class="item" style="cursor:default">${body}</div>` : `<button type="button" class="item" data-act="start-paper" data-id="${esc(p.id)}">${body}</button>`;
    }).join('')}</div></div>`;
  }
  return h + `</section>`;
}

/* 计划：未来 7 天每天到期的题数、本周目标与建议 */
function planBlock(days, today, done, week, checks) {
  const st = S.settings, ws = weekStart(today);
  const g = goalProgress(done, S.papers, ws, addDays(ws, 6), S.me);
  const goals = [`<li>${tick(g.days >= st.practiceDays)}<span>Practise on ${st.practiceDays} days: <b class="num">${g.days}/${st.practiceDays}</b></span></li>`];
  if (st.papersPerWeek > 0) goals.push(`<li>${tick(g.papers >= st.papersPerWeek)}<span>Check papers: <b class="num">${g.papers}/${st.papersPerWeek}</b></span></li>`);
  return `<section class="panel plan" aria-label="Next 7 days">
    <p class="h3">Next 7 days</p>
    <ol class="days7">${days.map((x, i) => `<li class="${i === 0 ? 'is-today' : ''}${x.count ? '' : ' zero'}" title="${fmtDate(x.date)}: ${plural(x.count, 'question')}"><span class="d">${i === 0 ? 'Today' : wd(x.date)}</span><span class="n num">${x.count}</span></li>`).join('')}</ol>
    <div class="sub"><p class="h3">This week</p><ul class="checklist">${goals.join('')}</ul></div>
    <div class="sub"><p class="h3">Tips</p><ul class="tips">${weekTips(week, checks, st, t => topicLabel(t.subject, t.topic, 'en')).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
  </section>`;
}

/* 回顾：最近 7 天 */
function reviewBlock(week, checks) {
  const label = g => {
    if (g.kind === 'concept') { const c = nameOf(g.subject, 'concept', g.id); return mapLink(g.subject, g.id, c ? c.en : g.id); }
    return esc(topicLabel(g.subject, g.id, 'en'));
  };
  const row = c => c.key === 'days' ? `Practised on ${c.value} of 7 days · goal ${c.goal}`
    : c.key === 'papers' ? `Check papers: ${c.value} · goal ${c.goal}`
    : c.ok ? 'Caught up' : `${c.value} question${c.value === 1 ? ' is' : 's are'} overdue`;
  let mastered = '';
  if (week.newlyMastered.length) mastered = `<ul class="mastered">${week.newlyMastered.map(g => `<li>${subjChip(g.subject)}<span>${label(g)}</span>${g.n > 1 ? `<span class="muted num">×${g.n}</span>` : ''}</li>`).join('')}</ul>`;
  else if (week.fallback) mastered = `<p class="small">${esc(week.fallback)}</p>`;
  return `<section class="panel review" aria-label="Last 7 days">
    <p class="h3">Last 7 days</p>
    <div class="rv-head"><span class="rv-n num">${week.questions}</span><span class="h2">question${week.questions === 1 ? '' : 's'} reviewed</span></div>
    <p class="small muted">${plural(week.answers, 'answer')}: ${week.right} right · ${week.partial} partly · ${week.wrong} wrong · practised on ${week.practised} of 7 days</p>
    <div class="legend small"><span><i style="background:var(--c-right)"></i>Right</span><span><i style="background:var(--c-partial)"></i>Partly</span><span><i style="background:var(--c-wrong)"></i>Wrong</span></div>
    ${activityChart(week.days)}
    ${mastered ? `<div class="sub"><p class="h3">Newly mastered</p>${mastered}</div>` : ''}
    <div class="sub"><p class="h3">Compared with your goals</p><ul class="checklist">${checks.map(c => `<li>${tick(c.ok)}<span>${row(c)}</span></li>`).join('')}</ul></div>
  </section>`;
}

function activityChart(days) {
  // 每天一根按对、部分对、错叠起来的柱子（最后一天是今天）；每天一个提示
  const n = days.length, slot = 40, bw = 24, W = n * slot, H = 120, top = 16, base = H - 20;
  const max = Math.max(1, ...days.map(d => d.right + d.partial + d.wrong));
  const sc = v => v / max * (base - top);
  const order = [['right', 'var(--c-right)'], ['partial', 'var(--c-partial)'], ['wrong', 'var(--c-wrong)']];
  let bars = '', labels = '';
  days.forEach((d, i) => {
    const x = i * slot + (slot - bw) / 2, tot = d.right + d.partial + d.wrong;
    let y = base;
    const segs = order.filter(([k]) => d[k] > 0);
    segs.forEach(([k, c], si) => {
      // 自下而上叠；除最上一段外，每段顶部留 2px 底色间隔
      const full = sc(d[k]), isTop = si === segs.length - 1;
      y -= full;
      const gap = isTop ? 0 : Math.min(2, full / 2);
      bars += `<rect x="${x}" y="${(y + gap).toFixed(1)}" width="${bw}" height="${Math.max(1, full - gap).toFixed(1)}" rx="${isTop ? 3 : 0}" fill="${c}"></rect>`;
    });
    if (!tot) bars += `<rect x="${x}" y="${base - 2}" width="${bw}" height="2" rx="1" fill="var(--line)"></rect>`;
    else labels += `<text x="${x + bw / 2}" y="${(base - sc(tot) - 4).toFixed(1)}" text-anchor="middle" class="ch-val">${tot}</text>`;
    labels += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" class="ch-x">${i === n - 1 ? 'Today' : wd(d.date)}</text>`;
    bars += `<rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent" class="ch-hit"><title>${fmtDate(d.date)}: ${d.right} right, ${d.partial} partly, ${d.wrong} wrong</title></rect>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Answers in the last ${n} days">${bars}${labels}<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"></line></svg>`;
}

/* 总进度：掌握进度与阶梯分布 */
function progressBlock(db) {
  const pct = db.total ? Math.round(db.mastered / db.total * 100) : 0;
  const steps = [['1st redo (day 1)', db.ladder[1]], ['2nd redo (day 3)', db.ladder[2]], ['3rd redo (day 7)', db.ladder[3]], ['4th redo (day 14)', db.ladder[4]], ['Mastered', db.ladder.mastered]];
  const maxStep = Math.max(1, ...steps.map(s => s[1]));
  return `<section class="panel dash" aria-label="Progress">
    <div class="dash-block">
      <div class="row"><p class="h3 grow">Mastered</p><span class="num"><b>${db.mastered}</b> / ${db.total}</span></div>
      <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${db.total}" aria-valuenow="${db.mastered}" aria-label="Mastered"><i style="width:${pct}%"></i></div>
      <p class="small muted">A question is mastered when you get it right on the 4th redo.</p>
    </div>
    <div class="dash-block">
      <p class="h3">Waiting for</p>
      <div class="ladder-bars">${steps.map(([k, v]) => `<div class="lb-row"><span class="lb-k">${k}</span><span class="lb-bar"><i style="width:${(v / maxStep * 100).toFixed(1)}%" class="${k === 'Mastered' ? 'm' : ''}"></i></span><span class="lb-v num">${v}</span></div>`).join('')}</div>
    </div>
  </section>`;
}

function exById(id) { return S.exercises.find(e => e.id === id); }

function bankOf(e) { const x = e.setId && setById(e.setId); return x ? parseList(x.wordBank) : []; }
function mustUseNote(e, response) {
  const c = mustUseCheck(response, e.mustUse);
  if (!c) return '';
  const out = c.missing.map(m => `Your answer must use "${m}".`);
  if (c.multi) out.push('Your answer must be one sentence.');
  return out.join(' ');
}
function questionBody(e, opts) {
  // opts: {no, name: input name prefix, response, locked, showCorrect}
  const o = opts || {};
  let h = `<div class="qhead">${o.no != null ? `<span class="qno">${o.no}.</span>` : ''}${subjChip(e.subject)}<span class="chip">${esc(topicLabel(e.subject, e.topic, 'en'))}</span>${e.test ? '<span class="chip test">TEST</span>' : ''}</div>`;
  if (e.stem) h += `<div class="stem">${ul(e.stem)}</div>`;
  h += photosBlock(e.images, 'Question photo');
  const r = o.response || '';
  if (e.format === 'mcq') {
    h += `<div class="opts" role="group" aria-label="Options">${(e.options || []).map((t, i) => {
      const L = LETTERS[i];
      let cls = '';
      if (o.showCorrect) { if (L === String(e.answer).toUpperCase()) cls = ' is-right'; else if (L === r) cls = ' is-wrong'; }
      return `<button type="button" class="opt${cls}" data-act="pick" data-key="${esc(o.key)}" data-v="${L}" aria-pressed="${r === L}" ${o.locked ? 'disabled' : ''}><span class="l">(${i + 1})</span><span>${esc(t)}</span></button>`;
    }).join('')}</div>`;
  } else if (e.format === 'pick' && bankOf(e).length) {
    // 选词：词表作为作答按钮，点选的词即回答
    h += `<div class="small muted">Choose from the word bank</div><div class="bank" role="group" aria-label="Word bank">${bankOf(e).map(w => {
      let cls = '';
      if (o.showCorrect) { if (normAnswer(w) === normAnswer(e.answer)) cls = ' is-right'; else if (w === r) cls = ' is-wrong'; }
      return `<button type="button" class="opt word${cls}" data-act="pick" data-key="${esc(o.key)}" data-v="${esc(w)}" aria-pressed="${r === w}" ${o.locked ? 'disabled' : ''}>${esc(w)}</button>`;
    }).join('')}</div>`;
  } else if (e.format === 'short' || e.format === 'pick') {
    h += `<label class="f"><span>Your answer</span><input type="text" class="answer-in" id="ans-${esc(o.key)}" data-ans="${esc(o.key)}" value="${esc(r)}" ${o.locked ? 'disabled' : ''} autocomplete="off"></label>`;
  } else {
    h += `<label class="f"><span>Your answer</span><textarea class="answer-in" id="ans-${esc(o.key)}" data-ans="${esc(o.key)}" rows="4" ${o.locked ? 'disabled' : ''}>${esc(r)}</textarea></label>`;
  }
  return h;
}

function explanationHtml(text) {
  const x = parseExplanation(text);
  if (!x.structured) return `<div class="exp">${x.paras.map(p => `<p>${hl(p)}</p>`).join('')}</div>`;
  let h = '<div class="exp why">';
  if (x.keyIdea) h += `<div class="why-sec"><div class="why-h">Key idea</div><p>${hl(x.keyIdea)}</p></div>`;
  if (x.steps.length) h += `<div class="why-sec"><div class="why-h">Steps</div><ol>${x.steps.map(t => `<li>${hl(t)}</li>`).join('')}</ol></div>`;
  if (x.watchOut.length) h += `<div class="why-sec watch"><div class="why-h">Watch out</div>${x.watchOut.length > 1 ? `<ul>${x.watchOut.map(t => `<li>${hl(t)}</li>`).join('')}</ul>` : `<p>${hl(x.watchOut[0])}</p>`}</div>`;
  return h + '</div>';
}
function solutionBlock(e) {
  let ans = '';
  if (e.format === 'mcq') { const i = LETTERS.indexOf(String(e.answer).toUpperCase()); ans = `(${i + 1}) ${e.options && e.options[i] != null ? e.options[i] : ''}`; }
  else ans = e.answer;
  const c = nameOf(e.subject, 'concept', e.concept), q = nameOf(e.subject, 'qtype', e.qtype);
  const links = [c ? 'Concept: ' + mapLink(e.subject, e.concept, c.en) : '', q ? 'Question type: ' + mapLink(e.subject, e.qtype, q.en) : ''].filter(Boolean).join(' · ');
  return `<div class="solution">
    <div><span class="muted small">${e.format === 'open' ? 'Model answer' : 'Correct answer'}</span><div class="ans">${e.format === 'open' ? hl(ans) : esc(ans)}</div></div>
    ${e.solution ? `<div><span class="muted small">Why</span>${explanationHtml(e.solution)}</div>` : ''}
    ${links ? `<div class="small muted">${links}</div>` : ''}
  </div>`;
}
const markHtml = r => `<span class="mark ${r}">${RESULT[r].sym} ${RESULT[r].en}</span>`;

function renderPaperRun() {
  // 检验卷与每日卷同一个作答页：答完交卷；交卷即存客观题，主观题自评即存并锁定
  const R = S.run;
  const p = S.papers.find(x => x.id === R.paperId);
  if (!p) return `<div class="panel"><p>That paper is gone.</p><div><button class="btn" type="button" data-act="exit-run">Back</button></div></div>`;
  const exs = p.exerciseIds.map(exById).filter(Boolean);
  let h = `<div class="progress"><span class="small muted">${esc(p.title)}</span><div class="grow"></div>${R.phase === 'answer' ? '<button type="button" class="btn ghost small" data-act="exit-run">Stop</button>' : ''}</div>`;
  if (R.phase === 'review') {
    // 得分立即显示：客观题交卷即判，主观题自评存好后算进
    const s = tally(exs.filter(e => e.format === 'open' ? R.saved[e.id] : R.results[e.id]).map(e => R.results[e.id]));
    const toMark = exs.filter(e => e.format === 'open' && !R.saved[e.id]).length;
    h += `<section class="panel"><p class="h3">${R.saving ? 'Saving…' : R.handed ? 'Handed in · saved' : 'Not saved yet'}</p>
      <div class="row"><span class="score num">${s.right}/${exs.length}</span><span class="muted">${s.right} right · ${s.partial} partly · ${s.wrong} wrong${toMark ? ` · ${toMark} to self-mark` : ''}</span></div>
      <p class="muted small">${toMark ? 'Check your written answers against the model answers below and mark each one.' : 'Any you missed go back to the start of the ladder.'}</p></section>`;
  }
  h += exs.map((e, i) => {
    const key = 'p' + i;
    let x = (e.setId && (i === 0 || exs[i - 1].setId !== e.setId)) ? materialBlock(setById(e.setId), true) : '';
    x += `<article class="sheet">${questionBody(e, { key, no: i + 1, response: R.responses[e.id] || '', locked: R.phase !== 'answer', showCorrect: R.phase === 'review' })}`;
    if (R.phase === 'review') {
      const res = R.results[e.id];
      if (e.format !== 'open' && res) x += `<div>${markHtml(res)}</div>`;
      x += solutionBlock(e);
      if (e.format === 'open') x += R.saved[e.id] ? `<div>${markHtml(res)}</div>`
        : `<div class="selfmark" role="group" aria-label="Self-mark">${['right', 'partial', 'wrong'].map(r => `<button type="button" data-act="paper-self" data-id="${esc(e.id)}" data-r="${r}" ${R.handed && !R.saving ? '' : 'disabled'}>${RESULT[r].sym} ${RESULT[r].en}</button>`).join('')}</div>`;
    }
    return x + '</article>';
  }).join('');
  if (R.phase === 'answer') h += `${R.warn ? `<div class="note err">${R.warn.map(w => `<div>${esc(w)}</div>`).join('')}<div>You can fix them, or hand in anyway.</div></div>` : ''}<div class="row"><button type="button" class="btn primary" data-act="paper-submit">${R.warn ? 'Hand in anyway' : 'Hand in'}</button></div>`;
  else h += `<div class="row">${R.handed ? '' : `<button type="button" class="btn primary" data-act="paper-submit" ${R.saving ? 'disabled' : ''}>${R.saving ? 'Saving…' : 'Save again'}</button>`}<button type="button" class="btn${R.handed ? ' primary' : ''}" data-act="exit-run">Back to today</button></div>`;
  if (R.err) h += `<p class="note err">${esc(R.err)}</p>`;
  return h;
}

/* ---------- 管理标签 ---------- */
function renderManage() {
  let h = '';
  if (S.tab === 'record') h = renderRecord();
  else if (S.tab === 'exercises') h = renderExercises();
  else if (S.tab === 'papers') h = S.paperView ? renderPaperSheet(S.paperView) : renderPapers();
  else h = renderSettings();
  return `<div style="display:grid;gap:16px">${h}</div>`;
}

function subjectOptions(sel, withAuto) {
  return (withAuto ? `<option value="">Let AI decide</option>` : `<option value="">Choose subject</option>`) + SUBJECTS.map(s => `<option value="${s[0]}" ${sel === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('');
}

function renderRecord() {
  const L = S.imgLimits, canPhoto = !!(S.assets && L), canSample = !!S.sample;
  const max = canPhoto ? L.maxCount : 0, n = S.recPhotos.length, full = n >= max, busy = S.recBusy;
  let h = `<section class="panel">
    <p class="h2">Record exercises</p>
    <p class="small muted">Take a photo or paste the question text; AI splits it into drafts. Check each draft before saving, especially the answer.</p>`;
  if (canPhoto) {
    // 两个按钮：拍照（直接开相机）与选照片（从相册或文件里多选）
    const off = full || busy, acc = esc((L.mediaTypes || ['image/*']).join(','));
    h += `<div class="picks">
      <label class="pick${off ? ' off' : ''}"><input type="file" id="rec-camera" data-photos="1" accept="${acc}" capture="environment" ${off ? 'disabled' : ''}><span class="pick-ico" aria-hidden="true">📷</span><span class="pick-main">Take photo</span></label>
      <label class="pick${off ? ' off' : ''}"><input type="file" id="rec-files" data-photos="1" accept="${acc}" multiple ${off ? 'disabled' : ''}><span class="pick-ico" aria-hidden="true">🖼️</span><span class="pick-main">Choose photos</span></label>
    </div><p class="pick-sub">${full ? `Limit of ${max} photos reached` : `Add them one by one, up to ${max}`}</p>`;
    if (n) h += `<div class="tray">${S.recPhotos.map((p, i) => `<span class="tray-item"><img src="${p.url}" alt="Photo ${i + 1}"><button type="button" class="tray-x" data-act="drop-photo" data-i="${i}" aria-label="Remove photo ${i + 1}" ${busy ? 'disabled' : ''}>×</button></span>`).join('')}<span class="small muted">${n} / ${max} chosen</span></div>`;
  } else if (canSample) h += `<p class="small muted">This page can't send photos to AI right now; paste the question text instead.</p>`;
  h += `<label class="f"><span>Or paste the question text</span><textarea id="rec-text" data-bind="recText" rows="3" placeholder="e.g. Which of the following is a non-flowering plant? (1) hibiscus (2) fern (3) rice (4) mango — Sophia chose (1)">${esc(S.recText)}</textarea></label>
    <div class="rec-go">
      <label class="f"><span>Subject</span><select id="rec-subject" data-bind="recSubject">${subjectOptions(S.recSubject, true)}</select></label>
      <label class="f"><span>Owner</span><select id="rec-owner" data-bind="recOwner">${ownerOptions(recOwner())}</select></label>
      <button type="button" class="btn primary" data-act="recognise" ${(!canSample || busy) ? 'disabled' : ''}>${busy ? 'Reading…' : 'Read with AI'}</button>
    </div>
    ${!canSample ? '<p class="note err">Reading with AI is unavailable right now, so exercises can\'t be recorded here for the moment.</p>' : ''}
    ${S.recMsg ? `<p class="note ${S.recMsg.kind}">${esc(S.recMsg.text)}</p>` : ''}
  </section>`;
  const newDrafts = S.drafts.filter(d => !d.editId);
  const saveNote = S.saveMsg ? `<p class="note ${S.saveMsg.kind}">${esc(S.saveMsg.text)}</p>` : '';
  if (newDrafts.length || S.setDrafts.length) {
    h += `<div id="rec-drafts" style="display:grid;gap:8px"><div class="row"><p class="h2 grow">To check: ${plural(newDrafts.length, 'exercise')}${S.setDrafts.length ? `, ${plural(S.setDrafts.length, 'question set')}` : ''}</p><button type="button" class="btn primary" data-act="save-all">Save all</button><button type="button" class="btn ghost" data-act="discard-all">Discard all</button></div>${saveNote}</div>`;
    for (const sd of S.setDrafts) {
      const members = newDrafts.filter(d => d.setRef === 'new:' + sd.key);
      h += setForm(sd, members.length);
      h += members.map(d => `<div class="member">${draftForm(d)}</div>`).join('');
    }
    h += newDrafts.filter(d => !S.setDrafts.some(sd => d.setRef === 'new:' + sd.key)).map(draftForm).join('');
  } else h += saveNote;
  return h;
}

function clearPhotos() {
  for (const p of S.recPhotos) URL.revokeObjectURL(p.url);
  S.recPhotos = [];
}
function addPhotos(files) {
  const L = S.imgLimits, skipped = [];
  for (const f of files) {
    if (S.recPhotos.length >= L.maxCount) skipped.push(`"${f.name}" is over the limit of ${L.maxCount} photos`);
    else if (L.maxInputBytes && f.size > L.maxInputBytes) skipped.push(`"${f.name}" is too large (max ${Math.floor(L.maxInputBytes / 1048576 * 10) / 10} MB); use another photo or shrink it first`);
    else S.recPhotos.push({ file: f, url: URL.createObjectURL(f), assetId: null });
  }
  if (skipped.length) S.recMsg = { kind: 'err', text: 'Not added: ' + skipped.join('; ') + '.' };
}

function setForm(sd, nMembers) {
  const k = sd.key, edit = k === 'edit';
  const inp = (field, v, ph) => `<input type="text" id="s${k}-${field}" data-s="${k}" data-f="${field}" value="${esc(v)}" placeholder="${esc(ph || '')}">`;
  let h = `<section class="panel setcard" id="set-${k}">

  const inp = (field, v, ph) => `<input type="text" id="d${k}-${field}" data-d="${k}" data-f="${field}" value="${esc(v)}" placeholder="${esc(ph || '')}">`;
  const ta = (field, v, rows, ph) => `<textarea id="d${k}-${field}" data-d="${k}" data-f="${field}" rows="${rows}" placeholder="${esc(ph || '')}">${esc(v)}</textarea>`;
  let h = `<section class="panel draft" id="draft-${k}">
    <div class="row"><p class="h3 grow">${d.editId ? 'Edit exercise' : 'Draft'}</p>${d.editId ? '' : `<button type="button" class="btn ghost small" data-act="drop-draft" data-k="${k}">Discard this one</button>`}</div>

      ${f('concept', 'Concept', `<select id="d${k}-concept" data-d="${k}" data-f="concept"><option value="">(none)</option>${concepts}</select>`)}
      ${f('qtype', 'Question type', `<select id="d${k}-qtype" data-d="${k}" data-f="qtype"><option value="">(none)</option>${qtypes}</select>`)}
      ${f('format', 'Answer format', `<select id="d${k}-format" data-d="${k}" data-f="format" data-rerender="1">${FORMATS.map(x => `<option value="${x[0]}" ${d.format === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select>`)}
      ${f('cause', 'Error cause', `<select id="d${k}-cause" data-d="${k}" data-f="cause">${CAUSES.map(c => `<option value="${c[0]}" ${d.cause === c[0] ? 'selected' : ''}>${c[1]}</option>`).join('')}</select>`)}
      ${d.editId ? f('owner', 'Owner', `<select id="d${k}-owner" data-d="${k}" data-f="owner">${ownerOptions(d.owner)}</select>`) : ''}
    </div>
    ${f('setRef', 'Question set', `<select id="d${k}-setRef" data-d="${k}" data-f="setRef" data-rerender="1"><option value="">None (stand-alone question)</option>${S.setDrafts.filter(sd => !sd.subject || !s || sd.subject === s).map(sd => `<option value="new:${sd.key}" ${d.setRef === 'new:' + sd.key ? 'selected' : ''}>New in this batch: ${esc(sd.title || 'Untitled set')}</option>`).join('')}${(s ? liveSets(s) : []).map(x => `<option value="${esc(x.id)}" ${d.setRef === x.id ? 'selected' : ''}>${esc(x.title || 'Untitled set')}</option>`).join('')}</select>`)}
    ${f('stem', (d.setRef ? 'Question text (only this question; the material is in the set)' : 'Question text') + '; [[ ]] shows as underlined', ta('stem', d.stem, 4))}`;
  if (d.images.length) h += `<div class="imgs thumbs">${d.images.map((id, i) => `<span style="display:grid;gap:4px;justify-items:start"><img src="${blobUrl(id)}" alt="Question photo ${i + 1}"><button type="button" class="btn ghost small" data-act="drop-img" data-k="${k}" data-i="${i}">Remove photo</button></span>`).join('')}</div>`;
  if (d.format === 'mcq') {

      <div class="row"><button type="button" class="btn ghost small" data-act="add-opt" data-k="${k}">Add an option</button>${d.options.length > 2 ? `<button type="button" class="btn ghost small" data-act="del-opt" data-k="${k}">Remove the last one</button>` : ''}</div>
      <div class="grid2">${f('answer', 'Correct option *', `<select id="d${k}-answer" data-d="${k}" data-f="answer">${d.options.map((o, i) => `<option value="${LETTERS[i]}" ${String(d.answer).toUpperCase() === LETTERS[i] ? 'selected' : ''}>(${i + 1})</option>`).join('')}</select>`)}
      ${f('wrongAnswer', 'Chosen at the time', inp('wrongAnswer', d.wrongAnswer, 'e.g. (1)'))}</div>`;
  } else if (d.format === 'pick') {

  } else if (d.format === 'short') {
    h += `<div class="grid2">${f('answer', 'Correct answer *', inp('answer', d.answer))}${f('accepted', 'Other accepted answers (separated by ;)', inp('accepted', d.accepted, 'e.g. 0.5; 1/2'))}${f('wrongAnswer', 'Answer at the time', inp('wrongAnswer', d.wrongAnswer))}</div>`;
  } else {
    h += f('answer', 'Model answer * (wrap the words that earn marks in [[ ]])', ta('answer', d.answer, 3, 'e.g. Warmer [[water vapour]] in the surrounding air [[loses heat]] to the [[cooler surface]] and [[condenses]].'));
    h += f('wrongAnswer', 'Answer at the time', ta('wrongAnswer', d.wrongAnswer, 2));
    h += f('mustUse', 'Must-use words (for synthesis; separated by ;, write split pairs as Neither…nor)', inp('mustUse', d.mustUse, 'e.g. Despite'));
  }
  h += f('solution', 'Explanation (three parts: Key idea: … / Steps: 1. … / Watch out: …; key words in [[ ]])', ta('solution', d.solution, 5, 'Key idea: …\nSteps:\n1. …\n2. …\nWatch out: …'));
  h += `<div class="grid2">${f('source', 'Source', inp('source', d.source, 'e.g. 2026 P5 SA2 Paper 2 Q7'))}</div>`;
  if (d.error) h += `<p class="note err">${esc(d.error)}</p>`;
  h += `<div class="row"><button type="button" class="btn primary" data-act="save-draft" data-k="${k}">${d.editId ? 'Save changes' : 'Save this one'}</button>${d.editId ? `<button type="button" class="btn ghost" data-act="cancel-edit" data-k="${k}">Cancel</button>` : ''}</div></section>`;
  return h;
}

function newDraft(x) {
  x = x || {};
  const subject = SUBJ[x.subject] ? x.subject : (S.recSubject || '');
  const topic = subject && nameOf(subject, 'topic', x.topic) ? x.topic : '';
  const concept = topic && nameOf(subject, 'concept', x.concept) && IDX[subject].concept[x.concept].topic === topic ? x.concept : '';
  const qtype = subject && nameOf(subject, 'qtype', x.qtype) ? x.qtype : '';
  const format = ['mcq', 'pick', 'short', 'open'].includes(x.format) ? x.format : 'open';
  let options = Array.isArray(x.options) ? x.options.map(String) : [];
  if (format === 'mcq') while (options.length < 4) options.push('');
  return {
    key: draftSeq++, editId: x.editId || null, owner: x.owner || null, subject, topic, concept, qtype, format,
    stem: String(x.stem || ''), options: format === 'mcq' ? options : ['', '', '', ''],
    answer: String(x.answer || (format === 'mcq' ? 'A' : '')),
    accepted: Array.isArray(x.accepted) ? x.accepted.filter(a => normAnswer(a) !== normAnswer(x.answer)).join('; ') : String(x.accepted || ''),
    solution: String(x.solution || ''), wrongAnswer: String(x.wrongAnswer || ''),
    cause: CAUSE[x.cause] ? x.cause : 'concept', source: String(x.source || ''),
    images: Array.isArray(x.images) ? x.images.slice() : [], error: (x.topic && !topic) ? "Claude's topic isn't in the list; please choose one." : '',
    setRef: x.setRef != null ? String(x.setRef) : String(x.setId || ''), origSetId: x.setId || null, setPos: x.setPos || null,
    mustUse: parseList(x.mustUse).join('; ')
  };
}

function draftToDoc(d) {
  const err = [];
  if (!SUBJ[d.subject]) err.push('subject');
  if (!d.topic) err.push('topic');
  const sd = setOfDraft(d);
  if (d.setRef && !sd) err.push('question set');
  if (sd && sd.subject && sd.subject !== d.subject) err.push('the same subject as its set');
  const hasMat = sd && (String(sd.text || '').trim() || (sd.images || []).length);
  if (!d.stem.trim() && !d.images.length && !hasMat) err.push('question text or photo');
  const options = d.format === 'mcq' ? d.options.map(o => o.trim()) : [];
  if (d.format === 'mcq' && options.filter(Boolean).length < 2) err.push('at least two options');
  if (!String(d.answer).trim()) err.push('answer');
  if (d.format === 'pick') {
    const bank = sd ? parseList(sd.wordBank) : [];
    if (!bank.length) err.push('a question set with a word bank');
    else if (!bank.some(w => normAnswer(w) === normAnswer(d.answer))) err.push('an answer from the word bank');
  }
  if (!(d.editId ? d.owner : recOwner())) err.push('owner');
  if (err.length) return { error: 'Still missing: ' + err.join(', ') };
  const accepted = d.format === 'short' ? [d.answer.trim()].concat(d.accepted.split(';').map(a => a.trim()).filter(Boolean)) : [];
  return { doc: {
    subject: d.subject, topic: d.topic, concept: d.concept || null, qtype: d.qtype || null, format: d.format,
    stem: d.stem.trim(), images: d.images, options, answer: String(d.answer).trim(), accepted,
    solution: d.solution.trim(), wrongAnswer: d.wrongAnswer.trim(), cause: d.cause, source: d.source.trim(),
    mustUse: d.format === 'open' ? parseList(String(d.mustUse || '').replace(/\n/g, ';')) : []
  } };
}
